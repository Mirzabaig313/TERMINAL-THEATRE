# Tests, lints and story checks on every push and pull request, on all three
# systems the game is released for.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers (sound)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (every story is also played through every route)
        run: cargo test
      - name: Silent build (no sound library)
        if: runner.os == 'Linux'
        run: cargo clippy -p terminal-theatre --no-default-features --all-targets -- -D warnings
      - name: Story checker (Python)
        if: runner.os == 'Linux'
        run: |
          for s in stories/*/; do python3 tools/check_story.py "$s"; done
      - name: Installer script
        if: runner.os == 'Linux'
        run: sh -n install.sh
