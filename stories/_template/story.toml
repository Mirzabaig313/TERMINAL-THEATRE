# Copy this folder to stories/<your_story_id>/ to start a new story.
# Folders starting with "_" are hidden from the menu.

title = "MY NEW STORY"
description = "One or two lines shown on the story-select screen."
start = "opening"

# speaker whose portrait waits beside the choice menu (optional)
player = "hero"
# character shown on the story-select screen (optional, a file in characters/)
cover = "hero"
# mood of the story-select screen: noir | danger | alert | calm | mystery
cover_mood = "noir"
# mood for scenes that do not set one (scene ids containing words like
# "fight", "dream" or "secret" also pick a mood automatically)
default_mood = "noir"
# how scenes come on screen unless they say otherwise:
# dissolve (default) | fade | sweep | rise | coalesce | cut
transition = "dissolve"

# Background sound for every scene (scenes can choose their own with `ambience`):
# rain | storm | city | neon | wind | drone | dream | silence, or an audio file
# in this folder (.ogg, .wav, .mp3, .flac), e.g. "sounds/club.ogg"
ambience = "rain"
# ...or by mood: scenes of that mood use it unless they choose their own
[ambience_moods]
danger = "drone"

# Recolor any mood for this story. Keys: bg panel border text dim accent mote
[themes.noir]
accent = "#d4af37"

# Everyone who speaks. `sprite` is a file in characters/ (without .toml).
[speakers.hero]
name = "YOU"
sprite = "hero"

[speakers.hero_thinking]
name = "YOU (thinking)"
sprite = "hero"
thought = true

[speakers.stranger]
name = "STRANGER"
sprite = "stranger"

[speakers.narrator_voice]
name = "A VOICE"
# no sprite: the line is shown without a portrait
