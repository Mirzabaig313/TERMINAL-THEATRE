# Scenes can be split across any number of files in scenes/ (loaded in name order).
# Each [table] is one scene; its name is the scene id used by `goto`.

[opening]
text = """
Rain on the window. A knock at the door.

Paragraphs are separated by a blank line."""
# still ASCII art for the top of the screen (optional)
art = """
   ┌────────────┐
   │  ░░░░░░░░  │
   │  ░ RAIN ░  │
   │  ░░░░░░░░  │
   └────────────┘"""
# a picture for the stage (PNG or JPEG inside the story folder). Terminals with
# Kitty, iTerm2 or Sixel graphics show the real image, others draw it in
# character cells; players who turn Scene Images off see the ASCII art above.
image = "images/rain.png"
mood = "mystery"
# a sound once the scene is on screen: gunshot | thunder | knock | phone | siren |
# glass | heartbeat | impact | static | sting | whoosh | warble | chill | chime |
# footsteps | silence, or an audio file in the story folder ("sounds/x.ogg").
# Lines take `sound` too. Effects make a fitting sound of their own unless a
# sound is given (`sound = "silence"` keeps an effect quiet).
sound = "knock"
set_flags = ["heard_knock"]
dialogue = [
  { who = "hero_thinking", line = "Who knocks at this hour?" },
  # mood = an expression of the speaker's sprite
  # fx = a screen effect when the line starts: shake | glitch | flash | blood |
  #      blackout | lightning | heartbeat | dizzy | chill | static | reveal
  { who = "stranger", line = "Let me in. Please.", mood = "afraid", fx = "shake" },
]

[[opening.choices]]
text = "Open the door"
goto = "door_open"
# counters: any name you like, they start at 0. `add` changes, `set` replaces.
# Choices (and scenes) can also set_flags / add_items when taken.
add = { courage = 1 }

[[opening.choices]]
text = "Stay silent"
goto = "silence"
add = { caution = 1 }

[door_open]
text = "The stranger stumbles inside, soaked and shaking."
# how the scene comes on screen: dissolve | fade | sweep | rise | coalesce | cut
# (the story's `transition` when missing)
transition = "sweep"
# a screen effect once the scene is on screen (same names as a line's fx)
fx = "lightning"
# SVG pictures work too: drawn sharp at any size
image = "images/doorway.svg"
add_items = ["Wet Letter"]
# animated art: frames shown in turn every art_ms milliseconds
art_frames = [
"""
  .  '  .  '
 '  .  '  .""",
"""
 '  .  '  .
  .  '  .  '""",
]
art_ms = 300
dialogue = [
  { who = "stranger", line = "They're coming for both of us now.", mood = "sad" },
  { who = "hero", line = "Then we'd better move.", mood = "angry" },
]

[[door_open.choices]]
text = "Read the letter"
goto = "ending_letter"
# only shown when the player has this item (or any_flags = [...])
any_items = ["Wet Letter"]

[silence]
text = "The knocking stops. Footsteps fade into the rain."
transition = "fade"
# this scene's own background sound
ambience = "wind"
dialogue = [
  { who = "narrator_voice", line = "Some doors should stay closed.", fx = "chill" },
]

[[silence.choices]]
text = "Go back to sleep"
goto = "ending_letter"

[[silence.choices]]
text = "Open the door after all"
goto = "door_open"
# a condition: counters, flag("x"), item("x"), visited("scene"),
# + - == != < <= > >= ! && || and parentheses
if = "caution >= 1 && !visited('door_open')"
add = { courage = 1 }

[ending_letter]
text = "Whatever happens next, it starts here."
# other openings: the first variant whose condition holds replaces `text`.
# {name} puts a counter's value into any text; {{ and }} are literal braces.
variants = [
  { if = "caution >= 1 && courage >= 1", text = "You hesitated, then opened the door anyway. Courage: {courage}. Whatever happens next, it starts here." },
  { if = "item('Wet Letter')", text = "The letter is damp in your hands. Whatever happens next, it starts here." },
]
dialogue = [
  # a line can have a condition too: it is skipped when the condition fails
  { who = "hero_thinking", line = "Should have kept the door shut.", if = "caution >= 1 && courage == 0" },
]
ending = true
