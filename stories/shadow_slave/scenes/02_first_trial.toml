[clever_victory]
ending = true
text = """
You don't fight the Guardian head-on. That would be suicide.

Instead, you use what you've learned. You've watched how things move in this city, what they fear, where the stone is tired. So you let the Guardian chase you - just fast enough to keep it angry, never fast enough to let it catch you - through streets you chose, past pillars you chose, into the leaning quarter where the old towers stand on cracked foundations and borrowed time.

It follows. It always follows. It does not know how to do anything else.

You slip beneath an arch. The Guardian, too large, goes through it instead. Stone groans. Dust sifts down in a fine rain. Then the whole weakened colonnade gives way, and a thousand years of masonry comes down on the Fallen Terror like the fist of an angry god.

When the dust settles, nothing moves under the rubble but slow-fading shadow.

You realize something important, sitting in the ash and laughing a little too hard: strength isn't everything."""
