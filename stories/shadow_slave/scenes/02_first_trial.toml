  { who = "your_thoughts", line = "This is dangerous. I can feel it. But the power... it could save my life." },
  { who = "your_thoughts", line = "Do I trust this voice? Can I afford NOT to?" },
]
[[mysterious_glow.choices]]
text = "Drink the glowing liquid"
goto = "drink_essence"
[[mysterious_glow.choices]]
