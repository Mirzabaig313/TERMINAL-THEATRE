        ║        ░▒▓███████████████████▓▒░             ║
        ║         ░░▒▒▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▒▒░░              ║
        ║           ░░░▒▒▒▒▒▒▒▒▒▒▒▒▒░░░                ║
        ║              ░░░░░░░░░░░░░░░                  ║
        ║                                               ║
        ║  "It pulses with otherworldly light,          ║
        ║   promising power... at a price."             ║
        ║                                               ║
        ╚═══════════════════════════════════════════════╝
        """
dialogue = [
  { who = "unknown_voice", line = "Drink, young Aspirant. Become more than human." },
  { who = "unknown_voice", line = "The shadows will answer your call... if you have the will to command them." },
  { who = "your_thoughts", line = "This is dangerous. I can feel it. But the power... it could save my life.", mood = "afraid" },
  { who = "your_thoughts", line = "Do I trust this voice? Can I afford NOT to?", mood = "pained" },
  { who = "unknown_voice", line = "You already let go once, on the way down. The second time is so much easier.", if = "corruption >= 1" },
  { who = "unknown_voice", line = "Back again. They always come back.", if = "visited('refuse_essence')" },
]
[[mysterious_glow.choices]]
text = "Drink the glowing liquid"
goto = "drink_essence"
[[mysterious_glow.choices]]
text = "Refuse and back away"
goto = "refuse_essence"
if = "!visited('refuse_essence')"
[[mysterious_glow.choices]]
text = "Turn your back on it a second time"
goto = "first_awakening"
if = "visited('refuse_essence')"

[observe_creatures]
text = """
You flatten yourself behind a slab of fallen masonry and watch the shadow beasts, learning their patterns.

It takes a long time to see it, but once you do, you can't unsee it. They move as one animal. When the largest lifts its head, the others pause. When it lowers its head, they all take three slow steps forward. They never look up. Whatever they fear, it isn't in the sky - it's somewhere ahead, toward the heart of the ruined city, and they give that direction a wide berth.

They're not aggressive, you realize. Just... present. Existing in this twisted reality like everything else.

Then the largest one lifts its head and holds it there. Too long. Its eyeless face turns, slowly, in your direction."""
set_flags = ["observed_beasts"]
dialogue = [
  { who = "your_thoughts", line = "Don't move. Don't even breathe.", mood = "afraid", fx = "heartbeat" },
]
[[observe_creatures.choices]]
text = "Stay perfectly still"
goto = "stealth_success"
[[observe_creatures.choices]]
text = "Run before it fully notices you"
goto = "alert_creatures"

[sneak_past_creatures]
text = """
You move with careful precision, using the ruins as cover.

Your heart hammers in your chest, but you force yourself to move slowly. One step. Then another. A beast passes so close that you feel the cold coming off it, like standing in front of an open freezer.

You're halfway past when your foot dislodges a loose stone. It rattles down the rubble, impossibly loud."""
dialogue = [
  { who = "your_thoughts", line = "No!", mood = "afraid", fx = "shake" },
]
[[sneak_past_creatures.choices]]
text = "Freeze and hope they ignore it"
goto = "stealth_check"
[[sneak_past_creatures.choices]]
text = "Run immediately"
goto = "alert_creatures"
[[sneak_past_creatures.choices]]
text = "Wait for the pause in their three-step rhythm, then move"
goto = "stealth_success"
any_flags = ["listened_first"]

[mysterious_whispers]
fx = "chill"
text = """
You follow the whispers deeper into the ruins, down a stairway slick with something that isn't water.

They lead you to a chamber filled with fading light. Ghostly figures float in the air - echoes of people who once lived here. A woman holding a basket. An old man with a walking stick. Soldiers in rusted half-plate, still standing in formation after who knows how many centuries.

They're trapped. Bound to this place by something ancient and cruel. You can see the faint lines running from each of them to the floor, taut as leashes."""
variants = [
  { if = "mercy < 0", text = """
You come back down the stairway you told yourself you would never take again. It is just as slick, just as cold. Your feet remember every step.

The chamber is the same. The woman with the basket. The old man with the stick. The soldiers in their rusted half-plate, still in formation. The faint lines from each of them to the floor, taut as leashes.

What has changed is the way they look at you. Before, they pleaded. Now they simply watch, the way the drowning watch a boat that has already passed them once.""" },
]
dialogue = [
  { who = "ghost", line = "You came back... everyone does.", mood = "sad", if = "mercy < 0" },
  { who = "ghost", line = "Free us... please... the chains...", mood = "pained" },
  { who = "your_thoughts", line = "How? How can I help you?", mood = "afraid" },
  { who = "ghost", line = "Break... the seal...", mood = "sad" },
]
[[mysterious_whispers.choices]]
text = "Search for the seal they mentioned"
goto = "find_seal"
[[mysterious_whispers.choices]]
text = "Leave them - it's too dangerous"
goto = "abandon_ghosts"

[find_weapon]
text = """
⚔ WEAPON DISCOVERED ⚔

You keep up your methodical search through the ruins. Every stone turned, every shadow investigated.

Your persistence pays off.

Beneath a collapsed pillar, half-buried in debris and centuries of dust, your fingers close around something solid. Metal. You pull it free, sending a shower of pebbles cascading down.

It's a blade - ancient, rusty, the edge chipped and notched from countless battles. The grip is worn smooth by hands long dead. But when you heft it, the balance is perfect. This was a warrior's weapon once. Carried through nightmares and back.

It's not much. But in a realm of nightmares, even a rusty blade is better than bare hands.

You give it a practice swing. The weapon feels right. Deadly."""
art = """

