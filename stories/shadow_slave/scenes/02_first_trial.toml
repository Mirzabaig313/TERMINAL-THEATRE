[coward_ending]
transition = "fade"
ending = true
text = """
You turn and run from the Guardian.

Or you hide, and wait, and tell yourself that waiting is a plan. It amounts to the same thing.

There is nowhere to run. The streets you sprint down curve back on themselves; the doors you dive through open onto the same blood-red square. The Dream Realm has no exits for those who refuse their trials. It only has longer and longer corridors.

You hear it behind you the whole time. Not hurrying. It doesn't need to hurry. Every footfall is patient as a clock.

When it finally catches you, in a dead-end alley that was not a dead end a moment ago, you are almost grateful. You do not even turn around.

The last thing you feel is not pain. It is the Spell's attention sliding off you, bored, the way a reader's eye slides past a sentence that doesn't matter.

Somewhere far away, in a hospital bed, a body stops breathing. Here, in the Dream Realm, your story simply ends mid-page.

The nightmare is eternal."""
art = """

