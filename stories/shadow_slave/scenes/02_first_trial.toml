[read_the_ruins]
transition = "rise"
text = """
You climb until the wind tugs at your clothes, then you stop, cling to cold stone, and look.

The Spell warned you that logic here is flexible - so you stop looking for the logic of a city and start looking for the logic of a nightmare. And there it is.

The streets aren't a grid. They spiral, every one of them, inward toward a great dead plaza at the heart of the ruins where nothing grows and nothing grazes. The shadow herd keeps to the outer rings and never strays toward the center. Something lives there that even monsters avoid.

You mark the rest, too: the eyeless temple to the west; a stairway in the low quarter breathing faint whispers; and between here and the plaza, a district of tall towers leaning against one another like drunks, their foundations split, held up by habit and nothing else.

One good shove, you think. One heavy thing running through the wrong street."""
set_flags = ["mapped_ruins"]
dialogue = [
  { who = "your_thoughts", line = "Everything here spirals toward that plaza. That's where the real test is.", mood = "afraid" },
  { who = "your_thoughts", line = "And those towers... if something big came through there, they'd come down on it.", mood = "smirk" },
]
[[read_the_ruins.choices]]
text = "Head for the eyeless temple"
goto = "dark_archway"
[[read_the_ruins.choices]]
text = "Follow the whispers in the low quarter"
goto = "mysterious_whispers"
[[read_the_ruins.choices]]
text = "Watch the shadow herd from above"
goto = "investigate_shadow"
[[read_the_ruins.choices]]
text = "Go straight to the dead plaza"
goto = "trial_encounter"

[ghost_counsel]
text = """
The light thickens, and one figure does not fade.

He is taller than the others, his coat a soldier's coat, a ring of keys still hanging from his belt as if he might yet have doors to lock. His face is lined and tired and, for the first time in centuries, at peace.

He looks toward the heart of the city, toward a dead plaza you have not yet seen, and the peace leaves his face.

He tells you about the one who waits there. It was a warrior once - the best of them. When the horde came, it held the pass alone so the rest could flee. It swore it would not take one step back, and it kept that oath so long and so hard that the oath ate the warrior and left only the Guardian behind.

It still remembers its words, he says. Somewhere under all that bone, it still remembers."""
set_flags = ["ghost_counsel"]
add = { mercy = 1, resolve = 1 }
dialogue = [
  { who = "ghost_captain", line = "It was our champion, child. 'Not one step back.' That was its oath, and it became its prison.", mood = "sad" },
  { who = "ghost_captain", line = "If you must face it, remember who it was. It may remember, too.", mood = "pained" },
  { who = "your_thoughts", line = "A warrior who couldn't stop fighting... even after there was nothing left to protect.", mood = "pained" },
]
[[ghost_counsel.choices]]
text = "Thank him and go to face the Guardian"
goto = "trial_encounter"
