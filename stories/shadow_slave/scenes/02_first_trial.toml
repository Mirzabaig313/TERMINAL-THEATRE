[shadow_victory]
ending = true
text = """
◈◈◈ THE SHADOWS OBEY ◈◈◈

The Shadow Essence burns through your veins like liquid midnight. You can FEEL them now - the shadows all around you, alive and hungry and waiting.

The Guardian charges. You raise your hand.

And the shadows... RISE.

They erupt from every corner of the ruins, from every crack in the stone, from your own elongated silhouette. Dozens of shadow-forms, humanoid but wrong, each one a fragment of darkness given terrible purpose.

'ATTACK,' you command, and your voice echoes with power that isn't entirely human.

The shadow army swarms the Guardian like locusts. It roars - the first sound you've heard it make - as darkness consumes it from all sides. Its massive fists crush shadow-soldiers by the handful, but for each one destroyed, two more rise to take its place.

In minutes, it's over. The Guardian collapses, overwhelmed by sheer numbers.

As it dissolves, your shadow army turns to you, awaiting further orders. Their eyeless faces seem almost... reverent.

You've become something the Dream Realm respects. Something powerful. Something changed.

But as you stand there, master of shadows, you can't help but wonder: What price will this power ultimately exact from your soul?"""
