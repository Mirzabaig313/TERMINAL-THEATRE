[spirit_aid]
image = "images/spirit_aid.svg"
ending = true
text = """
☆ THE SPIRITS ANSWER YOUR CALL ☆

The Guardian lunges toward you, massive fists ready to crush you into paste.

You cry out - not in fear, but in hope. Calling to the spirits you freed. Praying that kindness means something in this nightmare realm.

For a heartbeat, nothing happens. The Guardian's fist descends.

Then...

Light erupts around you. Not the harsh light of the crimson sky, but soft, silvery radiance. The ghosts appear - no longer formless wisps, but warriors in spectral armor, weapons gleaming with ethereal fire.

'We owe you a debt, Aspirant of Mercy,' they speak as one. 'And we ALWAYS repay our debts.'

The ghost warriors surge forward, three translucent figures moving with the grace of master fighters. They intercept the Guardian's blow, their spirit blades meeting nightmare flesh.

Together, you fight. You - flesh and blood and desperate courage. Them - echoes of the dead, given purpose by your compassion.

The Guardian falls.

As it dissolves, the ghosts turn to you one final time. They smile - truly smile - before fading into peace at last.

Kindness, it turns out, has terrible power in the Dream Realm."""
variants = [
  { if = "mercy >= 3", text = """
☆ THE SPIRITS ANSWER YOUR CALL ☆

The Guardian lunges toward you, massive fists ready to crush you into paste.

You don't even have to finish calling.

Light erupts around you - soft, silvery, clean - and at its centre stands the officer with the ring of keys, the one who stayed behind to warn you. He is not a fading wisp any more. He wears his old coat like armour, and behind him the whole chamber has come: the soldiers in their half-plate, the old man with his stick raised like a spear, even the woman with the basket, who has set it down at last.

'You freed us,' the captain says, 'and then you stayed and listened. Few do both.'

They meet the Guardian's blow together. Spirit blades flash. The captain calls out a name - an old name, a soldier's name - and the Guardian falters at the sound of it, as if somewhere under the bone it still answers to roll call.

Together, you bring it down. Not as a monster. As a comrade being carried off the field.

As it dissolves, the ghosts turn to you one final time. They smile - truly smile - and the captain presses one cold, weightless key into your palm before fading into peace at last.

Kindness, it turns out, has terrible power in the Dream Realm.""" },
  { if = "flag('abandoned_ghosts')", text = """
☆ THE SPIRITS ANSWER YOUR CALL ☆

The Guardian lunges toward you, massive fists ready to crush you into paste.

You cry out to the spirits - and for a long, awful heartbeat you are sure no one will come. You walked away from them once. You would not blame them.

Then light breaks around you, thinner than you hoped. Not the whole chamber - only a handful of them, the soldiers in rusted half-plate, their spectral blades lifted. They do not look at you as they take their places between you and the Guardian. They look at it.

'You left us,' one of them says, without turning. 'Then you came back. We are still deciding which of those you are. Fight, and we will find out.'

You fight. Flesh and blood and something to prove, beside echoes of the dead who are watching you as closely as the enemy.

The Guardian falls.

As it dissolves, the soldiers turn to you at last. One of them nods - just once, a soldier's nod - before they fade into peace.

It is not forgiveness. But it is close enough to carry.""" },
]
