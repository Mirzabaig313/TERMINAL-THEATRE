[trial_encounter]
text = """
⚠ FINAL TRIAL BEGINS ⚠

You've explored the ruins. You've gained power. You've survived this far.

But the Dream Realm has one final test.

The ground trembles beneath your feet. Cracks spiderweb across the basalt stone. The crimson sky darkens, clouds roiling like a storm-tossed sea. The air grows thick with pressure, as if reality itself is holding its breath.

Then... it emerges.

From the deepest shadows of the ruined city comes a being that defies description. A towering colossus of nightmare and bone, shadow and malice given physical form. It stands three times your height, its body a patchwork of obsidian plates and exposed bone that gleams like polished ivory.

Its eyes - burning with ancient hunger - lock onto you.

The Guardian. The final obstacle between you and freedom. Between you and death.

This is the moment everything has been building toward. Every choice you've made, every power you've gained, every lesson you've learned - it all comes down to this.

The Guardian raises one massive arm. Reality screams."""
