text = """
Curiosity wars with fear. You need to understand this place.

You move carefully through the ruins toward the massive shadow. As you get closer, details emerge. It's not one creature - it's dozens.

A herd of shadowy beasts, each the size of a horse, grazing on something that might have once been grass. They haven't noticed you yet."""
art = """

