dialogue = [
  { who = "ghost", line = "Please... we beg you... free us from this torment...", mood = "sad" },
  { who = "ghost", line = "We were innocent... trapped here by a tyrant long dead...", mood = "pained" },
  { who = "ghost", line = "There is shadow on you, Aspirant. We can smell it. ...And still you came.", mood = "afraid", if = "corruption >= 1" },
  { who = "your_thoughts", line = "This feels like a test. The Dream Realm testing my character." },
  { who = "your_thoughts", line = "Do I have the courage to show mercy... even when it might cost me?", mood = "afraid" },
]
[[find_seal.choices]]
text = "Break the seal and free the spirits"
goto = "break_seal"
[[find_seal.choices]]
text = "Pry the seal's cracked keystone loose with your metal shard"
goto = "break_seal"
any_items = ["Metal Shard"]
[[find_seal.choices]]
text = "Leave the seal intact and walk away"
goto = "abandon_ghosts"

[abandon_ghosts]
text = """
You turn away from the ghosts. Their whispers follow you up the stairway, pleading, then bargaining, then simply saying your name over and over, though you never told them what it was.

You keep walking.

Survival is what matters. You can't save everyone. Not here. Maybe not anywhere."""
variants = [
  { if = "mercy <= -2", text = """
Twice now. You came back down those stairs, you looked them in their faces, and you turned away again.

This time they don't plead. They don't bargain. They don't say your name. The silence follows you up the stairway instead, and it is much heavier than the whispers were.

Somewhere around the twentieth step you notice your shadow is a little longer than it should be for the light. You keep walking. You are getting good at that.""" },
]
set_flags = ["abandoned_ghosts"]
add = { corruption = 1, mercy = -1 }
dialogue = [
  { who = "ghost", line = "You will come back to us... everyone does...", mood = "angry", fx = "chill" },
  { who = "your_thoughts", line = "I'm sorry. But I have to survive.", mood = "pained" },
  { who = "your_thoughts", line = "It's easier the second time. That's the worst part.", mood = "pained", if = "mercy <= -2" },
]
[[abandon_ghosts.choices]]
text = "Leave the chamber"
goto = "trial_encounter"
[[abandon_ghosts.choices]]
text = "Search the upper ruins for a weapon first"
goto = "find_weapon"
if = "!item('Rusty Blade')"

[break_seal]
text = """
You bring everything you have down on the seal's weakest point.

The stone cracks. Light erupts from the fracture - not the sick crimson of the sky but something clean and white, like the first morning after a long illness. The leashes binding the ghosts snap one after another, each with a sound like a harp string.

The ghosts scream - not in pain, but in joy - as they're finally released.

One of them, an officer whose spectral coat still bears its buttons, touches your shoulder before fading. You feel... blessed."""
variants = [
  { if = "flag('abandoned_ghosts')", text = """
You walked away from them once. That is exactly why your hands don't shake now.

You bring everything you have down on the seal's weakest point. The stone cracks. Light erupts from the fracture - not the sick crimson of the sky but something clean and white, like the first morning after a long illness. The leashes binding the ghosts snap one after another, each with a sound like a harp string.

The ghosts don't scream with joy. Not at first. They stare at you as if they cannot quite believe it - as if, in all their centuries, no one who climbed those stairs and left ever came back down to finish the job.

Then an officer whose spectral coat still bears its buttons crosses the chamber and touches your shoulder, and the cold that has been sitting in your chest since you turned away goes out of you like a held breath.""" },
]
set_flags = ["freed_ghosts"]
add = { mercy = 2, corruption = -1 }
dialogue = [
  { who = "ghost", line = "You came back. In all our years, no one ever came back for us.", mood = "shocked", if = "flag('abandoned_ghosts')" },
  { who = "ghost", line = "Thank you, brave one. We will not forget this kindness.", mood = "happy", fx = "flash" },
  { who = "the_spell", line = "You have been granted: [Ghost's Blessing]", mood = "focus" },
  { who = "the_spell", line = "Attribute granted: Spirit Sight (Dormant)", mood = "focus" },
]
[[break_seal.choices]]
text = "Continue your journey"
goto = "trial_encounter"
[[break_seal.choices]]
text = "Ask the freed spirits what waits ahead"
goto = "ghost_counsel"

[trial_encounter]
image = "images/trial_encounter.svg"
text = """
⚠ FINAL TRIAL BEGINS ⚠

You've explored the ruins. You've gained power. You've survived this far.

But the Dream Realm has one final test.

The ground trembles beneath your feet. Cracks spiderweb across the basalt stone. The crimson sky darkens, clouds roiling like a storm-tossed sea. The air grows thick with pressure, as if reality itself is holding its breath.

Then... it emerges.

From the deepest shadows of the ruined city comes a being that defies description. A towering colossus of nightmare and bone, shadow and malice given physical form. It stands three times your height, its body a patchwork of obsidian plates and exposed bone that gleams like polished ivory.

Its eyes - burning with ancient hunger - lock onto you.

The Guardian. The final obstacle between you and freedom. Between you and death.

This is the moment everything has been building toward. Every choice you've made, every power you've gained, every lesson you've learned - it all comes down to this.

The Guardian raises one massive arm. Reality screams."""
variants = [
  { if = "corruption >= 2", text = """
⚠ FINAL TRIAL BEGINS ⚠

You've explored the ruins. You've gained power. You've survived this far. You are no longer entirely sure that the one who survived is you.

The ground trembles beneath your feet. Cracks spiderweb across the basalt stone - and the shadows in those cracks do not stay put. They lean toward you as you pass, the way flowers lean toward a window. When you raise your hand to shield your eyes, the skin across your knuckles is a shade darker than it was this morning, as though you have been holding ink.

Then... it emerges.

From the deepest shadows of the ruined city comes a towering colossus of nightmare and bone, three times your height, a patchwork of obsidian plates and exposed bone that gleams like polished ivory.

Its burning eyes lock onto you - and for a heartbeat, they narrow. It is looking at you the way it looks at the shadow beasts on the outer rings. As if trying to decide which side of the line you are standing on.

The Guardian. The final obstacle between you and freedom. Between you and death. Between you and whatever you are turning into.

The Guardian raises one massive arm. Reality screams.""" },
  { if = "resolve >= 4", text = """
⚠ FINAL TRIAL BEGINS ⚠

You've explored the ruins. You've learned. You've listened. You've survived this far as yourself, and that has started to feel like a kind of armour.

The ground trembles beneath your feet. Cracks spiderweb across the basalt stone. The crimson sky darkens, clouds roiling like a storm-tossed sea, and the air grows thick with pressure, as if reality itself is holding its breath.

Then... it emerges.

From the deepest shadows of the ruined city comes a towering colossus of nightmare and bone, three times your height, a patchwork of obsidian plates and exposed bone that gleams like polished ivory. Its burning eyes lock onto you.

You notice, distantly, that your hands are not shaking. Your heart is pounding hard enough to hurt - but your feet are planted, and they are staying planted. You know your name. You know why you're here. Somewhere along the way, fear stopped being the thing that decides.

The Guardian. The final obstacle between you and freedom.

The Guardian raises one massive arm. Reality screams.""" },
]
art = """

