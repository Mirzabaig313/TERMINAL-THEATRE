[search_ruins]
text = """
You search through the crumbling ruins methodically.

Most of it is worthless debris, but then your hand closes around something solid. A shard of dark metal, sharp enough to cut. It's not much, but it's better than nothing.

As you pocket the shard, you hear something. A whisper in a language you shouldn't understand... but somehow do."""
add_items = ["Metal Shard"]
dialogue = [
  { who = "whisper", line = "Lost... so lost... help us..." },
  { who = "your_thoughts", line = "What was that?!" },
]
[[search_ruins.choices]]
text = "Follow the whispers"
goto = "mysterious_whispers"
[[search_ruins.choices]]
text = "Ignore it and keep searching"
goto = "find_weapon"

[dark_archway]
text = """
⛧ TEMPLE OF THE FORGOTTEN ⛧

You step through the archway into blessed darkness - a reprieve from the bleeding sky. The temperature drops immediately. Your breath mists in the air.

Your eyes slowly adjust to the gloom. You're standing in what must have been a temple to some forgotten god. The architecture is impossible - walls that curve in ways that shouldn't exist in three-dimensional space. Broken statues line the chamber, their faces worn smooth by eons of wind and shadow.

But what catches your attention is the center of the room.

There, upon an obsidian pedestal carved with spiraling runes, rests something that glows with soft, silver light. It's beautiful - a crystallized memory, frozen in time like a precious gem. Even from here, you can feel the power radiating from it.

The statues seem to be watching you. Guarding it. Or perhaps... warning you."""
art = """

