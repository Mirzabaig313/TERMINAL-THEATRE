[trial_encounter_empowered]
text = """
The Shadow Essence burns in your veins as the Guardian appears.

But you're different now. Your shadow no longer lies flat on the stone - it stands a little apart from you, waiting, like a dog that knows its master's voice. The shadows of every broken pillar lean toward you.

The Guardian hesitates, mid-stride. Its burning eyes narrow. For the first time, something in this Nightmare looks at you and wonders what you are."""
variants = [
  { if = "corruption >= 4", text = """
The Shadow Essence doesn't burn in your veins any more. It has stopped burning the way a fire stops burning once there is nothing left to catch.

Your shadow no longer waits beside you. It stands in front of you now, between you and the Guardian, taller than you are, and it does not look back to see whether you approve. Every shadow in the plaza has turned toward you - not leaning, but kneeling. Your hands are dark to the wrist.

The Guardian stops mid-stride. Its burning eyes move from you to the thing your shadow has become, and back again, and for the first time something in this Nightmare looks at you and is not sure which of you it should be fighting.""" },
]
