[desperate_escape]
text = """
You run faster than you've ever run. Your lungs burn. Behind you, the shadow beasts give chase, and the sound of them is like a landslide that has learned to hunt.

You spot a narrow crevice in the ruins, a black slit between two fallen slabs. You might fit. They won't."""
dialogue = [
  { who = "your_thoughts", line = "There! I can make it!", mood = "afraid" },
]
[[desperate_escape.choices]]
text = "Dive into the crevice"
goto = "narrow_escape"
[[desperate_escape.choices]]
text = "Turn and fight in the open"
goto = "hopeless_battle"

[hopeless_battle]
ending = true
text = """
You stand your ground, weapon raised.

It's a brave choice. A foolish choice. Maybe, here, they are the same choice.

The first beast reaches you and you strike, and something in you sings when the blow lands - a real wound, black mist spilling from it like smoke from a snuffed candle. The beast staggers. For one dizzy heartbeat you think you might actually do this.

Then the rest of the herd arrives.

There is no pain, at first. Only cold, and weight, and the strange intimacy of being surrounded by something that has no face. The crimson sky shrinks to a coin above you, then to a pinprick, then to nothing.

Your last thought is not of the beasts or the Spell or the ruined city. It is of home - your small, unremarkable life - and how badly you wish you had paid more attention to it while you had it.

As darkness closes in, you wonder if anyone will remember your defiance."""
art = """

    ═══════════════════════════════════════════════════════════════

                    ░░░  YOU HAVE DIED  ░░░

                         ▄▄▄▄▄▄▄▄▄
                       ▄█▀░░░░░░░▀█▄
                      ██░  ▄▄▄▄▄  ░██
                      ██░ █░░X░░█ ░██
                      ██░ █░░X░░█ ░██
                      ██░  ▀▀▀▀▀  ░██
                       ▀█▄░░░░░░░▄█▀
                         ▀▀▀▀▀▀▀▀▀

                "The nightmare claims another soul"

    ═══════════════════════════════════════════════════════════════
        """
dialogue = [
  { who = "your_thoughts", line = "At least it was me who stood here. Not something wearing me.", mood = "pained", if = "resolve >= 3" },
  { who = "the_spell", line = "You have perished in the Dream Realm.", mood = "wrath", fx = "blackout" },
]

[narrow_escape]
text = """
You squeeze through the crevice, scraping skin from your ribs. The shadow beasts claw at the entrance, their smooth faces pressed to the gap, but they can't reach you.

Eventually, they lose interest and wander away, back to their three-step grazing.

You stay a long time in the cold, close dark, learning its shape. A good hiding place is a kind of weapon. You survived. This time."""
set_flags = ["escaped_beasts"]
dialogue = [
  { who = "your_thoughts", line = "I need to be smarter. More careful.", mood = "pained" },
]
[[narrow_escape.choices]]
text = "Exit the crevice cautiously"
goto = "trial_encounter"
[[narrow_escape.choices]]
text = "Wait until the herd is gone, then explore the ruins again"
goto = "first_awakening"

[final_battle]
fx = "blood"
ending = true
text = """
You charge the Guardian with a battle cry.

The fight is brutal. Desperate. Its fist comes down and the street simply stops existing where it lands; you are already moving, rolling through the dust, rising inside its reach where its size is a burden rather than a blessing. You take wounds that should be fatal - a rib, a shoulder, a long burning line across your back - but somehow you keep moving. Keep fighting.

Time stops meaning anything. There is only the next breath and the next swing.

Then you find it: a seam between two obsidian plates, low on its flank, where the bone shows through. Your blade - or your fists, or your will - strikes true.

The Guardian falls to one knee. Then the other. The sound it makes as it hits the ground is like a city collapsing.

As it dissolves into shadow, the Dream Realm begins to fade around you, the crimson sky paling to dawn grey. You are standing. You are bleeding. You are alive."""
variants = [
  { if = "corruption >= 3", text = """
You charge the Guardian with a battle cry, and your shadow charges a half-step ahead of you.

The fight is brutal. Desperate. Its fist comes down and the street simply stops existing where it lands; you are already moving, rolling through the dust, rising inside its reach. You take wounds that should be fatal - a rib, a shoulder, a long burning line across your back - and the blood that runs from them is not red. It is dark and slow and faintly cold, and the wounds close around it like water closing over a stone.

You don't let yourself think about that. There is only the next breath and the next swing.

Then you find it: a seam between two obsidian plates, low on its flank, where the bone shows through. You strike true. The Guardian falls to one knee. Then the other. The sound it makes as it hits the ground is like a city collapsing.

As it dissolves into shadow, a little of that shadow drifts toward you instead of away, and settles on your skin like dust. The crimson sky pales to dawn grey. You are standing. You are alive. You will have to find out later what else you are.""" },
]
