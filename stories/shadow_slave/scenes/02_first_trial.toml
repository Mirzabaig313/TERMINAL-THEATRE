[first_awakening]
text = """
⚠ REALITY SHIFTS ⚠

You open your eyes to madness incarnate.

Above you stretches an alien sky - a roiling mass of crimson and obsidian that pulses like an infected wound. Clouds of coagulated darkness drift across it, bleeding shadow-rain that evaporates before touching the ground.

You're lying on cold basalt stone, your body stiff and unfamiliar. As you struggle to sit up, you realize you're in the ruins of what must have been a magnificent city - thousands of years ago. Now it's nothing but shattered dreams made stone.

Broken pillars of obsidian and bone reach toward the bleeding sky like accusing fingers. Strange symbols are carved into every surface, glowing faintly with an inner light that hurts to look at directly.

The air tastes of copper and ozone. Every breath feels heavy, laden with the weight of countless nightmares.

In the distance... something massive moves through the ruins. Shadow-shapes, dozens of them, like a herd of impossible beasts."""
art = """

    ═══════════════════════════════════════════════════════════════
                   ▓▓ THE CRIMSON SKY ▓▓
    ═══════════════════════════════════════════════════════════════

    ░░░░▒▒▒▒▓▓▓▓████████████████████████████▓▓▓▓▒▒▒▒░░░░
    ░░▒▒▓▓██████▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓██████▓▓▒▒░░
    ▒▒▓▓████▓▓▓░░░░░░░░░░░░░░░░░░░░░░░░░░░░░▓▓▓████▓▓▒▒
    ▓▓████▓▓░░  Clouds of blood and shadow  ░░▓▓████▓▓
    ████▓▓░░░                                 ░░░▓▓████
    ██▓▓░░     ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄       ░░▓▓██
    ▓▓░░      ████████████████████████████       ░░▓▓
    ░░       ██▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓██        ░░
            ██▓░░░░░░░░░░░░░░░░░░░░░░░░░▓██
           ██▓░  The sky writhes like   ░▓██
          ██▓░   a wounded beast...      ░▓██
         ██▓░                             ░▓██

    ═══════════════════════════════════════════════════════════════
        """
set_flags = ["entered_dream_realm"]
dialogue = [
  { who = "your_thoughts", line = "This is... the Dream Realm. The place between sleep and death." },
  { who = "your_thoughts", line = "It's real. It's all REAL. And I'm trapped here." },
  { who = "your_thoughts", line = "Focus. I need to survive. Find shelter. Find weapons. Find a way OUT." },
]
[[first_awakening.choices]]
text = "Look around for shelter"
goto = "seek_shelter"
[[first_awakening.choices]]
text = "Investigate the moving shadow in the distance"
goto = "investigate_shadow"
[[first_awakening.choices]]
text = "Search the ruins for supplies"
goto = "search_ruins"

[seek_shelter]
text = """
Survival instinct kicks in. Find shelter. Find safety.

You spot a partially intact structure among the ruins - an archway leading into darkness. It could provide cover, or it could be a trap.

Your eyes catch something else: a faint glow from within the shadows."""
set_flags = ["sought_shelter"]
dialogue = [
  { who = "your_thoughts", line = "That building might be safe... or it might be where something lives." },
]
[[seek_shelter.choices]]
text = "Enter the dark archway carefully"
goto = "dark_archway"
[[seek_shelter.choices]]
text = "Investigate the glowing light"
goto = "mysterious_glow"
[[seek_shelter.choices]]
text = "Change your mind and explore elsewhere"
goto = "first_awakening"

