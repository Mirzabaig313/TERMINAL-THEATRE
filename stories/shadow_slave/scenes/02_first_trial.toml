    ║  ▀▀▀▀▀▀▀                                      ▀▀▀▀▀▀▀    ║
    ║                                                           ║
    ╚═══════════════════════════════════════════════════════════╝
        """
dialogue = [
  { who = "your_thoughts", line = "A Memory... the Spell mentioned these. Fragments of power left behind by those who came before." },
  { who = "your_thoughts", line = "But why is it just... sitting here? What's the catch?", mood = "smirk" },
]
[[dark_archway.choices]]
text = "Touch the glowing object"
goto = "first_memory"
[[dark_archway.choices]]
text = "Examine it without touching"
goto = "examine_memory"
[[dark_archway.choices]]
text = "Leave it alone and exit"
goto = "first_awakening"

[mysterious_glow]
text = """
≋ SHADOW ESSENCE ≋

You approach the glow with a mixture of fear and fascination.

It's coming from a crack in the basalt floor - a jagged fracture that looks like a wound in reality itself. As you peer into the darkness, you see it: liquid shadow, flowing like mercury but glowing with an inner light that cycles through impossible colors.

Shadow Essence. The raw stuff of the Dream Realm, condensed into physical form.

It pulses hypnotically, each throb synchronized with your own heartbeat. You can FEEL it calling to you, promising power beyond imagination. Strength. Speed. The ability to command the very shadows themselves.

But there's something else too - a hunger lurking beneath the promise. A darkness that goes deeper than any shadow. This power has a price.

A voice echoes in your mind - definitely not the Spell. Something older. Something that's been waiting here for a very, very long time."""
variants = [
  { if = "visited('refuse_essence')", text = """
≋ SHADOW ESSENCE ≋

The crack is still there. Of course it is.

The liquid shadow has risen since you last stood here, brimming almost to the lip of the fracture, cycling through its impossible colors a little faster, like a pulse that quickened when it heard your footsteps. You told it no once. It does not seem to have believed you.

The hunger beneath the promise hasn't gone anywhere either. If anything, it has been patient. Patience is cheap when you have eternity to spend.

The old voice stirs again, and this time it sounds almost fond.""" },
]
art = """

        ╔═══════════════════════════════════════════════╗
        ║      ≋ SHADOW ESSENCE - LIQUID POWER ≋       ║
        ╠═══════════════════════════════════════════════╣
