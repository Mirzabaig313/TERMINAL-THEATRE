    ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
        """
add_items = ["Warrior's Echo"]
dialogue = [
  { who = "the_spell", line = "You have acquired a Memory: [Warrior's Echo - Rank: Dormant]", mood = "focus", fx = "flash" },
  { who = "the_spell", line = "Type: Tool. Description: The final stand of an unnamed warrior.", mood = "focus" },
  { who = "the_spell", line = "Attribute granted: [Combat Proficiency] (Dormant)", mood = "focus" },
  { who = "your_thoughts", line = "I can... I can FIGHT now. I know how. It's like I've trained for years...", mood = "smirk" },
  { who = "your_thoughts", line = "Thank you, warrior. I'll make your sacrifice count.", mood = "pained" },
]
[[first_memory.choices]]
text = "Leave the temple with your newfound power"
goto = "trial_encounter"
[[first_memory.choices]]
text = "Search the ruins for a blade worthy of that memory"
goto = "find_weapon"

[examine_memory]
text = """
You study the glowing object carefully without touching it.

It's beautiful - a crystallized memory, frozen in time. Up close, you can see shapes moving inside it, tiny as figures in a snow globe: a lone warrior on a hill of bodies, sword raised, refusing to give ground to a tide of monsters. Their lips move, and you read the words without hearing them. Not one step back.

You watch the scene loop, again and again, until you could draw the warrior's stance from memory. The angle of the shoulders. The way the left foot never moves.

But something about the crystal feels wrong. Hungry. Like a door that only opens one way.

You decide caution is wiser than greed - for now."""
set_flags = ["examined_memory"]
add = { resolve = 1 }
dialogue = [
  { who = "your_thoughts", line = "Not one step back... I'll remember you, whoever you were." },
  { who = "your_thoughts", line = "Maybe I should be more careful in this place.", mood = "afraid" },
]
[[examine_memory.choices]]
text = "Leave it and explore elsewhere"
goto = "trial_encounter"
[[examine_memory.choices]]
text = "Change your mind and take it"
goto = "first_memory"

[drink_essence]
text = """
You cup your hands and drink the glowing liquid.

It tastes like starlight and copper. Power floods through you, raw and overwhelming. Your shadow twitches on the stone - a half-second after you do. Your body changes, adapts, becomes something more.

But there's a price. You can feel it - a hunger, deep in your soul, opening one eye."""
variants = [
  { if = "flag('refused_essence')", text = """
You told it no. You walked away. And then you came back, and the coming back is the part you will remember.

You cup your hands and drink.

It tastes like starlight and copper, and faintly of your own hesitation. Power floods through you, raw and overwhelming. Your shadow twitches on the stone - a half-second after you do. Your body changes, adapts, becomes something more.

Somewhere very deep, the hunger opens one eye, and it looks pleased with itself. It knew you would.""" },
]
set_flags = ["consumed_essence"]
add = { corruption = 2 }
dialogue = [
  { who = "the_spell", line = "You have consumed Shadow Essence.", mood = "focus", fx = "glitch" },
  { who = "the_spell", line = "Attribute granted: Shadow Affinity (Dormant)", mood = "focus" },
  { who = "the_spell", line = "Shadow saturation: {corruption}. Monitor it, Aspirant.", mood = "wrath", if = "corruption >= 3" },
  { who = "your_thoughts", line = "What have I done to myself?", mood = "pained", fx = "dizzy" },
  { who = "your_thoughts", line = "No. I said my name to the dark once. I can say it to this.", mood = "angry", if = "resolve >= 2" },
]
[[drink_essence.choices]]
text = "Embrace the power"
goto = "trial_encounter_empowered"
add = { corruption = 1 }
[[drink_essence.choices]]
text = "Force the hunger down and walk on as yourself"
goto = "trial_encounter"
add = { corruption = -1, resolve = 1 }

[refuse_essence]
text = """
You back away from the crack in the ground.

The voice in your mind seems disappointed - and then, briefly, something worse than disappointed. But you trust your instincts. Some gifts come with prices too high to pay, and the ones that beg the hardest cost the most.

The glow dims behind you, sulking."""
set_flags = ["refused_essence"]
add = { resolve = 1 }
dialogue = [
  { who = "unknown_voice", line = "You will wish you had drunk, little Aspirant." },
  { who = "your_thoughts", line = "I'll find power my own way.", mood = "angry" },
  { who = "your_thoughts", line = "I let go once already, falling in here. Not again. Not for that.", mood = "angry", if = "corruption >= 1" },
]
[[refuse_essence.choices]]
text = "Continue exploring"
goto = "trial_encounter"
[[refuse_essence.choices]]
text = "Try the dark archway instead"
goto = "dark_archway"

[stealth_success]
text = """
The shadow beast's attention drifts away. It returns to grazing.

You let out a breath you didn't know you were holding. You made it past. But you've learned something valuable - in this realm, patience is survival.

Ahead, a half-collapsed watchtower leans over the street, its spiral stair still mostly intact."""
set_flags = ["stealth_mastery"]
dialogue = [
  { who = "your_thoughts", line = "I can do this. I can survive here.", mood = "smirk" },
]
[[stealth_success.choices]]
text = "Move onward"
goto = "trial_encounter"
[[stealth_success.choices]]
text = "Climb the leaning watchtower to scout"
goto = "read_the_ruins"

[stealth_check]
text = """
The stone clatters down the rubble. Time seems to slow.

The nearest shadow beast's head snaps toward the sound. It takes a step in your direction... then stops. Another beast makes a sound like a cello string snapping, drawing its attention away.

You've survived. Barely."""
dialogue = [
  { who = "your_thoughts", line = "That was too close.", mood = "pained" },
]
[[stealth_check.choices]]
text = "Continue past them carefully"
goto = "trial_encounter"
[[stealth_check.choices]]
text = "Stay hidden and study them a while longer"
goto = "observe_creatures"

[alert_creatures]
transition = "cut"
fx = "heartbeat"
text = """
The shadow beasts' heads snap up as one. They've seen you.

For a moment, everything is still. The whole herd stands frozen, a dozen smooth black faces pointed at you like compass needles at north. Even the wind seems to stop.

Then they move.

Not the lazy three-step amble of grazing animals - a flood. Their bodies stretch and lengthen as they come, legs multiplying, shapes smearing into one rolling wave of darkness that pours across the rubble toward you. The ground bucks under their weight. Pillars that have stood for a thousand years crack as they pass.

A sound reaches you, high and thin, and it takes you a second to realize it's coming from your own throat.

You run."""
dialogue = [
  { who = "your_thoughts", line = "Run! Just run!", mood = "afraid", fx = "shake" },
]
[[alert_creatures.choices]]
text = "Sprint for cover"
goto = "desperate_escape"
[[alert_creatures.choices]]
text = "Stand and fight with whatever you have"
goto = "hopeless_battle"

[find_seal]
image = "images/find_seal.svg"
text = """
◈ THE BINDING SEAL ◈

You search the chamber methodically, following the pulse of dark energy that permeates the air. The ghosts hover anxiously, their translucent forms flickering.

Then you find it.

Carved into the floor at the chamber's center is an intricate seal - a mandala of death and binding. Ancient runes spiral outward from a central skull symbol, each line pulsing with malevolent energy. The craftsmanship is exquisite and terrible.

Dark power radiates from it in waves, like heat from a furnace. This is what binds the spirits to this place. Chains forged from cruelty and written in the language of nightmares.

You could break it. The seal is powerful, but you can sense its age. Centuries of erosion have weakened it. A few well-placed strikes would shatter it.

But should you? These spirits have been here for eons. What if they're bound for a reason? What if releasing them unleashes something worse?

The ghosts watch you, pleading silently. The choice is yours."""
art = """

