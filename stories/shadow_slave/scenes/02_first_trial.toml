[first_awakening]
transition = "coalesce"
image = "images/first_awakening.svg"
text = """
⚠ REALITY SHIFTS ⚠

You open your eyes to madness incarnate.

Above you stretches an alien sky - a roiling mass of crimson and obsidian that pulses like an infected wound. Clouds of coagulated darkness drift across it, bleeding shadow-rain that evaporates before touching the ground.

You're lying on cold basalt stone, your body stiff and unfamiliar. As you struggle to sit up, you realize you're in the ruins of what must have been a magnificent city - thousands of years ago. Now it's nothing but shattered dreams made stone.

Broken pillars of obsidian and bone reach toward the bleeding sky like accusing fingers. Strange symbols are carved into every surface, glowing faintly with an inner light that hurts to look at directly.

The air tastes of copper and ozone. Every breath feels heavy, laden with the weight of countless nightmares.

In the distance... something massive moves through the ruins. Shadow-shapes, dozens of them, like a herd of impossible beasts."""
art = """

    ═══════════════════════════════════════════════════════════════
                   ▓▓ THE CRIMSON SKY ▓▓
    ═══════════════════════════════════════════════════════════════

    ░░░░▒▒▒▒▓▓▓▓████████████████████████████▓▓▓▓▒▒▒▒░░░░
    ░░▒▒▓▓██████▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓██████▓▓▒▒░░
    ▒▒▓▓████▓▓▓░░░░░░░░░░░░░░░░░░░░░░░░░░░░░▓▓▓████▓▓▒▒
    ▓▓████▓▓░░  Clouds of blood and shadow  ░░▓▓████▓▓
    ████▓▓░░░                                 ░░░▓▓████
    ██▓▓░░     ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄       ░░▓▓██
    ▓▓░░      ████████████████████████████       ░░▓▓
    ░░       ██▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓██        ░░
            ██▓░░░░░░░░░░░░░░░░░░░░░░░░░▓██
           ██▓░  The sky writhes like   ░▓██
          ██▓░   a wounded beast...      ░▓██
         ██▓░                             ░▓██

    ═══════════════════════════════════════════════════════════════
        """
dialogue = [
  { who = "your_thoughts", line = "This is... the Dream Realm. The place between sleep and death.", mood = "afraid" },
  { who = "your_thoughts", line = "It's real. It's all REAL. And I'm trapped here.", mood = "afraid" },
  { who = "your_thoughts", line = "Focus. I need to survive. Find shelter. Find weapons. Find a way OUT.", mood = "angry" },
  { who = "your_thoughts", line = "The shadows of those pillars are leaning toward me. Not away from the light - toward ME.", mood = "afraid", if = "corruption >= 1" },
  { who = "your_thoughts", line = "I know my name. I know what I'm doing here. That's more than this place expected.", mood = "smirk", if = "resolve >= 3" },
]
[[first_awakening.choices]]
text = "Look around for shelter"
goto = "seek_shelter"
[[first_awakening.choices]]
text = "Investigate the moving shadow in the distance"
goto = "investigate_shadow"
[[first_awakening.choices]]
text = "Search the ruins for supplies"
goto = "search_ruins"
[[first_awakening.choices]]
text = "Climb a fallen pillar and read the ruins - logic here is 'flexible'"
goto = "read_the_ruins"
any_flags = ["learned_dream_realm"]

[seek_shelter]
text = """
Survival instinct kicks in. Find shelter. Find safety. Find walls you can put your back against.

You pick your way between toppled columns, keeping low, until you spot a partially intact structure among the ruins - an archway leading into perfect darkness. Its keystone is carved with a face whose eyes have been chiselled out. It could provide cover, or it could be a mouth.

Your eyes catch something else, too: a faint, shifting glow seeping up from a crack in the ground nearby, colors cycling like oil on water.

You commit the place to memory. Whatever happens, you now know one spot in this city where something other than the sky might be watching over you."""
set_flags = ["sought_shelter"]
dialogue = [
  { who = "your_thoughts", line = "That building might be safe... or it might be where something lives.", mood = "afraid" },
]
[[seek_shelter.choices]]
text = "Enter the dark archway carefully"
goto = "dark_archway"
[[seek_shelter.choices]]
text = "Investigate the glowing light"
goto = "mysterious_glow"
[[seek_shelter.choices]]
text = "Change your mind and explore elsewhere"
goto = "first_awakening"

[investigate_shadow]
image = "images/investigate_shadow.svg"
text = """
Curiosity wars with fear. You need to understand this place, and you can't understand what you refuse to look at.

You move carefully through the ruins toward the massive shadow, sliding from pillar to pillar. As you get closer, details emerge - and none of them are comforting. It's not one creature. It's dozens.

A herd of shadowy beasts, each the size of a horse, grazing on something that might once have been grass. Their bodies don't quite hold still; their edges smear and reform with every movement, like ink dropped in water. Where their faces should be, there is only smooth darkness.

The ground trembles faintly under their weight. The smell reaches you a moment later - cold iron and old smoke.

They haven't noticed you yet. Yet."""
art = """

                       ▄▄▄▄▄▄▄
                   ▄▄██▀▀░░░▀▀██▄▄
                 ▄█▀░░  ◆  ◆  ░░▀█▄
                ██░░   ▄███▄   ░░██
                █░░  ▄█▀▀▀▀▀█▄  ░░█
                █░░ ██  ▄▄▄  ██ ░░█
                ▀█░░▀█▄▀   ▀▄█▀░░█▀
                 ▀█▄░░▀█████▀░░▄█▀
                   ▀██▄▄░░░▄▄██▀
                  ░░░░▀▀███▀▀░░░░
                 ░░░  ███████  ░░░
                ░░   ██     ██   ░░
               ░░   ██       ██   ░░
              ░░   ██         ██   ░░
                  ██           ██
        """
set_flags = ["saw_shadow_beasts"]
dialogue = [
  { who = "your_thoughts", line = "Nightmare Creatures... they're real. They're all real.", mood = "afraid" },
]
[[investigate_shadow.choices]]
text = "Observe them from a safe distance"
goto = "observe_creatures"
[[investigate_shadow.choices]]
text = "Try to sneak past them"
goto = "sneak_past_creatures"
[[investigate_shadow.choices]]
text = "Retreat quietly"
goto = "first_awakening"

[search_ruins]
text = """
You search through the crumbling ruins methodically. Rubble. Dust. A child's tooth, which you put down very quickly.

Most of it is worthless debris, but then your hand closes around something solid. A shard of dark metal, sharp enough to cut. It's not much, but it's better than nothing. You wrap the blunt end in a strip torn from your sleeve.

As you pocket the shard, you hear something. A whisper in a language you shouldn't understand... but somehow do."""
add_items = ["Metal Shard"]
dialogue = [
  { who = "whisper", line = "Lost... so lost... help us..." },
  { who = "your_thoughts", line = "What was that?!", mood = "afraid" },
]
[[search_ruins.choices]]
text = "Follow the whispers"
goto = "mysterious_whispers"
[[search_ruins.choices]]
text = "Ignore it and keep searching"
goto = "find_weapon"

[dark_archway]
transition = "sweep"
image = "images/dark_archway.svg"
text = """
⛧ TEMPLE OF THE FORGOTTEN ⛧

You step through the archway into blessed darkness - a reprieve from the bleeding sky. The temperature drops immediately. Your breath mists in the air.

Your eyes slowly adjust to the gloom. You're standing in what must have been a temple to some forgotten god. The architecture is impossible - walls that curve in ways that shouldn't exist in three-dimensional space. Broken statues line the chamber, their faces worn smooth by eons of wind and shadow.

But what catches your attention is the center of the room.

There, upon an obsidian pedestal carved with spiraling runes, rests something that glows with soft, silver light. It's beautiful - a crystallized memory, frozen in time like a precious gem. Even from here, you can feel the power radiating from it.

The statues seem to be watching you. Guarding it. Or perhaps... warning you."""
art = """

    ╔═══════════════════════════════════════════════════════════╗
    ║         ⛧ TEMPLE OF THE FORGOTTEN ONES ⛧                 ║
    ╠═══════════════════════════════════════════════════════════╣
    ║                                                           ║
    ║    ▓▓▓                                          ▓▓▓      ║
    ║    ▓█▓         ╔═══════════════╗               ▓█▓      ║
    ║    ▓█▓         ║   ░░░░░░░░░   ║               ▓█▓      ║
    ║    ▓█▓         ║   ▒▒▒▒▒▒▒▒▒   ║               ▓█▓      ║
    ║    ▓█▓         ║   ▓▓▓███▓▓▓   ║               ▓█▓      ║
    ║    ▓█▓         ║      ███      ║               ▓█▓      ║
    ║    ▓█▓         ╚═══════════════╝               ▓█▓      ║
