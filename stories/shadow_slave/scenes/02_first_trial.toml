dialogue = [
  { who = "the_spell", line = "Your First Nightmare reaches its climax.", mood = "focus", fx = "shake" },
  { who = "the_spell", line = "Before you stands the Guardian - Rank: Fallen Terror.", mood = "wrath" },
  { who = "the_spell", line = "Defeat it, and you will awaken as one of the Awakened.", mood = "focus" },
  { who = "the_spell", line = "Fail... and you will never leave the Dream Realm.", mood = "wrath" },
  { who = "the_spell", line = "Note: Aspirant shadow saturation is {corruption}. The Guardian has noticed.", mood = "wrath", fx = "glitch", if = "corruption >= 2" },
  { who = "your_thoughts", line = "This is it. Everything comes down to this single moment.", mood = "afraid", if = "resolve < 4" },
  { who = "your_thoughts", line = "This is it. And I'm still me. Let's see what that's worth.", mood = "angry", if = "resolve >= 4" },
  { who = "your_thoughts", line = "I will NOT die here. I will NOT fail. I WILL survive!", mood = "angry" },
]
