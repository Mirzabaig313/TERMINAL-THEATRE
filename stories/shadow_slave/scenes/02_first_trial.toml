[observe_creatures]
text = """
You watch the shadow beasts carefully, learning their patterns.

They're not aggressive, you realize. Just... present. Existing in this twisted reality like everything else.

One of them lifts its head, as if sensing something. Its eyeless face turns in your direction."""
set_flags = ["observed_beasts"]
dialogue = [
  { who = "your_thoughts", line = "Don't move. Don't even breathe." },
]
[[observe_creatures.choices]]
text = "Stay perfectly still"
goto = "stealth_success"
[[observe_creatures.choices]]
text = "Run before it fully notices you"
goto = "alert_creatures"

[sneak_past_creatures]
text = """
You move with careful precision, using the ruins as cover.

Your heart hammers in your chest, but you force yourself to move slowly. One step. Then another.

You're halfway past when your foot dislodges a loose stone."""
dialogue = [
  { who = "your_thoughts", line = "No!" },
]
[[sneak_past_creatures.choices]]
text = "Freeze and hope they ignore it"
goto = "stealth_check"
[[sneak_past_creatures.choices]]
text = "Run immediately"
goto = "alert_creatures"

[mysterious_whispers]
text = """
You follow the whispers deeper into the ruins.

They lead you to a chamber filled with fading light. Ghostly figures float in the air - echoes of people who once lived here.

They're trapped. Bound to this place by something ancient and cruel."""
set_flags = ["heard_whispers"]
dialogue = [
  { who = "ghost", line = "Free us... please... the chains..." },
  { who = "your_thoughts", line = "How? How can I help you?" },
  { who = "ghost", line = "Break... the seal..." },
]
[[mysterious_whispers.choices]]
text = "Search for the seal they mentioned"
goto = "find_seal"
[[mysterious_whispers.choices]]
text = "Leave them - it's too dangerous"
goto = "abandon_ghosts"

[find_weapon]
text = """
⚔ WEAPON DISCOVERED ⚔

You ignore the whispers and continue your methodical search through the ruins. Every stone turned, every shadow investigated.

Your persistence pays off.

Beneath a collapsed pillar, half-buried in debris and centuries of dust, your fingers close around something solid. Metal. You pull it free, sending a shower of pebbles cascading down.

It's a blade - ancient, rusty, the edge chipped and notched from countless battles. The grip is worn smooth by hands long dead. But when you heft it, the balance is perfect. This was a warrior's weapon once. Carried through nightmares and back.

It's not much. But in a realm of nightmares, even a rusty blade is better than bare hands.

You give it a practice swing. The weapon feels right. Deadly."""
