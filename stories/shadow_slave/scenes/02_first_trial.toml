        """
add_items = ["Rusty Blade"]
dialogue = [
  { who = "your_thoughts", line = "This will have to do. At least I'm not defenseless anymore.", mood = "smirk" },
  { who = "your_thoughts", line = "Whatever comes for me next... I'll be ready.", mood = "angry" },
]
[[find_weapon.choices]]
text = "Continue exploring with your new weapon"
goto = "trial_encounter"
[[find_weapon.choices]]
text = "Follow the whispers after all"
goto = "mysterious_whispers"

[first_memory]
transition = "coalesce"
fx = "static"
image = "images/first_memory.svg"
text = """
≋ MEMORY ABSORBED ≋

Your fingers brush the crystallized memory.

Reality SHATTERS.

You're no longer in the temple. You're no longer yourself. You ARE someone else - seeing through their eyes, feeling through their soul, living their final moments.

A warrior. Clad in battered armor, standing atop a mountain of corpses. Surrounded by an endless horde of nightmare creatures that blot out the horizon. Alone. Abandoned. But not defeated.

You feel their determination. Their refusal to yield. Their perfect form as they raise their sword one final time...

'Not one step back,' they whisper. 'Not one inch of ground.'

And then they charge.

The memory fractures like glass. You're gasping, back in the temple, but changed. The knowledge burns in your muscles, your bones, your very soul. You know how to stand now. How to strike. How to survive against impossible odds.

The crystallized memory has dissolved into nothing. But it lives on... in you."""
