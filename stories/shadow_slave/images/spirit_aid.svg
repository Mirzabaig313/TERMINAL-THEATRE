<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- The spirits answer: three ghost warriors in spectral armor cross blades to stop the Guardian's descending fist above the Aspirant. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06040e"/>
      <stop offset="0.55" stop-color="#22123a"/>
      <stop offset="1" stop-color="#5a1c44"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a38"/>
      <stop offset="1" stop-color="#05030a"/>
    </linearGradient>
    <linearGradient id="obs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2340"/>
      <stop offset="0.5" stop-color="#100c1a"/>
      <stop offset="1" stop-color="#050309"/>
    </linearGradient>
    <linearGradient id="spirit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f0fc" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#9ab4d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9ab4d8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="silver" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4f8ff" stop-opacity="0.8"/>
      <stop offset="0.35" stop-color="#b8cce8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#b8cce8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe0a0"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <g id="knight">
      <!-- spectral armored warrior; origin is the grip of the raised blade -->
      <path d="M-14,-4 C-24,-4 -26,6 -24,14 L-20,18 H-8 L-4,12 C-2,4 -6,-4 -14,-4 Z"/>
      <path d="M-18,-4 C-26,-14 -38,-12 -44,-4 C-36,-8 -28,-4 -22,2 Z"/>
      <ellipse cx="-30" cy="22" rx="9" ry="6"/>
      <ellipse cx="2" cy="22" rx="9" ry="6"/>
      <path d="M-30,22 H2 L-6,52 C4,70 8,96 12,130 L0,118 L-6,134 L-14,118 L-22,134 L-28,118 L-40,128 C-36,96 -32,70 -24,52 Z"/>
      <path d="M2,20 L4,2 L-2,0 L-6,18 Z"/>
      <path d="M-30,24 L-8,4 L-4,8 L-24,30 Z"/>
      <path d="M-20,10 H-8" stroke="#2a3a5a" stroke-width="2"/>
    </g>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <path d="M0,0 H640 V36 C580,54 520,28 460,48 C400,68 340,36 280,52 C220,68 160,40 100,54 C60,62 30,50 0,56 Z" fill="#05030a" opacity="0.85"/>
  <g fill="#1a0e28">
    <path d="M30,270 V140 L44,126 L58,144 V270 Z"/>
    <path d="M150,270 V190 H176 V270 Z"/>
  </g>
  <path d="M0,266 C160,258 480,258 640,266 V360 H0 Z" fill="url(#ground)"/>

  <!-- the Guardian, looming in from the right, fist coming down -->
  <g>
    <path d="M500,360 L520,250 L600,250 L620,360 Z" fill="url(#obs)"/>
    <path d="M470,110 C500,96 620,96 650,110 V260 H490 C478,210 470,160 470,110 Z" fill="url(#obs)"/>
    <path d="M540,100 C534,74 538,52 552,40 L564,34 L576,40 C590,52 594,74 588,100 Z" fill="url(#obs)"/>
    <path d="M550,46 C536,34 532,16 540,0 C542,18 548,30 558,38 Z M578,46 C592,34 596,16 588,0 C586,18 580,30 570,38 Z" fill="#0b0814"/>
    <path d="M546,66 Q564,60 582,66 L578,74 Q564,70 550,74 Z" fill="#000"/>
    <ellipse cx="556" cy="68" rx="6" ry="3" fill="url(#ember)"/>
    <ellipse cx="572" cy="68" rx="6" ry="3" fill="url(#ember)"/>
    <path d="M500,104 C480,98 456,108 446,132 C462,126 480,126 500,132 Z" fill="#14101f"/>
    <!-- arm and fist descending -->
    <path d="M470,120 C440,130 400,140 370,150 L380,172 C410,164 450,154 480,146 Z" fill="url(#obs)"/>
    <path d="M330,140 C330,126 354,120 372,128 L384,162 C380,178 352,182 338,172 Z" fill="#0b0814"/>
    <path d="M340,150 L376,140 M342,162 L380,154" stroke="#2c2444" stroke-width="2"/>
    <g stroke="#a898d0" stroke-width="1.4" fill="none" opacity="0.5">
      <path d="M542,62 C540,52 546,44 552,40 L564,34"/><path d="M330,140 C330,126 354,120 372,128"/><path d="M446,132 C456,108 480,98 500,104"/>
    </g>
  </g>

  <!-- silvery radiance where spirit meets nightmare -->
  <circle cx="300" cy="170" r="130" fill="url(#silver)"/>

  <!-- the ghost warriors, blades crossed against the fist -->
  <g fill="url(#spirit)">
    <use href="#knight" transform="translate(242,172)"/>
    <use href="#knight" transform="translate(292,202) scale(1.05)"/>
    <use href="#knight" transform="translate(198,216) scale(0.9)"/>
  </g>
  <!-- blades of ethereal fire -->
  <g stroke-linecap="round">
    <g stroke="#cfe0ff" stroke-width="9" opacity="0.4" filter="url(#soft)">
      <path d="M242,172 L320,126"/><path d="M292,202 L336,150"/><path d="M198,216 L300,170"/>
    </g>
    <g stroke="#f4f8ff" stroke-width="3">
      <path d="M242,172 L320,126"/><path d="M292,202 L336,150"/><path d="M198,216 L300,170"/>
    </g>
  </g>
  <!-- impact sparks -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
    <path d="M326,132 l14,-10 M330,140 l18,2 M322,124 l2,-16 M338,148 l12,10"/>
  </g>
  <circle cx="328" cy="138" r="10" fill="#ffffff" opacity="0.7" filter="url(#soft)"/>

  <!-- the Aspirant beneath them, kneeling, one hand raised -->
  <g fill="#030108">
    <ellipse cx="250" cy="336" rx="40" ry="5" opacity="0.6"/>
    <circle cx="246" cy="284" r="9"/>
    <path d="M234,294 Q246,290 258,294 L262,316 L276,322 L274,336 L240,336 L234,320 Z"/>
    <path d="M256,296 L272,270 L278,274 L262,302 Z"/>
    <path d="M234,298 L224,322 L230,324 L240,306 Z"/>
  </g>
  <path d="M242,280 Q248,274 254,280" stroke="#cfe0ff" stroke-width="1.5" fill="none" opacity="0.8"/>

  <!-- motes of silver light -->
  <g fill="#e8f0fc" opacity="0.85">
    <circle cx="180" cy="150" r="1.4"/><circle cx="360" cy="220" r="1.2"/><circle cx="220" cy="120" r="1"/>
    <circle cx="400" cy="190" r="1"/><circle cx="160" cy="250" r="1.2"/><circle cx="330" cy="260" r="1"/>
  </g>
</svg>
