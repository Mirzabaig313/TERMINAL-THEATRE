<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- Temple of the Forgotten: faceless statues watch a silver crystallized memory glowing on an obsidian pedestal. -->
  <defs>
    <radialGradient id="room" cx="0.5" cy="0.55" r="0.7">
      <stop offset="0" stop-color="#2a2448"/>
      <stop offset="0.4" stop-color="#140f28"/>
      <stop offset="1" stop-color="#05030a"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1530"/>
      <stop offset="1" stop-color="#06040c"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4f2ff" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#c8c4f0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9d8ad8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#dcd6ff"/>
      <stop offset="1" stop-color="#9a8ee0"/>
    </linearGradient>
    <linearGradient id="statue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c0a18"/>
      <stop offset="1" stop-color="#2a2646"/>
    </linearGradient>
    <linearGradient id="statueR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#0c0a18"/>
      <stop offset="1" stop-color="#2a2646"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8c4f0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c8c4f0" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="statueL">
      <!-- hooded robed figure, face worn smooth -->
      <path d="M0,0 C-14,0 -20,14 -18,28 C-30,38 -34,80 -32,150 H32 C34,80 30,38 18,28 C20,14 14,0 0,0 Z"/>
      <rect x="-40" y="150" width="80" height="18"/>
    </g>
  </defs>

  <rect width="640" height="360" fill="url(#room)"/>

  <!-- impossible curving vault -->
  <g fill="none" stroke="#0a0814" stroke-width="22">
    <path d="M-20,360 C40,120 140,30 320,22 C500,30 600,120 660,360"/>
  </g>
  <g fill="none" stroke="#221c3c" stroke-width="3" opacity="0.8">
    <path d="M30,360 C80,150 170,60 320,52 C470,60 560,150 610,360"/>
    <path d="M110,300 C140,160 210,100 320,94 C430,100 500,160 530,300"/>
    <path d="M190,250 C210,170 250,136 320,132 C390,136 430,170 450,250"/>
  </g>
  <!-- a far doorway of deeper dark -->
  <path d="M290,236 V170 Q320,140 350,170 V236 Z" fill="#04030a"/>

  <!-- floor tiles converging -->
  <path d="M0,360 L250,236 H390 L640,360 Z" fill="url(#floor)"/>
  <g stroke="#262040" stroke-width="1.2" opacity="0.8">
    <line x1="320" y1="236" x2="320" y2="360"/>
    <line x1="285" y1="236" x2="170" y2="360"/><line x1="355" y1="236" x2="470" y2="360"/>
    <line x1="265" y1="236" x2="40" y2="360"/><line x1="375" y1="236" x2="600" y2="360"/>
    <line x1="200" y1="268" x2="440" y2="268"/><line x1="120" y1="308" x2="520" y2="308"/>
  </g>

  <!-- statues, receding, watching -->
  <g fill="url(#statue)">
    <use href="#statueL" transform="translate(240,150) scale(0.42)"/>
    <use href="#statueL" transform="translate(180,128) scale(0.7)"/>
    <use href="#statueL" transform="translate(70,90) scale(1.2)"/>
  </g>
  <g fill="url(#statueR)">
    <use href="#statueL" transform="translate(400,150) scale(0.42)"/>
    <use href="#statueL" transform="translate(460,128) scale(0.7)"/>
    <use href="#statueL" transform="translate(570,90) scale(1.2)"/>
  </g>
  <!-- the blank faces catch a little silver -->
  <g fill="#8a86b8" opacity="0.35">
    <ellipse cx="74" cy="114" rx="7" ry="10"/><ellipse cx="566" cy="114" rx="7" ry="10"/>
    <ellipse cx="183" cy="142" rx="4" ry="6"/><ellipse cx="457" cy="142" rx="4" ry="6"/>
  </g>

  <!-- light pooling on the floor -->
  <polygon points="290,250 350,250 430,360 210,360" fill="url(#spill)"/>

  <!-- obsidian pedestal carved with spiraling runes -->
  <path d="M290,300 L300,236 H340 L350,300 Z" fill="#0a0814"/>
  <rect x="282" y="296" width="76" height="12" fill="#07060e"/>
  <rect x="292" y="228" width="56" height="10" fill="#120f22"/>
  <g stroke="#9d4edd" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M320,262 m-8,0 a8,8 0 1,1 8,8 a5,5 0 1,1 -5,-5"/>
    <path d="M304,248 l4,6 l4,-6 M328,286 h10 M330,248 v8"/>
  </g>

  <!-- the crystallized memory -->
  <circle cx="320" cy="198" r="70" fill="url(#aura)"/>
  <circle cx="320" cy="198" r="26" fill="#ffffff" opacity="0.4" filter="url(#blur)"/>
  <path d="M320,166 L338,194 L320,226 L302,194 Z" fill="url(#crystal)"/>
  <path d="M320,166 L338,194 L320,198 Z" fill="#ffffff" opacity="0.7"/>
  <path d="M302,194 L320,198 L320,226 Z" fill="#7a6ec8" opacity="0.5"/>
  <!-- a tiny warrior frozen inside -->
  <path d="M318,190 h4 v10 l3,8 h-2 l-3,-6 l-3,6 h-2 l3,-8 Z M322,192 l6,-8" stroke="#3a2a6a" stroke-width="1.2" fill="#3a2a6a" opacity="0.7"/>

  <!-- cold breath mist low on the floor -->
  <g fill="#b8b4e0" opacity="0.12" filter="url(#blur)">
    <ellipse cx="180" cy="330" rx="160" ry="16"/>
    <ellipse cx="480" cy="320" rx="150" ry="14"/>
  </g>

  <!-- motes -->
  <g fill="#e8e6ff" opacity="0.8">
    <circle cx="296" cy="160" r="1.3"/><circle cx="350" cy="150" r="1"/><circle cx="270" cy="210" r="1"/>
    <circle cx="372" cy="224" r="1.2"/><circle cx="332" cy="130" r="0.9"/>
  </g>
</svg>
