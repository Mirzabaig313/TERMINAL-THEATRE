<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- The Warrior's Echo: a lone armored warrior on a hill of broken weapons raises a sword against an endless shadow horde, seen through a shattering memory. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0818"/>
      <stop offset="0.5" stop-color="#2e1440"/>
      <stop offset="0.8" stop-color="#7a2440"/>
      <stop offset="1" stop-color="#b04a3a"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2440"/>
      <stop offset="1" stop-color="#05030a"/>
    </linearGradient>
    <linearGradient id="horde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a18"/>
      <stop offset="1" stop-color="#08050c"/>
    </linearGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#dcd6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#dcd6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>

  <!-- a sky full of monsters: winged shapes wheeling -->
  <g fill="#0a0610">
    <path d="M120,70 q14,-12 26,0 q12,-12 26,0 q-14,-4 -26,8 q-12,-12 -26,-8 Z"/>
    <path d="M220,40 q10,-8 18,0 q8,-8 18,0 q-10,-3 -18,6 q-8,-9 -18,-6 Z"/>
    <path d="M420,60 q16,-14 30,0 q14,-14 30,0 q-16,-4 -30,10 q-14,-14 -30,-10 Z"/>
    <path d="M520,110 q10,-8 18,0 q8,-8 18,0 q-10,-3 -18,6 q-8,-9 -18,-6 Z"/>
    <path d="M60,130 q8,-6 14,0 q6,-6 14,0 q-8,-2 -14,5 q-6,-7 -14,-5 Z"/>
    <path d="M340,30 q8,-6 14,0 q6,-6 14,0 q-8,-2 -14,5 q-6,-7 -14,-5 Z"/>
    <path d="M580,40 q8,-6 14,0 q6,-6 14,0 q-8,-2 -14,5 q-6,-7 -14,-5 Z"/>
  </g>

  <!-- the endless horde filling the horizon, ember eyes by the hundred -->
  <path d="M0,230 C20,214 34,224 50,212 C64,222 80,206 96,216 C110,204 126,218 140,208 C156,220 170,204 186,214 C200,202 216,218 232,208 C248,220 262,206 278,216 C292,204 308,216 324,206 C340,218 356,204 372,214 C388,202 404,216 420,208 C436,220 450,204 466,214 C482,202 498,218 514,206 C530,218 546,204 562,214 C578,202 594,218 610,208 C624,216 632,210 640,214 V360 H0 Z" fill="url(#horde)"/>
  <g fill="#ff8a3a">
    <circle cx="30" cy="226" r="1.3"/><circle cx="70" cy="222" r="1.3"/><circle cx="104" cy="230" r="1.3"/>
    <circle cx="150" cy="222" r="1.3"/><circle cx="196" cy="228" r="1.3"/><circle cx="240" cy="222" r="1.3"/>
    <circle cx="410" cy="224" r="1.3"/><circle cx="452" cy="230" r="1.3"/><circle cx="500" cy="220" r="1.3"/>
    <circle cx="540" cy="228" r="1.3"/><circle cx="586" cy="222" r="1.3"/><circle cx="626" cy="230" r="1.3"/>
    <circle cx="50" cy="256" r="1.6"/><circle cx="120" cy="262" r="1.6"/><circle cx="190" cy="252" r="1.6"/>
    <circle cx="470" cy="256" r="1.6"/><circle cx="540" cy="262" r="1.6"/><circle cx="610" cy="252" r="1.6"/>
    <circle cx="20" cy="300" r="2"/><circle cx="90" cy="296" r="2"/><circle cx="560" cy="298" r="2"/><circle cx="620" cy="304" r="2"/>
  </g>
  <g fill="#ffd0a0" opacity="0.8">
    <circle cx="74" cy="222" r="1.3"/><circle cx="244" cy="222" r="1.3"/><circle cx="504" cy="220" r="1.3"/>
    <circle cx="124" cy="262" r="1.6"/><circle cx="544" cy="262" r="1.6"/><circle cx="96" cy="296" r="2"/>
  </g>
  <!-- the front rank: hunched, horned, clawing forward -->
  <g fill="#05030a">
    <path d="M60,360 C56,320 70,290 96,280 L84,252 L104,272 L112,246 L118,274 C140,276 156,296 152,320 L176,300 L162,330 L180,326 L150,360 Z"/>
    <path d="M590,360 C594,320 580,290 554,280 L566,252 L546,272 L538,246 L532,274 C510,276 494,296 498,320 L474,300 L488,330 L470,326 L500,360 Z"/>
  </g>
  <g fill="#ff8a3a"><circle cx="110" cy="290" r="2"/><circle cx="120" cy="292" r="1.6"/><circle cx="540" cy="290" r="2"/><circle cx="530" cy="292" r="1.6"/></g>

  <!-- the hill of broken weapons and fallen banners -->
  <path d="M170,360 C210,300 260,262 320,256 C380,262 430,300 470,360 Z" fill="url(#hill)"/>
  <g stroke="#2a1c34" stroke-width="3" stroke-linecap="round">
    <line x1="230" y1="300" x2="210" y2="274"/><line x1="410" y1="304" x2="434" y2="272"/>
    <line x1="270" y1="280" x2="262" y2="250"/><line x1="380" y1="284" x2="394" y2="256"/>
  </g>
  <path d="M262,250 l-16,6 l14,8 Z" fill="#3a1830"/>
  <path d="M394,256 l18,2 l-12,10 Z" fill="#3a1830"/>

  <!-- the warrior: battered armor, left foot planted, sword raised -->
  <circle cx="370" cy="70" r="80" fill="url(#flare)"/>
  <g fill="#04020a">
    <!-- cloak streaming back -->
    <path d="M304,168 C286,190 270,220 262,250 L276,242 L280,256 L292,236 L298,250 L312,206 Z"/>
    <!-- legs: left planted forward, right braced -->
    <path d="M312,204 L300,232 L292,258 H306 L312,234 L322,212 Z"/>
    <path d="M326,206 L338,232 L350,258 H362 L346,230 L334,204 Z"/>
    <!-- torso and pauldrons -->
    <path d="M304,166 L338,166 L332,208 L310,208 Z"/>
    <ellipse cx="303" cy="168" rx="10" ry="7"/>
    <ellipse cx="340" cy="166" rx="10" ry="7"/>
    <!-- helmet with a broken crest -->
    <path d="M312,162 C310,146 316,138 322,138 C330,138 334,148 332,162 Z"/>
    <path d="M324,140 C318,126 304,122 292,128 C304,130 312,136 316,146 Z"/>
    <!-- shield arm -->
    <path d="M298,170 L288,196 L294,198 L304,176 Z"/>
    <circle cx="290" cy="200" r="13"/>
    <!-- sword arm thrust high -->
    <path d="M342,162 L358,132 L352,128 L336,160 Z"/>
    <rect x="348" y="124" width="16" height="5" transform="rotate(-20 356 126)"/>
  </g>
  <path d="M362,120 L392,36" stroke="#e8e6ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M392,36 L394,30" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#b8a8e0" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M338,168 L334,206"/><path d="M322,138 C330,138 334,148 332,162"/><path d="M350,166 C346,160 342,160 338,162"/>
  </g>

  <!-- the memory shattering: silver fracture lines -->
  <g stroke="#e8e6ff" stroke-width="1.2" fill="none" opacity="0.55">
    <path d="M392,36 L460,20 L520,0"/>
    <path d="M392,36 L470,110 L560,96 L640,130"/>
    <path d="M392,36 L300,30 L250,0"/>
    <path d="M392,36 L200,100 L120,90 L0,120"/>
    <path d="M460,20 L470,110"/>
    <path d="M300,30 L200,100"/>
    <path d="M560,96 L600,0"/>
    <path d="M120,90 L80,0"/>
  </g>
  <g fill="#e8e6ff" opacity="0.08">
    <path d="M392,36 L460,20 L470,110 Z"/>
    <path d="M392,36 L300,30 L200,100 Z"/>
  </g>

  <rect width="640" height="360" fill="url(#vignette)"/>
</svg>
