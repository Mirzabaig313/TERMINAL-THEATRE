<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- The shadows obey: the Aspirant raises a hand and a legion of eyeless shadow-soldiers drags the Guardian to its knees. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06030c"/>
      <stop offset="0.5" stop-color="#22103a"/>
      <stop offset="0.85" stop-color="#5a189a"/>
      <stop offset="1" stop-color="#6a2060"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1030"/>
      <stop offset="1" stop-color="#05030a"/>
    </linearGradient>
    <linearGradient id="obs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2340"/>
      <stop offset="0.5" stop-color="#100c1a"/>
      <stop offset="1" stop-color="#050309"/>
    </linearGradient>
    <radialGradient id="power" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c77dff" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#9d4edd" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5a189a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd890"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="smoke" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <path id="soldier" d="M0,0 C-6,0 -8,6 -7,12 C-12,14 -20,16 -23,8 L-28,-8 L-24,-10 L-21,-2 L-18,-8 L-17,4 C-15,10 -14,16 -14,26 C-16,44 -12,70 -14,96 L-4,88 L0,98 L4,88 L14,96 C12,70 16,44 14,26 C14,16 15,10 17,4 L18,-8 L21,-2 L24,-10 L28,-8 L23,8 C20,16 12,14 7,12 C8,6 6,0 0,0 Z"/>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <path d="M0,0 H640 V40 C580,58 520,30 460,52 C400,74 340,40 280,58 C220,76 160,44 100,60 C60,70 30,56 0,62 Z" fill="#05030a" opacity="0.85"/>

  <!-- ruins -->
  <g fill="#1a0e28">
    <path d="M40,260 V120 L54,106 L70,124 V260 Z"/>
    <path d="M590,260 V140 L606,128 L622,146 V260 Z"/>
  </g>
  <path d="M0,256 C160,248 480,248 640,256 V360 H0 Z" fill="url(#ground)"/>

  <!-- the Guardian, on one knee, buried under shadow -->
  <g transform="translate(410,0)">
    <path d="M-40,250 L-48,290 H-10 L-6,262 Z" fill="url(#obs)"/>
    <path d="M10,232 L52,248 L60,290 H34 L30,262 L4,256 Z" fill="url(#obs)"/>
    <path d="M-56,130 C-40,120 40,120 56,130 C52,170 40,200 28,236 H-28 C-40,200 -52,170 -56,130 Z" fill="url(#obs)"/>
    <path d="M-12,128 C-16,108 -12,92 0,86 C12,92 16,108 12,128 Z" fill="url(#obs)"/>
    <path d="M-8,92 C-20,82 -24,66 -18,54 C-16,68 -10,78 -2,86 Z M8,92 C20,82 24,66 18,54 C16,68 10,78 2,86 Z" fill="#0b0814"/>
    <ellipse cx="-5" cy="106" rx="4" ry="2" fill="url(#ember)"/>
    <ellipse cx="6" cy="106" rx="4" ry="2" fill="url(#ember)"/>
    <!-- arm flung up, crushing a handful of shadows -->
    <path d="M50,134 L86,90 L98,98 L62,146 Z" fill="url(#obs)"/>
    <path d="M84,72 C96,68 108,76 104,92 L88,100 Z" fill="#0b0814"/>
    <path d="M-50,140 L-80,190 L-70,196 L-40,152 Z" fill="url(#obs)"/>
    <!-- roaring: a crack of fire across the chest -->
    <path d="M-30,150 L-10,162 L-14,170 L14,176 L10,186 L34,194" stroke="#ff8a3a" stroke-width="2" fill="none"/>
  </g>

  <!-- shadow-soldiers swarming it -->
  <g fill="#030108">
    <use href="#soldier" transform="translate(330,170) rotate(20) scale(0.8)"/>
    <use href="#soldier" transform="translate(360,120) rotate(-10) scale(0.7)"/>
    <use href="#soldier" transform="translate(470,140) rotate(-30) scale(0.75)"/>
    <use href="#soldier" transform="translate(440,90) rotate(10) scale(0.6)"/>
    <use href="#soldier" transform="translate(500,70) rotate(-40) scale(0.55)"/>
    <use href="#soldier" transform="translate(384,200) rotate(5) scale(0.7)"/>
    <use href="#soldier" transform="translate(320,228) scale(0.8)"/>
    <use href="#soldier" transform="translate(460,214) scale(0.8)"/>
    <use href="#soldier" transform="translate(290,212) scale(0.7)"/>
    <use href="#soldier" transform="translate(510,206) scale(0.75)"/>
    <use href="#soldier" transform="translate(410,214) scale(0.65)"/>
    <use href="#soldier" transform="translate(550,226) scale(0.7)"/>
    <use href="#soldier" transform="translate(260,232) scale(0.6)"/>
  </g>
  <!-- smoke tearing off the Guardian -->
  <g fill="#030108" opacity="0.7" filter="url(#smoke)">
    <ellipse cx="380" cy="160" rx="30" ry="20"/><ellipse cx="450" cy="180" rx="34" ry="22"/>
    <ellipse cx="410" cy="250" rx="80" ry="20"/>
  </g>
  <!-- the soldiers' eyes, pale and reverent -->
  <g fill="#e9d5ff">
    <circle cx="327" cy="178" r="1.2"/><circle cx="332" cy="179" r="1.2"/>
    <circle cx="359" cy="126" r="1.1"/><circle cx="363" cy="126" r="1.1"/>
    <circle cx="317" cy="235" r="1.2"/><circle cx="323" cy="235" r="1.2"/>
    <circle cx="457" cy="221" r="1.2"/><circle cx="463" cy="221" r="1.2"/>
    <circle cx="287" cy="218" r="1.1"/><circle cx="292" cy="218" r="1.1"/>
    <circle cx="507" cy="212" r="1.1"/><circle cx="513" cy="212" r="1.1"/>
    <circle cx="547" cy="232" r="1.1"/><circle cx="552" cy="232" r="1.1"/>
    <circle cx="257" cy="237" r="1"/><circle cx="262" cy="237" r="1"/>
  </g>

  <!-- more rising from the cracks, along the Aspirant's stretched shadow -->
  <path d="M112,342 C170,322 230,304 290,284 L300,272 L318,272 L320,282 C260,306 190,330 132,348 Z" fill="#030108" opacity="0.9"/>
  <g stroke="#9d4edd" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M140,338 C200,316 250,300 312,280"/>
  </g>
  <g fill="#030108">
    <use href="#soldier" transform="translate(220,262) scale(0.75)"/>
    <use href="#soldier" transform="translate(266,252) scale(0.65)"/>
    <use href="#soldier" transform="translate(200,290) scale(0.5)" opacity="0.7"/>
    <use href="#soldier" transform="translate(300,262) scale(0.4)" opacity="0.6"/>
  </g>
  <g fill="#e9d5ff">
    <circle cx="217" cy="268" r="1.2"/><circle cx="223" cy="268" r="1.2"/>
    <circle cx="263" cy="258" r="1.1"/><circle cx="268" cy="258" r="1.1"/>
  </g>

  <!-- the Aspirant, hand raised, power gathering -->
  <circle cx="132" cy="196" r="70" fill="url(#power)"/>
  <g fill="#030108">
    <ellipse cx="120" cy="344" rx="36" ry="5" opacity="0.6"/>
    <circle cx="116" cy="244" r="10"/>
    <path d="M102,256 Q116,252 130,256 L134,296 L128,340 H118 L116,304 L112,340 H102 L98,296 Z"/>
    <path d="M102,258 L88,296 L94,298 L108,268 Z"/>
    <path d="M124,258 L140,224 L136,202 L146,200 L152,228 L136,268 Z"/>
  </g>
  <circle cx="140" cy="196" r="7" fill="#e9d5ff" opacity="0.8" filter="url(#smoke)"/>
  <circle cx="140" cy="196" r="3" fill="#ffffff"/>
  <!-- tendrils of darkness unspooling from the raised hand -->
  <g stroke="#9d4edd" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.35" filter="url(#smoke)">
    <path d="M144,194 C190,160 240,170 300,150"/>
    <path d="M144,198 C200,200 250,186 320,196"/>
    <path d="M140,190 C170,140 220,120 290,110"/>
  </g>
  <g stroke="#c77dff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M144,194 C190,160 240,170 300,150"/>
    <path d="M144,198 C200,200 250,186 320,196"/>
    <path d="M140,190 C170,140 220,120 290,110"/>
  </g>
  <path d="M110,240 Q116,234 122,240" stroke="#c77dff" stroke-width="1.5" fill="none"/>

  <g fill="#c77dff" opacity="0.7">
    <circle cx="200" cy="180" r="1.3"/><circle cx="250" cy="140" r="1.2"/><circle cx="170" cy="230" r="1"/>
    <circle cx="560" cy="100" r="1"/><circle cx="600" cy="200" r="1.2"/>
  </g>
</svg>
