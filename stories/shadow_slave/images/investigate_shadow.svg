<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- The Aspirant hides behind a pillar, watching a herd of faceless shadow beasts graze in the ruins. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0614"/>
      <stop offset="0.5" stop-color="#2a1240"/>
      <stop offset="0.85" stop-color="#6a1c44"/>
      <stop offset="1" stop-color="#7a2440"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1430"/>
      <stop offset="0.5" stop-color="#24122e"/>
      <stop offset="1" stop-color="#06040b"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05030a"/>
      <stop offset="0.75" stop-color="#0d0814"/>
      <stop offset="1" stop-color="#3a1a40"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8a0d0" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#c8a0d0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c8a0d0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8e0f4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c8b8e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="smear" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <path id="beast" d="M0,0 C10,-30 70,-36 100,-20 C112,-14 118,0 124,14 C128,28 132,40 128,50 C122,54 114,52 115,42 C112,30 104,18 96,12 L95,60 H88 L84,16 C64,20 40,20 22,16 L19,60 H12 L9,12 C2,10 -10,6 -18,14 C-12,2 -6,0 0,0 Z"/>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="160" cy="60" r="90" fill="url(#moon)"/>
  <circle cx="160" cy="60" r="14" fill="#ece6f6"/>
  <path d="M0,30 C80,14 160,44 240,26 C320,12 400,40 480,24 C560,10 600,30 640,22 V0 H0 Z" fill="#0a0612" opacity="0.85"/>
  <path d="M90,74 C130,64 170,80 220,70 V80 C180,90 130,80 90,86 Z" fill="#0a0612" opacity="0.7"/>

  <!-- distant ruins -->
  <g fill="#3a1840" opacity="0.9">
    <path d="M230,210 V130 L240,118 L250,130 V210 Z"/>
    <path d="M300,210 V96 H316 V84 H330 V96 H346 V210 Z"/>
    <path d="M420,210 V140 Q450,100 480,140 V210 Z"/>
    <path d="M540,210 V110 L552,96 L566,112 V210 Z"/>
    <path d="M600,210 V150 H640 V210 Z"/>
  </g>
  <rect y="170" width="640" height="60" fill="url(#mist)"/>

  <!-- ground -->
  <path d="M0,220 C120,212 260,222 400,214 C500,208 580,216 640,212 V360 H0 Z" fill="url(#ground)"/>
  <!-- what might once have been grass -->
  <g stroke="#3a2040" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <path d="M260,262 l-3,-8 m6,8 l1,-9 m4,9 l4,-7"/>
    <path d="M420,276 l-3,-8 m6,8 l1,-9 m4,9 l4,-7"/>
    <path d="M540,256 l-3,-8 m6,8 l1,-9 m4,9 l4,-7"/>
    <path d="M330,300 l-3,-8 m6,8 l1,-9 m4,9 l4,-7"/>
  </g>

  <!-- a glow of mist low on the plain so the herd reads against it -->
  <ellipse cx="400" cy="232" rx="300" ry="34" fill="#8a3a6a" opacity="0.35" filter="url(#smear)"/>
  <rect y="200" width="640" height="70" fill="url(#mist)"/>

  <!-- the herd: smeared ink silhouettes, heads lowered to graze -->
  <g fill="#07040c">
    <g transform="translate(540,224) scale(-0.45,0.45)">
      <use href="#beast" filter="url(#smear)" opacity="0.7"/>
      <use href="#beast"/>
    </g>
    <g transform="translate(250,230) scale(0.6)">
      <use href="#beast" filter="url(#smear)" opacity="0.7"/>
      <use href="#beast"/>
      <rect x="28" y="12" width="6" height="48"/><rect x="74" y="12" width="6" height="48"/>
    </g>
    <g transform="translate(560,240) scale(0.7)">
      <use href="#beast" filter="url(#smear)" opacity="0.7"/>
      <use href="#beast"/>
      <rect x="28" y="12" width="6" height="48"/><rect x="74" y="12" width="6" height="48"/>
    </g>
    <!-- near, head raised, listening -->
    <g transform="translate(330,262)">
      <path d="M0,0 C10,-30 70,-36 100,-22 C112,-26 120,-44 126,-58 C132,-66 144,-64 146,-56 C148,-46 140,-40 132,-34 C122,-20 114,-10 104,-2 L106,62 H98 L92,8 C70,14 40,14 22,12 L18,62 H10 L8,10 C0,10 -14,6 -24,16 C-16,2 -8,0 0,0 Z" filter="url(#smear)" opacity="0.75"/>
      <path d="M0,0 C10,-30 70,-36 100,-22 C112,-26 120,-44 126,-58 C132,-66 144,-64 146,-56 C148,-46 140,-40 132,-34 C122,-20 114,-10 104,-2 L106,62 H98 L92,8 C70,14 40,14 22,12 L18,62 H10 L8,10 C0,10 -14,6 -24,16 C-16,2 -8,0 0,0 Z"/>
      <rect x="30" y="10" width="7" height="52"/><rect x="82" y="6" width="7" height="56"/>
      <!-- smoke rising from the spine -->
      <g fill="none" stroke="#07040c" stroke-linecap="round" opacity="0.8">
        <path d="M20,-18 c-6,-10 6,-16 0,-28" stroke-width="5"/>
        <path d="M46,-26 c-8,-10 8,-18 -2,-32" stroke-width="6"/>
        <path d="M74,-28 c-6,-10 6,-14 2,-26" stroke-width="5"/>
        <path d="M46,-26 c-8,-10 8,-18 -2,-32" stroke-width="12" opacity="0.35" filter="url(#smear)"/>
      </g>
      <path d="M-2,-2 C10,-30 70,-36 100,-22 C112,-26 120,-44 126,-58" stroke="#a87ac8" stroke-width="1.5" fill="none" opacity="0.55"/>
      <!-- a pale sheen where a face should be -->
      <path d="M131,-61 C140,-64 146,-57 144,-50" stroke="#a88ac0" stroke-width="1.5" fill="none" opacity="0.8"/>
    </g>
  </g>
  <!-- ink dripping from their bellies -->
  <g stroke="#07040c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M360,276 q-2,8 1,14"/><path d="M400,272 q3,8 0,16"/>
    <path d="M280,244 q-2,6 1,10"/><path d="M600,252 q2,6 0,10"/>
  </g>
  <ellipse cx="380" cy="326" rx="80" ry="6" fill="#000" opacity="0.45"/>
  <ellipse cx="282" cy="268" rx="44" ry="3" fill="#000" opacity="0.35"/>
  <ellipse cx="596" cy="282" rx="48" ry="3" fill="#000" opacity="0.35"/>

  <!-- the Aspirant, pressed to the stone, peering around it -->
  <g fill="#020105">
    <circle cx="137" cy="196" r="9"/>
    <path d="M128,206 Q142,202 150,212 L152,250 L148,300 L156,330 H144 L136,300 L132,330 H120 L126,290 L124,240 Z"/>
    
    
  </g>
  <path d="M133,191 Q138,186 143,190" stroke="#c77dff" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- foreground: the pillar the Aspirant hides behind -->
  <path d="M0,0 H40 L60,10 L48,22 L62,40 V360 H0 Z" fill="#04020a"/>
  <path d="M70,360 V60 L84,48 L100,58 L118,44 L132,60 V360 Z" fill="url(#pillar)"/>
  <g stroke="#9d4edd" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M96,120 v12 l6,-4"/><path d="M92,160 h12 m-6,-6 v12"/>
  </g>
  <!-- fingers curled around the pillar edge -->
  <path d="M128,226 q8,-4 8,4 q0,6 -8,6 Z" fill="#020105"/>

  <!-- drifting ash -->
  <g fill="#d8c8e8" opacity="0.5">
    <circle cx="200" cy="140" r="1.2"/><circle cx="340" cy="180" r="1"/><circle cx="520" cy="150" r="1.3"/>
    <circle cx="600" cy="260" r="1"/><circle cx="300" cy="330" r="1.1"/><circle cx="560" cy="330" r="1"/>
  </g>
</svg>
