<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- Warehouse 47 at the end of Pier 9: two guards smoking by the loading door, light leaking underneath, Malone hidden behind stacked crates. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="0.7" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#2a2a2c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1c"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121213"/>
      <stop offset="0.5" stop-color="#1c1b1b"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="pier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b16"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d48a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f4d48a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cf72" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f6cf72" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3a30" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3a30" stop-opacity="0"/>
    </radialGradient>
    <filter id="fog" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <g id="guard">
      <ellipse cx="0" cy="-88" rx="14" ry="2.6"/>
      <path d="M-11 -88 Q-10 -96 0 -97 Q10 -96 11 -88 Z"/>
      <ellipse cx="0" cy="-82" rx="6" ry="7"/>
      <path d="M-14 -74 Q-6 -77.5 0 -77 Q6 -77.5 14 -74 L19 -40 L21 -12 L-21 -12 L-18 -40 Z"/>
      <rect x="-9" y="-13" width="6" height="12"/>
      <rect x="3" y="-13" width="6" height="12"/>
      <!-- tommy gun under the raincoat -->
      <path d="M-8 -50 L16 -60 L18 -56 L-6 -46 Z"/>
    </g>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- distant cranes and the far shore -->
  <g fill="#101012">
    <path d="M20 200 L20 120 L24 120 L24 200 Z M22 124 L90 140 L90 144 L22 130 Z"/>
    <rect x="0" y="196" width="230" height="20"/>
    <rect x="60" y="186" width="40" height="12"/><rect x="130" y="180" width="26" height="18"/>
  </g>
  <!-- harbour water -->
  <rect x="0" y="214" width="640" height="146" fill="url(#water)"/>
  <g stroke="#55524a" stroke-width="1" opacity="0.5">
    <line x1="10" y1="236" x2="60" y2="236"/><line x1="90" y1="248" x2="150" y2="248"/>
    <line x1="30" y1="266" x2="80" y2="266"/><line x1="120" y1="282" x2="170" y2="282"/>
    <line x1="20" y1="306" x2="90" y2="306"/><line x1="140" y1="330" x2="200" y2="330"/>
  </g>
  <!-- fog lying on the water -->
  <ellipse cx="140" cy="220" rx="200" ry="14" fill="#8a8a88" opacity="0.18" filter="url(#fog)"/>

  <!-- Warehouse 47: corrugated iron, gable roof -->
  <path d="M232 262 L232 104 L416 54 L604 104 L604 262 Z" fill="url(#iron)"/>
  <g stroke="#060606" stroke-width="1.5" opacity="0.8">
    <line x1="246" y1="101" x2="246" y2="262"/><line x1="262" y1="96" x2="262" y2="262"/>
    <line x1="278" y1="92" x2="278" y2="262"/><line x1="294" y1="88" x2="294" y2="262"/>
    <line x1="310" y1="83" x2="310" y2="262"/><line x1="326" y1="79" x2="326" y2="262"/>
    <line x1="342" y1="75" x2="342" y2="262"/><line x1="490" y1="74" x2="490" y2="262"/>
    <line x1="506" y1="78" x2="506" y2="262"/><line x1="522" y1="82" x2="522" y2="262"/>
    <line x1="538" y1="86" x2="538" y2="262"/><line x1="554" y1="91" x2="554" y2="262"/>
    <line x1="570" y1="95" x2="570" y2="262"/><line x1="586" y1="99" x2="586" y2="262"/>
  </g>
  <!-- rust streaks -->
  <g stroke="#3a2a1a" stroke-width="3" opacity="0.5">
    <line x1="270" y1="130" x2="270" y2="200"/><line x1="560" y1="120" x2="560" y2="180"/><line x1="300" y1="140" x2="300" y2="170"/>
  </g>
  <path d="M226 106 L416 52 L610 106" fill="none" stroke="#2c2a26" stroke-width="5"/>
  <!-- soaped-over windows, one wiped clean and glowing -->
  <g fill="#3a3934" opacity="0.8">
    <rect x="256" y="128" width="34" height="22"/><rect x="540" y="128" width="34" height="22"/>
  </g>
  <rect x="300" y="128" width="34" height="22" fill="#3a3934" opacity="0.8"/>
  <rect x="496" y="128" width="34" height="22" fill="#6e5a30"/>
  <ellipse cx="508" cy="140" rx="12" ry="8" fill="url(#glow)"/>
  <g stroke="#0a0a0a" stroke-width="2"><line x1="273" y1="128" x2="273" y2="150"/><line x1="317" y1="128" x2="317" y2="150"/><line x1="513" y1="128" x2="513" y2="150"/><line x1="557" y1="128" x2="557" y2="150"/></g>

  <!-- the loading door, the number 47 stencilled above, light leaking under it -->
  <rect x="358" y="158" width="116" height="104" fill="#0b0b0b"/>
  <g stroke="#161616" stroke-width="2">
    <line x1="358" y1="174" x2="474" y2="174"/><line x1="358" y1="190" x2="474" y2="190"/><line x1="358" y1="206" x2="474" y2="206"/>
    <line x1="358" y1="222" x2="474" y2="222"/><line x1="358" y1="238" x2="474" y2="238"/>
  </g>
  <rect x="352" y="152" width="128" height="6" fill="#222120"/>
  <g fill="none" stroke="#cfcac0" stroke-width="5" stroke-linecap="square" opacity="0.85">
    <path d="M398 108 L390 128 L408 128 M404 112 L404 136"/>
    <path d="M418 110 L436 110 L424 136"/>
  </g>
  <rect x="358" y="258" width="116" height="4" fill="#ffd27a"/>
  <polygon points="358,262 474,262 520,300 312,300" fill="url(#leak)" opacity="0.6"/>

  <!-- gooseneck lamp over the door -->
  <path d="M416 100 Q416 88 430 88 L438 88" fill="none" stroke="#0a0a0a" stroke-width="3"/>
  <path d="M428 92 L448 92 L444 98 L432 98 Z" fill="#0a0a0a"/>
  <polygon points="430,98 446,98 520,262 344,262" fill="url(#cone)"/>
  <circle cx="438" cy="98" r="18" fill="url(#glow)"/>

  <!-- the pier, planks running into the dark -->
  <polygon points="140,360 318,262 520,262 640,330 640,360" fill="url(#pier)"/>
  <g stroke="#050505" stroke-width="1.2">
    <line x1="350" y1="262" x2="250" y2="360"/><line x1="380" y1="262" x2="330" y2="360"/>
    <line x1="410" y1="262" x2="410" y2="360"/><line x1="440" y1="262" x2="490" y2="360"/>
    <line x1="470" y1="262" x2="570" y2="360"/><line x1="500" y1="262" x2="640" y2="352"/>
  </g>
  <!-- wet reflections of the door light -->
  <g fill="#f4d48a" opacity="0.28">
    <rect x="380" y="276" width="70" height="2"/><rect x="372" y="290" width="88" height="2"/>
    <rect x="364" y="308" width="100" height="2"/><rect x="356" y="330" width="116" height="3"/>
  </g>
  <!-- pilings -->
  <g fill="#0a0a0a">
    <rect x="304" y="262" width="8" height="24"/><rect x="250" y="292" width="10" height="40"/><rect x="190" y="326" width="12" height="34"/>
  </g>

  <!-- the two guards, cigarettes glowing -->
  <g fill="#030303">
    <use href="#guard" transform="translate(336,264) scale(0.92)"/>
    <use href="#guard" transform="translate(500,264) scale(0.95)"/>
  </g>
  <g fill="#ff8a3a">
    <circle cx="342" cy="190" r="1.8"/><circle cx="494" cy="188" r="1.8"/>
  </g>
  <g fill="none" stroke="#e8c070" stroke-width="1.2" opacity="0.6">
    <path d="M346 178 L349 214 M490 176 L487 214"/>
  </g>

  <!-- call box at the head of the pier, its red light winking -->
  <rect x="586" y="200" width="6" height="110" fill="#080808"/>
  <rect x="578" y="178" width="22" height="30" rx="2" fill="#0c0c0c"/>
  <circle cx="589" cy="172" r="14" fill="url(#redGlow)"/>
  <circle cx="589" cy="172" r="3" fill="#ff4a3a"/>

  <!-- Malone: hat and shoulder edging around the crate, rimmed by the door light -->
  <g fill="#020202">
    <path d="M184 272 Q194 252 214 250 Q234 252 244 272 L246 300 L184 300 Z"/>
    <ellipse cx="216" cy="230" rx="26" ry="5"/>
    <path d="M204 230 L207 212 Q216 207 225 212 L228 230 Z"/>
    <ellipse cx="216" cy="240" rx="11" ry="12"/>
  </g>
  <g fill="none" stroke="#e8c070" stroke-width="1.3" opacity="0.8">
    <path d="M226 228 Q238 229 241 231"/><path d="M225 234 Q228 244 222 250"/><path d="M232 254 Q242 260 244 272"/>
  </g>

  <!-- stacked crates in the foreground, Malone crouched behind them -->
  <g>
    <rect x="70" y="236" width="96" height="70" fill="#24201a"/>
    <rect x="40" y="290" width="150" height="70" fill="#1c1914"/>
    <rect x="166" y="262" width="86" height="98" fill="#181510"/>
    <g fill="none" stroke="#050505" stroke-width="2">
      <path d="M70 236 L166 306 M166 236 L70 306"/>
      <path d="M40 290 L190 360 M190 290 L40 360"/>
      <path d="M190 262 L252 360 M252 262 L190 360"/>
      <rect x="70" y="236" width="96" height="70"/><rect x="40" y="290" width="150" height="70"/><rect x="166" y="262" width="86" height="98"/>
    </g>
    <path d="M166 237 L166 305 M252 263 L252 360" stroke="#7a6034" stroke-width="1.2" opacity="0.6"/>
  </g>
  <!-- rain -->
  <g stroke="#9a9ea6" stroke-width="1" opacity="0.4" stroke-linecap="round">
    <line x1="30" y1="20" x2="24" y2="42"/><line x1="110" y1="60" x2="104" y2="82"/><line x1="190" y1="30" x2="184" y2="52"/>
    <line x1="60" y1="140" x2="54" y2="162"/><line x1="160" y1="110" x2="154" y2="132"/><line x1="250" y1="40" x2="244" y2="62"/>
    <line x1="560" y1="20" x2="554" y2="42"/><line x1="620" y1="70" x2="614" y2="92"/><line x1="520" y1="30" x2="514" y2="52"/>
    <line x1="300" y1="300" x2="294" y2="322"/><line x1="600" y1="280" x2="594" y2="302"/><line x1="110" y1="200" x2="104" y2="222"/>
    <line x1="350" y1="20" x2="344" y2="42"/><line x1="460" y1="14" x2="454" y2="36"/>
  </g>
  <g stroke="#ffe7a8" stroke-width="1" opacity="0.6" stroke-linecap="round">
    <line x1="420" y1="120" x2="415" y2="138"/><line x1="450" y1="150" x2="445" y2="168"/><line x1="400" y1="190" x2="395" y2="208"/>
    <line x1="470" y1="210" x2="465" y2="228"/><line x1="430" y1="230" x2="425" y2="248"/><line x1="380" y1="140" x2="375" y2="158"/>
  </g>
</svg>
