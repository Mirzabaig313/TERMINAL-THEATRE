<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- Down the fire escape into the alley: three hatted goons wait at the lamp-lit mouth, long shadows on the wet cobbles. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="1" stop-color="#1a1714"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#1b1a1c"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#040405"/>
      <stop offset="1" stop-color="#232120"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2620"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7a8" stop-opacity="1"/>
      <stop offset="0.18" stop-color="#e8b84a" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#a77a24" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a77a24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c868" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f0c868" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadowFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#bfbcb6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bfbcb6" stop-opacity="0"/>
    </linearGradient>
    <!-- a man in a fedora and trench coat, feet at 0,0, 100 units tall -->
    <g id="man">
      <ellipse cx="0" cy="-88" rx="15" ry="2.6"/>
      <path d="M-8 -88 L-6.5 -97 Q-3 -99 0 -97.5 Q3 -99 6.5 -97 L8 -88 Z"/>
      <ellipse cx="0" cy="-82" rx="6" ry="7"/>
      <path d="M-13 -74 Q-6 -77.5 0 -77 Q6 -77.5 13 -74 L16 -42 L18 -14 L-18 -14 L-16 -42 Z"/>
      <path d="M-13 -74 L-19 -44 L-15 -41 L-10 -58 Z"/>
      <path d="M13 -74 L19 -44 L15 -41 L10 -58 Z"/>
      <rect x="-9" y="-15" width="6" height="14"/>
      <rect x="3" y="-15" width="6" height="14"/>
      <ellipse cx="-6" cy="-1.5" rx="5" ry="2"/>
      <ellipse cx="6" cy="-1.5" rx="5" ry="2"/>
    </g>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- sky over the alley mouth and the street beyond -->
  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- far buildings across the street -->
  <g fill="#0d0c0c">
    <rect x="240" y="60" width="70" height="200"/>
    <rect x="310" y="40" width="60" height="220"/>
    <rect x="370" y="76" width="50" height="184"/>
  </g>
  <g fill="#4a3c22" opacity="0.7">
    <rect x="256" y="90" width="8" height="10"/>
    <rect x="330" y="70" width="8" height="10"/>
    <rect x="350" y="120" width="8" height="10"/>
    <rect x="386" y="104" width="8" height="10"/>
  </g>
  <!-- street lamp and its halo -->
  <circle cx="354" cy="138" r="120" fill="url(#lampGlow)"/>
  <rect x="380" y="140" width="4" height="120" fill="#0a0908"/>
  <path d="M382 140 Q382 130 366 130 L358 130" fill="none" stroke="#0a0908" stroke-width="3"/>
  <path d="M346 132 L370 132 L364 140 L352 140 Z" fill="#0a0908"/>
  <ellipse cx="358" cy="141" rx="6" ry="2" fill="#fff4cf"/>
  <!-- the street surface beyond the mouth, glowing -->
  <polygon points="236,250 424,250 424,262 236,262" fill="url(#reflect)" opacity="0.6"/>

  <!-- ground: wet cobbles running toward us -->
  <polygon points="0,360 236,262 424,262 640,360" fill="url(#ground)"/>
  <!-- the lamp's reflection smeared down the wet ground -->
  <polygon points="340,262 372,262 420,360 300,360" fill="url(#reflect)" opacity="0.55"/>
  <g stroke="#f4d48a" stroke-width="1.5" opacity="0.35" stroke-linecap="round">
    <line x1="350" y1="276" x2="370" y2="276"/>
    <line x1="342" y1="292" x2="378" y2="292"/>
    <line x1="336" y1="312" x2="380" y2="312"/>
    <line x1="326" y1="336" x2="394" y2="336"/>
  </g>
  <!-- cobble seams -->
  <g stroke="#000" stroke-width="1" opacity="0.5">
    <line x1="160" y1="294" x2="490" y2="294"/>
    <line x1="100" y1="318" x2="545" y2="318"/>
    <line x1="40" y1="344" x2="600" y2="344"/>
    <line x1="300" y1="262" x2="250" y2="360"/>
    <line x1="360" y1="262" x2="420" y2="360"/>
  </g>

  <!-- the three goons at the mouth of the alley, backlit; Tony in the middle -->
  <g fill="#030303">
    <use href="#man" transform="translate(286,262) scale(0.82)"/>
    <use href="#man" transform="translate(326,264) scale(1.32,1.0)"/>
    <use href="#man" transform="translate(370,262) scale(0.8)"/>
  </g>
  <!-- amber rim on their hat brims and shoulders -->
  <g fill="none" stroke="#f0c868" stroke-width="1.3" opacity="0.8" stroke-linecap="round">
    <path d="M274 190 Q286 188 298 190"/>
    <path d="M308 176 Q326 173 344 176"/>
    <path d="M359 190 Q370 188 381 190"/>
    <path d="M343 188 L347 222"/>
    <path d="M296 202 L299 226"/>
    <path d="M380 202 L384 226"/>
  </g>
  <!-- their long shadows stretching back at us -->
  <g fill="url(#shadowFade)">
    <polygon points="280,262 292,262 230,360 180,360"/>
    <polygon points="316,264 336,264 330,360 268,360"/>
    <polygon points="364,262 376,262 452,360 408,360"/>
  </g>

  <!-- left wall: brick, a lit window, the iron fire escape -->
  <polygon points="0,0 236,70 236,262 0,360" fill="url(#wallL)"/>
  <g stroke="#000" stroke-width="1" opacity="0.6">
    <line x1="0" y1="40" x2="236" y2="88"/>
    <line x1="0" y1="90" x2="236" y2="110"/>
    <line x1="0" y1="140" x2="236" y2="132"/>
    <line x1="0" y1="190" x2="236" y2="154"/>
    <line x1="0" y1="240" x2="236" y2="176"/>
    <line x1="0" y1="290" x2="236" y2="198"/>
  </g>
  <!-- fire escape: landings in perspective, a ladder, rails -->
  <g fill="none" stroke="#2a2723" stroke-width="3">
    <path d="M30 60 L190 104 L214 96 L64 50"/>
    <path d="M30 150 L190 158 L214 146 L64 136"/>
    <path d="M40 60 L40 20 M100 77 L100 40 M160 94 L160 60 M190 104 L190 72"/>
    <path d="M40 150 L40 110 M100 153 L100 116 M160 156 L160 120 M190 158 L190 126"/>
    <path d="M40 22 L190 72 M40 112 L190 128"/>
    <path d="M120 82 L150 150"/>
    <path d="M132 82 L162 150"/>
  </g>
  <g stroke="#2a2723" stroke-width="2">
    <line x1="124" y1="92" x2="136" y2="92"/>
    <line x1="129" y1="104" x2="141" y2="104"/>
    <line x1="134" y1="116" x2="146" y2="116"/>
    <line x1="139" y1="128" x2="151" y2="128"/>
    <line x1="144" y1="140" x2="156" y2="140"/>
  </g>
  <!-- the drop ladder still swinging above the ground -->
  <g stroke="#2a2723" stroke-width="2.5">
    <line x1="172" y1="156" x2="176" y2="232"/>
    <line x1="186" y1="156" x2="190" y2="230"/>
    <line x1="173" y1="176" x2="187" y2="175"/>
    <line x1="174" y1="196" x2="188" y2="195"/>
    <line x1="175" y1="216" x2="189" y2="215"/>
  </g>
  <!-- right wall with garbage cans and a door -->
  <polygon points="640,0 424,70 424,262 640,360" fill="url(#wallR)"/>
  <g stroke="#000" stroke-width="1" opacity="0.6">
    <line x1="640" y1="60" x2="424" y2="96"/>
    <line x1="640" y1="130" x2="424" y2="126"/>
    <line x1="640" y1="200" x2="424" y2="156"/>
  </g>
  <polygon points="470,140 520,128 520,290 470,268" fill="#070707"/>
  <polygon points="470,140 474,140 474,269 470,268" fill="#3a3326"/>
  <g fill="#0c0c0c">
    <path d="M540 268 L590 274 L586 336 L544 330 Z"/>
    <ellipse cx="565" cy="270" rx="27" ry="6"/>
    <path d="M590 286 L640 294 L640 352 L594 344 Z"/>
  </g>
  <g fill="none" stroke="#6a5a3a" stroke-width="1" opacity="0.6">
    <path d="M540 268 Q565 262 590 274"/>
    <path d="M542 290 L588 296"/>
    <path d="M543 310 L587 316"/>
  </g>
  <!-- a cat on the can lid -->
  <path d="M556 266 Q556 254 562 252 L560 246 L565 250 L569 246 L569 254 Q574 258 572 266 Z" fill="#000"/>
  <path d="M572 264 Q582 262 580 252" fill="none" stroke="#000" stroke-width="2"/>

  <!-- steam rising from a grate in the foreground -->
  <polygon points="250,348 330,348 338,360 242,360" fill="#121212" stroke="#2a2a2a" stroke-width="1"/>
  <g filter="url(#blur)" fill="url(#steam)">
    <path d="M262 352 Q236 304 274 272 Q306 246 286 196 Q330 232 318 282 Q308 322 326 352 Z"/>
    <path d="M290 352 Q300 300 336 280 Q366 260 356 226 Q384 262 360 296 Q336 320 316 352 Z" opacity="0.7"/>
  </g>

  <!-- Malone, back to us, just dropped from the ladder: coat collar up, hat dripping -->
  <g fill="#020202">
    <ellipse cx="128" cy="210" rx="30" ry="5"/>
    <path d="M112 210 L115 186 Q128 180 141 186 L144 210 Z"/>
    <ellipse cx="128" cy="220" rx="13" ry="14"/>
    <path d="M100 236 Q110 226 128 224 Q146 226 156 236 L166 300 L172 360 L84 360 L90 300 Z"/>
    <path d="M96 240 L82 300 L94 304 L108 258 Z"/>
    <path d="M160 240 L176 296 L164 300 L150 258 Z"/>
  </g>
  <g fill="none" stroke="#f0c868" stroke-width="1.2" opacity="0.55">
    <path d="M104 208 Q128 202 152 208"/>
    <path d="M110 234 Q128 226 146 234"/>
  </g>

  <!-- rain, brighter inside the lamp's halo -->
  <g stroke="#8a8f9a" stroke-width="1" opacity="0.45" stroke-linecap="round">
    <line x1="20" y1="20" x2="14" y2="44"/><line x1="70" y1="180" x2="64" y2="204"/>
    <line x1="210" y1="40" x2="204" y2="64"/><line x1="140" y1="300" x2="134" y2="324"/>
    <line x1="470" y1="30" x2="464" y2="54"/><line x1="520" y1="100" x2="514" y2="124"/>
    <line x1="600" y1="50" x2="594" y2="74"/><line x1="610" y1="200" x2="604" y2="224"/>
    <line x1="440" y1="300" x2="434" y2="324"/><line x1="200" y1="210" x2="194" y2="234"/>
    <line x1="560" y1="180" x2="554" y2="204"/><line x1="40" y1="250" x2="34" y2="274"/>
  </g>
  <g stroke="#ffe7a8" stroke-width="1" opacity="0.7" stroke-linecap="round">
    <line x1="300" y1="70" x2="295" y2="90"/><line x1="330" y1="96" x2="325" y2="116"/>
    <line x1="400" y1="80" x2="395" y2="100"/><line x1="290" y1="140" x2="285" y2="160"/>
    <line x1="420" y1="130" x2="415" y2="150"/><line x1="360" y1="60" x2="355" y2="80"/>
    <line x1="270" y1="110" x2="265" y2="130"/><line x1="384" y1="170" x2="379" y2="190"/>
    <line x1="342" y1="200" x2="337" y2="220"/><line x1="310" y1="170" x2="305" y2="190"/>
  </g>
</svg>
