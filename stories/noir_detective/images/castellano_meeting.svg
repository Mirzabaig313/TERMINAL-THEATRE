<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- The Velvet Room: Castellano in his private booth under a single lamp, cigar lit, chess set at his elbow, two gunmen behind him. -->
  <defs>
    <linearGradient id="folds" x1="0" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#0b0203"/>
      <stop offset="0.45" stop-color="#3a0b10"/>
      <stop offset="0.6" stop-color="#2a070b"/>
      <stop offset="1" stop-color="#0b0203"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.92"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d98a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f6d98a" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="tableTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbb47a"/>
      <stop offset="1" stop-color="#5a4a28"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2620"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="booth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1416"/>
      <stop offset="1" stop-color="#070506"/>
    </linearGradient>
    <linearGradient id="faceLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.4" stop-color="#c8bc9e" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#c8bc9e" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#6e6450" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="candle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a4a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b0141c" stop-opacity="0"/>
    </radialGradient>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <!-- standing gunman, feet at 0,0, 100 units tall -->
    <g id="man">
      <ellipse cx="0" cy="-88" rx="15" ry="2.6"/>
      <path d="M-8 -88 L-6.5 -97 Q-3 -99 0 -97.5 Q3 -99 6.5 -97 L8 -88 Z"/>
      <ellipse cx="0" cy="-82" rx="6" ry="7"/>
      <path d="M-14 -74 Q-6 -77.5 0 -77 Q6 -77.5 14 -74 L17 -42 L18 -14 L-18 -14 L-17 -42 Z"/>
      <path d="M-14 -74 L-20 -44 L-15 -41 L-10 -58 Z"/>
      <path d="M14 -74 L20 -44 L15 -41 L10 -58 Z"/>
    </g>
  </defs>

  <!-- crimson drapes behind -->
  <rect width="640" height="360" fill="url(#folds)"/>
  <rect width="640" height="360" fill="#000" opacity="0.25"/>

  <!-- the two gunmen flanking the booth -->
  <g fill="#030203">
    <use href="#man" transform="translate(170,250) scale(1.9)"/>
    <use href="#man" transform="translate(472,250) scale(1.9)"/>
  </g>
  <g fill="none" stroke="#c9a85a" stroke-width="1.2" opacity="0.5">
    <path d="M186 84 Q198 86 198 88"/>
    <path d="M454 84 Q444 86 442 88"/>
    <path d="M196 110 L203 166"/>
    <path d="M446 110 L439 166"/>
  </g>

  <!-- the lamp and its cone of light -->
  <line x1="320" y1="0" x2="320" y2="34" stroke="#0a0a0a" stroke-width="2"/>
  <polygon points="300,46 340,46 470,300 170,300" fill="url(#cone)"/>
  <path d="M296 48 Q320 24 344 48 Z" fill="#0d0b08"/>
  <ellipse cx="320" cy="48" rx="20" ry="3" fill="#fff0c0"/>

  <!-- the leather booth, tufted, curving around him -->
  <path d="M150 270 Q150 120 320 116 Q490 120 490 270 Z" fill="url(#booth)"/>
  <path d="M170 270 Q172 140 320 136 Q468 140 470 270" fill="none" stroke="#2c2024" stroke-width="2"/>
  <g fill="#000" opacity="0.6">
    <circle cx="230" cy="160" r="2"/><circle cx="275" cy="146" r="2"/><circle cx="320" cy="142" r="2"/>
    <circle cx="365" cy="146" r="2"/><circle cx="410" cy="160" r="2"/><circle cx="204" cy="200" r="2"/>
    <circle cx="436" cy="200" r="2"/><circle cx="250" cy="190" r="2"/><circle cx="390" cy="190" r="2"/>
  </g>

  <!-- Vincent Castellano: broad shoulders, grey temples, a scar, a cigar -->
  <g>
    <path d="M250 262 Q252 206 288 194 Q320 186 352 194 Q388 206 390 262 Z" fill="#0b0a0b"/>
    <!-- shirt and tie -->
    <path d="M308 194 L320 230 L332 194 Z" fill="#9a9488"/>
    <path d="M317 200 L323 200 L325 226 L320 232 L315 226 Z" fill="#7a1018"/>
    <!-- lapels -->
    <path d="M300 194 L320 238 L310 196 Z M340 194 L320 238 L330 196 Z" fill="#050505"/>
    <!-- neck and head -->
    <rect x="309" y="174" width="22" height="22" fill="#0d0b0b"/>
    <ellipse cx="320" cy="160" rx="21" ry="25" fill="#0d0b0b"/>
    <ellipse cx="320" cy="160" rx="21" ry="25" fill="url(#faceLight)"/>
    <!-- slicked hair with grey at the temples -->
    <path d="M298 162 Q295 133 320 132 Q345 133 342 162 Q340 148 331 143 Q320 140 309 143 Q300 148 298 162 Z" fill="#050505"/>
    <path d="M337 147 Q342 152 342 162 Q340 156 335 151 Z" fill="#a8a49c"/>
    <path d="M303 147 Q298 152 298 162 Q300 156 305 151 Z" fill="#4a4640"/>
    <!-- ear catching the light -->
    <path d="M340 158 Q346 160 344 168 Q341 170 339 168 Z" fill="#9c8e70"/>
    <!-- brow, scar, eye shadows -->
    <path d="M325 154 L337 152" stroke="#2a2016" stroke-width="2.5"/>
    <path d="M330 147 L334 159" stroke="#f0e0b0" stroke-width="1" opacity="0.8"/>
    <ellipse cx="331" cy="158" rx="4" ry="2" fill="#2a2016"/>
    <path d="M326 176 L336 174" stroke="#3a2c1c" stroke-width="1.5"/>
    <!-- cigar with a hot tip -->
    <path d="M334 175 L362 182 L361 186 L333 179 Z" fill="#2a1a10"/>
    <circle cx="362" cy="184" r="2.6" fill="#ff7a3a"/>
    <!-- arms resting on the table -->
    <path d="M254 240 Q260 262 300 266 L300 276 Q252 276 244 254 Z" fill="#0b0a0b"/>
    <path d="M386 240 Q380 262 340 266 L340 276 Q388 276 396 254 Z" fill="#0b0a0b"/>
    <ellipse cx="300" cy="272" rx="10" ry="6" fill="#9c8a62"/>
    <ellipse cx="340" cy="272" rx="10" ry="6" fill="#8a7a56"/>
    <rect x="296" y="268" width="5" height="4" fill="#d4af37"/>
  </g>

  <!-- the table, its lit top, cloth falling into darkness -->
  <path d="M120 280 Q120 360 120 360 L520 360 L520 280 Z" fill="url(#cloth)"/>
  <ellipse cx="320" cy="280" rx="200" ry="24" fill="url(#tableTop)"/>
  <!-- two glasses of amber -->
  <g>
    <path d="M226 252 L246 252 L243 276 L229 276 Z" fill="#e8d6a0" opacity="0.5"/>
    <path d="M229 264 L243 264 L243 276 L229 276 Z" fill="#c08a2a"/>
    <path d="M394 252 L414 252 L411 276 L397 276 Z" fill="#e8d6a0" opacity="0.5"/>
    <path d="M397 266 L411 266 L411 276 L397 276 Z" fill="#c08a2a"/>
  </g>
  <!-- candle in red glass -->
  <circle cx="320" cy="270" r="26" fill="url(#candle)"/>
  <path d="M312 262 L328 262 L326 282 L314 282 Z" fill="#9a1018"/>
  <path d="M320 254 Q324 259 320 263 Q316 259 320 254 Z" fill="#ffd27a"/>
  <!-- chess set at his elbow, the white pieces winning -->
  <g>
    <polygon points="430,282 492,282 504,300 418,300" fill="#1b1814"/>
    <g fill="#d8cfb8">
      <rect x="444" y="268" width="5" height="12" rx="1.5"/><circle cx="446.5" cy="266" r="3"/>
      <rect x="458" y="272" width="4" height="8"/><circle cx="460" cy="270" r="2.5"/>
      <path d="M472 280 L472 268 L478 264 L480 270 L476 272 L478 280 Z"/>
      <rect x="486" y="274" width="4" height="6"/><circle cx="488" cy="272" r="2"/>
    </g>
    <g fill="#050505">
      <rect x="436" y="286" width="4" height="10"/><circle cx="438" cy="284" r="2.5"/>
      <path d="M494 296 L494 288 L498 286 L500 296 Z"/>
    </g>
    <!-- a toppled black king -->
    <path d="M448 296 L466 292 L467 296 L449 299 Z" fill="#050505"/>
  </g>

  <!-- cigar smoke hanging in flat sheets -->
  <g filter="url(#haze)" fill="#c8c2b4" opacity="0.22">
    <path d="M360 176 Q380 150 360 120 Q340 92 380 70 Q420 60 450 80 Q410 84 400 110 Q392 140 370 178 Z"/>
    <ellipse cx="320" cy="96" rx="160" ry="10"/>
    <ellipse cx="260" cy="60" rx="120" ry="8"/>
  </g>

  <!-- beaded curtain at the left edge, catching the light -->
  <g fill="#c9a85a" opacity="0.45">
    <circle cx="14" cy="20" r="1.5"/><circle cx="14" cy="40" r="1.5"/><circle cx="14" cy="60" r="1.5"/><circle cx="14" cy="80" r="1.5"/><circle cx="14" cy="100" r="1.5"/><circle cx="14" cy="120" r="1.5"/><circle cx="14" cy="140" r="1.5"/><circle cx="14" cy="160" r="1.5"/><circle cx="14" cy="180" r="1.5"/><circle cx="14" cy="200" r="1.5"/><circle cx="14" cy="220" r="1.5"/><circle cx="14" cy="240" r="1.5"/>
    <circle cx="34" cy="10" r="1.5"/><circle cx="34" cy="30" r="1.5"/><circle cx="34" cy="50" r="1.5"/><circle cx="34" cy="70" r="1.5"/><circle cx="34" cy="90" r="1.5"/><circle cx="34" cy="110" r="1.5"/><circle cx="34" cy="130" r="1.5"/><circle cx="34" cy="150" r="1.5"/><circle cx="34" cy="170" r="1.5"/><circle cx="34" cy="190" r="1.5"/><circle cx="34" cy="210" r="1.5"/>
    <circle cx="54" cy="20" r="1.5"/><circle cx="54" cy="40" r="1.5"/><circle cx="54" cy="60" r="1.5"/><circle cx="54" cy="80" r="1.5"/><circle cx="54" cy="100" r="1.5"/><circle cx="54" cy="120" r="1.5"/><circle cx="54" cy="140" r="1.5"/><circle cx="54" cy="160" r="1.5"/><circle cx="54" cy="180" r="1.5"/>
  </g>
  <g stroke="#5a4a2a" stroke-width="0.6" opacity="0.6">
    <line x1="14" y1="0" x2="14" y2="250"/><line x1="34" y1="0" x2="34" y2="220"/><line x1="54" y1="0" x2="54" y2="190"/>
  </g>

  <rect width="640" height="360" fill="url(#vignette)"/>

  <!-- Malone, seen from behind his shoulder: hat, collar, the gun still on his hip -->
  <g fill="#010101">
    <path d="M520 360 L530 250 Q560 228 600 226 Q632 228 640 236 L640 360 Z"/>
    <ellipse cx="588" cy="196" rx="54" ry="8"/>
    <path d="M562 196 L568 160 Q588 152 608 160 L614 196 Z"/>
    <path d="M566 200 Q570 232 588 234 Q606 232 610 200 Z"/>
  </g>
  <path d="M534 196 Q560 188 588 188" fill="none" stroke="#c9a85a" stroke-width="1.2" opacity="0.6"/>
  <path d="M530 252 Q556 230 590 228" fill="none" stroke="#c9a85a" stroke-width="1.2" opacity="0.5"/>
</svg>
