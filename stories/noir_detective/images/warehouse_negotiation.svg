<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- Inside Warehouse 47: walked at gunpoint down a canyon of Army crates to the trestle table where Castellano, Morrison and Blackwood sit under one swinging lamp. -->
  <defs>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030303"/>
      <stop offset="1" stop-color="#0d0c0b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a261e"/>
      <stop offset="0.4" stop-color="#14120f"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#060606"/>
      <stop offset="1" stop-color="#2c2820"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#2a261e"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d98a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f6d98a" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8c470" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8c470" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c8"/>
      <stop offset="1" stop-color="#fff3c8" stop-opacity="0"/>
    </radialGradient>
    <!-- a stencilled Army star in a circle -->
    <g id="star">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#8a8270" stroke-width="2"/>
      <path d="M0 -8 L2.2 -2.5 L8 -2.5 L3.4 1 L5 7 L0 3.4 L-5 7 L-3.4 1 L-8 -2.5 L-2.2 -2.5 Z" fill="#8a8270"/>
    </g>
  </defs>

  <rect width="640" height="360" fill="url(#dark)"/>
  <!-- roof trusses lost in the dark -->
  <g stroke="#141310" stroke-width="3">
    <line x1="0" y1="30" x2="640" y2="30"/><line x1="100" y1="30" x2="200" y2="0"/><line x1="540" y1="30" x2="440" y2="0"/>
    <line x1="220" y1="30" x2="320" y2="0"/><line x1="420" y1="30" x2="320" y2="0"/>
  </g>

  <!-- the floor running down the canyon -->
  <polygon points="0,360 250,220 390,220 640,360" fill="url(#floor)"/>
  <ellipse cx="320" cy="236" rx="150" ry="26" fill="url(#pool)"/>

  <!-- left wall of stacked crates, in perspective -->
  <polygon points="0,0 250,92 250,222 0,360" fill="url(#wallL)"/>
  <g stroke="#050505" stroke-width="2">
    <line x1="0" y1="120" x2="250" y2="136"/><line x1="0" y1="240" x2="250" y2="180"/>
    <line x1="90" y1="33" x2="90" y2="310"/><line x1="160" y1="59" x2="160" y2="271"/><line x1="210" y1="77" x2="210" y2="244"/>
  </g>
  <g transform="translate(45 190) scale(1.6 1.9) skewY(-14)"><use href="#star"/></g>
  <g transform="translate(125 132) scale(1.1 1.3) skewY(-14)"><use href="#star"/></g>
  <g transform="translate(186 200) scale(0.8 0.95) skewY(-14)"><use href="#star"/></g>
  <!-- stencil bars where letters would be -->
  <g fill="#6e685a" opacity="0.6">
    <polygon points="20,80 70,90 70,96 20,86"/><polygon points="104,92 146,102 146,107 104,97"/>
  </g>

  <!-- right wall of crates -->
  <polygon points="640,0 390,92 390,222 640,360" fill="url(#wallR)"/>
  <g stroke="#050505" stroke-width="2">
    <line x1="640" y1="110" x2="390" y2="134"/><line x1="640" y1="250" x2="390" y2="182"/>
    <line x1="550" y1="33" x2="550" y2="310"/><line x1="480" y1="59" x2="480" y2="271"/><line x1="430" y1="77" x2="430" y2="244"/>
  </g>
  <g transform="translate(595 196) scale(1.6 1.9) skewY(14)"><use href="#star"/></g>
  <g transform="translate(515 140) scale(1.1 1.3) skewY(14)"><use href="#star"/></g>
  <g fill="#6e685a" opacity="0.6">
    <polygon points="570,90 620,80 620,86 570,96"/><polygon points="494,102 536,92 536,97 494,107"/>
  </g>
  <!-- edge light on the crate corners nearest the lamp -->
  <path d="M250 92 L250 222 M390 92 L390 222" stroke="#c9a456" stroke-width="2" opacity="0.6"/>

  <!-- back wall at the end of the canyon -->
  <rect x="250" y="92" width="140" height="130" fill="#0a0908"/>

  <!-- the lamp, swung off true on its chain, and its cone -->
  <line x1="306" y1="0" x2="324" y2="104" stroke="#2a2824" stroke-width="2"/>
  <polygon points="314,112 336,108 404,232 250,236" fill="url(#cone)"/>
  <path d="M308 114 Q322 96 340 108 Z" fill="#0d0c0a" transform="rotate(-10 324 108)"/>
  <circle cx="325" cy="112" r="16" fill="url(#bulb)"/>

  <!-- the three men at the table -->
  <!-- Blackwood, standing, greatcoat, straight as a rifle -->
  <g fill="#050505">
    <path d="M296 222 L298 154 Q304 142 320 141 Q336 142 342 154 L344 222 Z"/>
    <path d="M310 142 L314 132 L320 140 L326 132 L330 142 Z"/>
    <ellipse cx="320" cy="128" rx="9" ry="11"/>
    <path d="M308 150 L300 148 L302 158 Z M332 150 L340 148 L338 158 Z"/>
  </g>
  <path d="M312 120 Q320 114 328 120" stroke="#b0aca4" stroke-width="3" fill="none"/>
  <path d="M328 124 Q330 132 326 138 M338 152 L340 220" stroke="#e8c470" stroke-width="1.2" fill="none" opacity="0.8"/>
  <!-- Castellano, seated left, camel coat -->
  <g>
    <path d="M262 218 Q262 186 282 180 Q298 184 300 218 Z" fill="#3a3224"/>
    <ellipse cx="281" cy="168" rx="8.5" ry="10" fill="#0a0908"/>
    <path d="M272.5 168 Q272 157 281 157 Q290 157 289.5 168 Q288 162 281 161 Q274 162 272.5 168 Z" fill="#8a867e"/>
    <path d="M289 166 Q291 172 287 177" stroke="#e8c470" stroke-width="1.2" fill="none"/>
  </g>
  <!-- Morrison, seated right, bald head shining with sweat -->
  <g>
    <path d="M342 218 Q342 186 362 180 Q382 184 384 218 Z" fill="#0d0c0b"/>
    <ellipse cx="362" cy="168" rx="10" ry="11" fill="#5e5444"/>
    <ellipse cx="359" cy="162" rx="4" ry="2.4" fill="#f2e2b0" opacity="0.9"/>
    <path d="M358 184 L366 184 L364 188 L366 204 L362 208 L358 204 L360 188 Z" fill="#8a1018"/>
  </g>
  <!-- the trestle table: bottle, three glasses, no fourth chair -->
  <rect x="250" y="214" width="140" height="6" fill="#8a7448"/>
  <path d="M258 220 L264 244 M382 220 L376 244 M262 232 L378 232" stroke="#0a0908" stroke-width="3"/>
  <rect x="314" y="198" width="8" height="16" rx="2" fill="#2a1e0c"/>
  <rect x="316" y="192" width="4" height="7" fill="#2a1e0c"/>
  <g fill="#d8c48a" opacity="0.8">
    <rect x="292" y="207" width="5" height="7"/><rect x="334" y="207" width="5" height="7"/><rect x="350" y="207" width="5" height="7"/>
  </g>

  <!-- Malone, walked in at gunpoint, hands half raised -->
  <g transform="translate(-26 0)">
    <g fill="#020202">
      <path d="M210 196 Q222 186 236 186 Q252 188 260 198 L264 262 L254 300 L244 300 L238 268 L230 300 L218 300 L214 262 Z"/>
      <ellipse cx="236" cy="174" rx="11" ry="13"/>
      <ellipse cx="236" cy="160" rx="24" ry="4.5"/>
      <path d="M224 160 L227 142 Q236 137 245 142 L248 160 Z"/>
      <path d="M214 198 L196 206 L190 178 L198 176 L202 196 L222 192 Z"/>
      <path d="M258 198 L276 206 L282 178 L274 176 L270 196 L250 192 Z"/>
    </g>
    <g fill="none" stroke="#e8c470" stroke-width="1.2" opacity="0.75">
      <path d="M246 160 Q256 160 259 162"/><path d="M246 168 Q250 176 244 184"/><path d="M260 200 L264 260"/>
    </g>
  </g>

  <!-- the guard behind him, tommy gun in his kidney -->
  <g fill="#000">
    <path d="M60 230 Q78 210 108 208 Q140 210 152 232 L160 360 L50 360 Z"/>
    <ellipse cx="106" cy="190" rx="18" ry="21"/>
    <ellipse cx="106" cy="166" rx="40" ry="7"/>
    <path d="M88 166 L92 144 Q106 138 120 144 L124 166 Z"/>
    <path d="M140 248 L206 236 L208 244 L150 260 Z"/>
    <rect x="164" y="244" width="10" height="20" rx="4"/>
    <path d="M200 236 L218 234 L218 238 L204 240 Z"/>
  </g>
  <path d="M121 144 L124 166 M150 234 L158 340 M150 248 L206 237" stroke="#c9a456" stroke-width="1.3" fill="none" opacity="0.55"/>
</svg>
