text = """
You pack a bag. One suitcase, one gun, and all the cash you can carry from the coffee can behind the filing cabinet. You leave the lights on and the neon buzzing and the dame on the carpet, and you don't look at her on your way out. That's the part you'll remember.

The bus station at 4 AM is full of people running from something. Sailors. Runaways. A woman with a black eye and two kids asleep on her lap. You're just one more, hat pulled low, collar turned up, ticket to anywhere.

Mexico first. Then further south. The dame's death goes unsolved. The conspiracy continues. Blackwood, Castellano, Morrison - they all win. But you're alive. Sometimes that's the only victory that matters.

