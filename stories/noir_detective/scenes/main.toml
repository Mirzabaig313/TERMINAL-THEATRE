║              █ │ █     █ │ █   █ │ █      █ │ █             ║
║              █ │ █  ◈  █ │ █ ◈ █ │ █  ◈  █ │ █             ║
║         ╔════╬═╬═════╬═╬═╬═╬════╬═╬═════════╗               ║
║         ║ ≈≈ │ │ ≈≈≈ │ │ │ │ ≈≈ │ │ streets ║ (wet)        ║
║         ║≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈≈║               ║
║         ║  neon signs flicker  • rain falls  ║               ║
║         ║       people hurry past              ║               ║
║         ╚════════════════════════════════════╝               ║
║                                                                 ║
║  "The city breathes tonight. And it stinks of crime."           ║
║                                                                 ║
╚═══════════════════════════════════════════════════════════════════╝
        """
dialogue = [
  { who = "tony_the_fist", line = "Going somewhere, Malone?", mood = "smirk" },
  { who = "jack_malone", line = "Just out for a smoke, Tony.", mood = "smirk" },
  { who = "tony", line = "Mr. Castellano wants to see you. Says you got something belongs to him.", mood = "angry" },
]
[[run_away.choices]]
text = "Go with them peacefully - maybe you can talk to Castellano"
goto = "castellano_meeting"
[[run_away.choices]]
text = "Fight your way out - three against one, you've had worse odds"
goto = "alley_fight"
[[run_away.choices]]
text = "Tell them about the dame - claim you were set up"
goto = "blame_setup"

[search_body_after_gun]
mood = "danger"
text = """
The photograph tells you everything: Vincent Castellano, Police Chief Morrison, and Warehouse 47. There's also a ticket stub from the Ritz Theater.

But now you know you're being framed. Someone wanted this woman dead and wanted you holding the bag."""
dialogue = [
  { who = "jack_malone", line = "This is bigger than I thought. The cops, the mob... all connected.", mood = "shocked" },
]
[[search_body_after_gun.choices]]
text = "Head to Warehouse 47 - end this tonight"
goto = "warehouse"
[[search_body_after_gun.choices]]
text = "Find Eddie first - you need backup"
goto = "call_eddie"

[check_office]
mood = "alert"
text = """
You move through your office like a ghost, checking corners, shadows. Behind the filing cabinet, you find it: a service panel left ajar.

Someone was in the walls. They could have shot her from there, tossed your gun in your hand while you were... what? Drugged?

On the floor, a business card: 'The Velvet Room - Where Secrets Sleep.'"""
dialogue = [
  { who = "jack_malone", line = "The Velvet Room. High-class nightclub. Castellano territory." },
  { who = "jack_malone", line = "Why leave a calling card unless they want me to follow?", mood = "smirk" },
]
[[check_office.choices]]
text = "Go to the Velvet Room - walk into the trap with eyes open"
goto = "velvet_room"
[[check_office.choices]]
text = "Search the dame for more clues first"
goto = "search_body_after_gun"
[[check_office.choices]]
text = "Get out of town - this is above your pay grade"
goto = "leave_town"

[call_eddie]
mood = "calm"
text = """
You dial Eddie's number. Three rings.
'Yeah?' His voice is rough with sleep.
'Eddie, it's Jack. I need help. There's a body in my office and—' 'Say no more. I'll be there in ten.'

Eddie shows up in eight. He surveys the scene with cop's eyes, even though he turned in his badge six months ago."""
set_flags = ["called_eddie"]
dialogue = [
  { who = "eddie", line = "Jesus, Jack. You really stepped in it this time.", mood = "shocked" },
  { who = "jack_malone", line = "I didn't do it, Eddie.", mood = "pained" },
  { who = "eddie", line = "I know. You're a lot of things, but you ain't a killer. Not like this, anyway. We need to find who did.", mood = "smirk" },
  { who = "eddie", line = "I've been hearing things. Warehouse 47. Big meeting tonight. Castellano, Morrison... maybe more. This dame was probably insurance - proof for whoever wanted out." },
]
[[call_eddie.choices]]
text = "Hit Warehouse 47 with Eddie - time to crash the party"
goto = "warehouse_with_eddie"
[[call_eddie.choices]]
text = "Have Eddie watch your back while you visit the Velvet Room"
goto = "velvet_room_with_eddie"

[warehouse]
mood = "mystery"
text = """
Warehouse 47 sits on the docks like a rotting tooth.
Two guards out front, cigarettes glowing in the rain.
Through a grimy window, you see them: Castellano, Morrison, and a third man you don't recognize. Military bearing. Cold eyes."""
art = """

╔═══════════════════════════════════════════════════════════════════╗
