  { who = "dying_woman", line = "Idiot... I was here... to help you... FBI... investigating... Project Nightfall..." },
  { who = "jack_malone", line = "Jesus... I didn't know...", mood = "shocked" },
  { who = "dying_woman", line = "They'll come... for you... run..." },
]
[[theater_fight.choices]]
text = "Turn yourself in - it was self defense"
goto = "turn_self_in"
[[theater_fight.choices]]
text = "Run - you're in too deep now"
goto = "run_from_fbi"

[theater_reveal]
mood = "mystery"
text = """
The figure steps into the dim light. FBI Special Agent Sarah Chen. She lowers her weapon.

'Mr. Malone. I've been tracking Project Nightfall for two years. The woman in your office was one of my informants.'"""
dialogue = [
  { who = "chen", line = "They killed her to frame you. Two birds, one stone. You've been making people nervous, asking the wrong questions." },
  { who = "jack_malone", line = "So what happens now?" },
  { who = "chen", line = "Now we have a choice. You can come in, become a witness, and hope my protection holds. Or we can end this tonight. Warehouse 47. All the players. One final move." },
]
[[theater_reveal.choices]]
text = "Trust the FBI - let them handle it"
goto = "fbi_cooperation"
[[theater_reveal.choices]]
text = "Partner with Chen - end it tonight at the warehouse"
goto = "chen_partnership"

[rodriguez_plan]
mood = "alert"
text = """
Rodriguez works the phones. Within an hour, he's assembled a team of cops he trusts - not many, but enough. You suit up: tactical gear, body armor, the works.

'This is it, Jack. We go in hard, we go in clean. Everyone comes out in cuffs or body bags. And when it's done, you're clear.'"""
dialogue = [
  { who = "jack_malone", line = "Let's finish this.", mood = "angry" },
]
[[rodriguez_plan.choices]]
text = "Raid Warehouse 47 - the right way"
goto = "rodriguez_raid"

[solo_mission]
mood = "danger"
text = """
You take the evidence and walk out of Rodriguez's office. He doesn't stop you. You both know this is personal now.

Warehouse 47 looms ahead. You check your gun one more time. Six bullets. Hopefully enough."""
dialogue = [
  { who = "jack_malone", line = "One man against the world. Just how I like it.", mood = "smirk" },
]
[[solo_mission.choices]]
text = "Attack the warehouse - no backup, no plan, just justice"
goto = "solo_warehouse_attack"

[castellano_reveal]
text = """
Castellano leans back, lighting a cigar.

'I tell you because you're already dead, Jack. Question is whether you die knowing the truth or die confused. Me? I'm generous that way.'"""
dialogue = [
  { who = "castellano", line = "That dame worked for a man named Blackwood. General Marcus Blackwood. He's running guns, weapons, military hardware. I'm just the distributor.", mood = "smirk" },
  { who = "castellano", line = "She got cold feet. Wanted out. Wanted to talk. So Blackwood ordered her dead. And you framed. Two problems, one solution.", mood = "smirk" },
  { who = "jack_malone", line = "Why tell me this?" },
  { who = "castellano", line = "Because I'm tired of being Blackwood's errand boy. You want revenge? Help me take him down. Then we both walk away clean.", mood = "angry" },
]
[[castellano_reveal.choices]]
text = "Accept the deal - enemy of my enemy"
goto = "castellano_alliance"
[[castellano_reveal.choices]]
text = "Refuse - 'I don't work with killers'"
goto = "refuse_castellano"

[castellano_shootout]
mood = "danger"
text = """
Your hand moves for your gun. Castellano's guards are faster. Three guns bark. You feel the impacts like hammers.

The world tilts. You hit the floor. Castellano stands over you."""
dialogue = [
  { who = "castellano", line = "Shame, Malone. We could've helped each other. Instead, you die stupid.", mood = "smirk", fx = "shake" },
]
[[castellano_shootout.choices]]
text = "..."
goto = "ending_killed_by_castellano"

[warehouse_injured]
mood = "danger"
text = """
You stagger to Warehouse 47, leaving a trail of blood.
The guards see you coming. They raise their weapons.

You raise your hands. 'I need to see Castellano. Tell him I know who really killed the dame. Tell him it wasn't me.'"""
dialogue = [
  { who = "guard", line = "Boss! Malone's here. Says he's got information." },
  { who = "castellano_distant", line = "Bring him in. Let's hear what the dead man walking has to say.", mood = "smirk" },
]
[[warehouse_injured.choices]]
text = "Enter the warehouse - last gambit"
goto = "warehouse_wounded_entry"

[doctor_visit]
mood = "calm"
text = """
Doc Stevens doesn't ask questions anymore. He patches you up, gives you painkillers, and points you toward the door.

'Whatever you're into, Jack, finish it soon. Next time I might not be able to put you back together.'"""
dialogue = [
  { who = "jack_malone", line = "Thanks, Doc. Put it on my tab.", mood = "smirk" },
  { who = "doc_stevens", line = "Your tab could buy a new clinic. Just... be careful." },
]
[[doctor_visit.choices]]
text = "Head to Warehouse 47 - time to end this"
goto = "warehouse"
[[doctor_visit.choices]]
text = "Investigate the Velvet Room instead"
goto = "velvet_room"

[escape_run]
mood = "danger"
text = """
You bolt. Tony shouts, but you're already around the corner. The rain works in your favor - sound dampened, visibility low.

You know these streets. You disappear into the night like smoke. But now Castellano knows you're onto something. And he'll be looking."""
dialogue = [
  { who = "jack_malone", line = "Bought myself some time. Now I need to use it.", mood = "smirk" },
]
[[escape_run.choices]]
text = "Go to ground at Eddie's place - need backup"
goto = "call_eddie"
[[escape_run.choices]]
text = "Hit Warehouse 47 before they expect it"
goto = "warehouse"

[warehouse_shootout_eddie]
mood = "danger"
text = """
You drop through the skylight, gun blazing. Eddie kicks in the back door. The warehouse erupts in chaos.

Morrison goes down first. Castellano's men return fire.
Blackwood pulls a weapon you've never seen before - military prototype. The beam cuts through metal like paper."""
dialogue = [
  { who = "eddie", line = "Jack! Get down!", mood = "afraid", fx = "shake" },
]
[[warehouse_shootout_eddie.choices]]
text = "Take cover and return fire"
goto = "shootout_tactical"
[[warehouse_shootout_eddie.choices]]
text = "Charge Blackwood - end this fast"
goto = "charge_blackwood"

[warehouse_evidence]
mood = "alert"
text = """
Eddie has it all on tape. Video, audio, everything.
You slip out the way you came in.

Two days later, the evidence hits every news station simultaneously. The arrests start within hours. Morrison, Castellano, Blackwood. The whole rotten system comes crashing down."""
dialogue = [
  { who = "news_anchor", line = "In the biggest corruption scandal in city history...", fx = "glitch" },
  { who = "rodriguez", line = "Good work, Jack. You're cleared of all charges.", mood = "happy" },
  { who = "jack_malone", line = "Just doing my job, Captain.", mood = "smirk" },
]
[[warehouse_evidence.choices]]
text = "The End"
goto = "ending_evidence_victory"

[morrison_confrontation]
mood = "danger"
text = """
You step out of the office as Morrison rounds the corner. His hand goes for his gun. Yours is already out."""
dialogue = [
  { who = "jack_malone", line = "Don't. I've got enough evidence here to bury you ten times over.", mood = "angry" },
  { who = "morrison", line = "You're a dead man, Malone. You just don't know it yet.", mood = "angry" },
  { who = "jack_malone", line = "Maybe. But I'm taking you with me.", mood = "smirk" },
]
[[morrison_confrontation.choices]]
text = "Arrest Morrison at gunpoint"
goto = "arrest_morrison"
[[morrison_confrontation.choices]]
text = "Shoot first, ask questions never"
goto = "shoot_morrison"

[escape_with_evidence]
mood = "calm"
text = """
You and Eddie vanish into the night with the ledger.
The evidence is damning. Every dirty cop, every payoff, every crime.

You deliver it anonymously to three journalists you trust. Within a week, the city is in chaos. In a month, it's clean. Well, cleaner."""
dialogue = [
  { who = "eddie", line = "We did good, Jack.", mood = "happy" },
  { who = "jack_malone", line = "We did what we had to. That's all.", mood = "sad" },
]
[[escape_with_evidence.choices]]
text = "The End"
goto = "ending_silent_victory"

[warehouse_skylight_attack]
text = """
Glass shatters. You drop into hell.
Bullets fly. You take down two guards before you hit the ground.

Castellano draws. Morrison runs. Blackwood stands his ground, a strange weapon in his hands."""
dialogue = [
  { who = "blackwood", line = "Impressive, Mr. Malone. But foolish.", mood = "smirk" },
]
[[warehouse_skylight_attack.choices]]
text = "Dive for cover"
goto = "dive_cover"
[[warehouse_skylight_attack.choices]]
text = "Take the shot at Blackwood"
goto = "shoot_blackwood"

[warehouse_retreat]
mood = "alert"
text = """
You back away slowly. Sometimes living to fight another day is the only win.

You take the information to the FBI. Special Agent Chen takes your statement. Three weeks later, coordinated raids bring down the entire operation. You testify. They go to prison. You go free."""
dialogue = [
  { who = "chen", line = "You made the smart choice, Malone. Not many do." },
  { who = "jack_malone", line = "I've been called a lot of things. Smart isn't usually one of them.", mood = "smirk" },
]
[[warehouse_retreat.choices]]
text = "The End"
goto = "ending_smart_play"

[warehouse_negotiation]
mood = "alert"
text = """
They let you in. Castellano, Morrison, and Blackwood sit at a table like business partners. Which, you suppose, they are."""
dialogue = [
  { who = "castellano", line = "Jack Malone. You've got balls, I'll give you that.", mood = "smirk" },
  { who = "jack_malone", line = "I've got evidence. Documentation of Project Nightfall. Every transaction, every weapons sale, every dirty cop. I want a deal." },
  { who = "blackwood", line = "What kind of deal?", mood = "smirk" },
  { who = "jack_malone", line = "I walk away clean. You let me disappear. The evidence disappears with me." },
]
[[warehouse_negotiation.choices]]
text = "Wait for their response"
goto = "negotiation_response"

[warehouse_rush_guards]
mood = "danger"
text = """
You're fast. The first guard goes down with a broken jaw. The second pulls a gun. You're faster.

Inside the warehouse, alarms blare. You've lost the element of surprise, but you're inside. Now it's just survival."""
dialogue = [
  { who = "jack_malone", line = "No turning back now.", mood = "angry" },
]
[[warehouse_rush_guards.choices]]
text = "Fight your way to the meeting room"
goto = "warehouse_combat"

[street_confrontation]
text = """
You step out of the shadows, gun drawn.
'Going somewhere, Chief?'

Morrison freezes. His hand hovers near his weapon."""
dialogue = [
  { who = "morrison", line = "Malone. You should be in custody by now.", mood = "shocked" },
  { who = "jack_malone", line = "Should be a lot of things. But here I am. What's in the briefcase?", mood = "smirk" },
  { who = "morrison", line = "Insurance. Same as you, I imagine. We're not so different.", mood = "smirk" },
]
[[street_confrontation.choices]]
text = "Take the briefcase"
goto = "take_briefcase"
[[street_confrontation.choices]]
text = "Let Morrison go - follow the bigger fish"
goto = "let_morrison_go"

[follow_morrison]
mood = "alert"
text = """
Morrison leads you to a train station. He's leaving town. Smart man. But before he boards, he stops at a locker.
Deposits the briefcase. Takes out another.

After he leaves, you pick the lock. Inside: more evidence. And a note: 'For whoever comes looking - finish what I couldn't.'"""
dialogue = [
  { who = "jack_malone", line = "Morrison was trying to get out. They probably killed him before the train reached the next station.", mood = "sad" },
]
[[follow_morrison.choices]]
text = "Use Morrison's evidence to end this"
goto = "morrison_evidence_ending"

[turn_self_in]
text = """
You call Rodriguez. Tell him everything.
He brings you in, but he believes you. The FBI confirms the dead woman's identity.

You spend six months in protective custody while they build the case. When it's over, you're cleared. Project Nightfall is exposed. But the woman in your office is still dead. And so is the FBI agent."""
dialogue = [
  { who = "jack_malone", line = "Two good people dead because I pulled a trigger. Self defense doesn't make it hurt less.", mood = "sad" },
]
[[turn_self_in.choices]]
text = "The End"
goto = "ending_guilty_conscience"

[run_from_fbi]
text = """
You run. Mexico first, then further south.
The evidence goes to a journalist you trust.

Project Nightfall gets exposed, but you can never go home. Some nights, you wonder if it was worth it.
Most nights, you try not to think at all."""
dialogue = [
  { who = "jack_malone", line = "They say you can't run from your past. But you can sure as hell try.", mood = "sad" },
]
[[run_from_fbi.choices]]
text = "The End"
goto = "ending_exile"

[fbi_cooperation]
mood = "calm"
text = """
You trust Agent Chen. She brings in her team.
The FBI raids Warehouse 47 with tactical precision.

Blackwood resists. He's killed in the firefight.
Castellano and Morrison are arrested. You testify.
They go away for life. You get your badge back.
Metaphorically speaking."""
dialogue = [
  { who = "chen", line = "You're a good man, Malone. In a bad business." },
  { who = "jack_malone", line = "Only business I know.", mood = "smirk" },
]
[[fbi_cooperation.choices]]
text = "The End"
goto = "ending_fbi_victory"

[chen_partnership]
mood = "alert"
text = """
You and Chen approach Warehouse 47 together.
Federal agent and private eye. Strange bedfellows.

The raid is surgical. Chen's team takes the perimeter.
You and Chen go inside. Blackwood surrenders when he sees the FBI badges. Castellano tries to run. Morrison eats his gun."""
dialogue = [
  { who = "chen", line = "It's over. You're cleared of all charges." },
  { who = "jack_malone", line = "The dame is still dead.", mood = "sad" },
  { who = "chen", line = "Yes. But her death wasn't for nothing. We got them all." },
]
[[chen_partnership.choices]]
text = "The End"
goto = "ending_partnership_success"

[rodriguez_raid]
mood = "danger"
text = """
The raid is by the book. Rodriguez's team hits the warehouse hard. Castellano surrenders immediately - he's a businessman, not a fighter. Morrison tries to shoot his way out. He doesn't make it. Blackwood triggers a dead man's switch. The warehouse explodes.

But you all got out first. And the evidence survived."""
dialogue = [
  { who = "rodriguez", line = "Good work, Jack. The city owes you one.", mood = "happy" },
  { who = "jack_malone", line = "The city owes me about a hundred. But who's counting?", mood = "smirk" },
]
[[rodriguez_raid.choices]]
text = "The End"
goto = "ending_by_the_book"

[solo_warehouse_attack]
text = """
You walk into Warehouse 47 like it's your office.
The guards raise their weapons. You raise yours.

The firefight is short and brutal. When the smoke clears, you're still standing. Barely. Castellano's dead. Morrison's dead. Blackwood is gone - he slipped out during the chaos.

You collapse. When you wake up, you're in a hospital.
Rodriguez is sitting by your bed."""
dialogue = [
  { who = "rodriguez", line = "You crazy son of a bitch. You did it.", mood = "happy" },
  { who = "jack_malone", line = "Blackwood got away.", mood = "pained" },
  { who = "rodriguez", line = "FBI picked him up at the airport. It's over, Jack. You're clear.", mood = "happy" },
]
[[solo_warehouse_attack.choices]]
text = "The End"
goto = "ending_lone_wolf_victory"

[castellano_alliance]
text = """
You shake hands with the devil.
Castellano provides the location of Blackwood's headquarters. You provide the distraction.

Together, you bring down Project Nightfall.
Blackwood dies in the raid. Morrison goes to prison.
Castellano walks free - there's no evidence linking him anymore.

You wonder if you made the right choice.
Then again, in this city, there are no right choices.
Only choices you can live with."""
dialogue = [
  { who = "castellano", line = "Pleasure doing business with you, Malone.", mood = "smirk" },
  { who = "jack_malone", line = "If we ever meet again, the deal's off.", mood = "angry" },
  { who = "castellano", line = "Understood. Let's hope we don't.", mood = "smirk" },
]
[[castellano_alliance.choices]]
text = "The End"
goto = "ending_deal_with_devil"

[refuse_castellano]
text = """
'I don't work with killers.'
'Pity,' Castellano says. He nods to his men.

The last thing you see is the muzzle flash."""
dialogue = [
  { who = "castellano", line = "Shame. We could've done great things together.", mood = "smirk", fx = "flash" },
]
[[refuse_castellano.choices]]
text = "..."
goto = "ending_died_with_honor"

[warehouse_wounded_entry]
mood = "mystery"
text = """
They take you inside. You're leaving a blood trail.
Castellano looks at you with something approaching respect."""
dialogue = [
  { who = "castellano", line = "You got guts, Malone. I'll give you that much. Talk. You got thirty seconds before I finish what Tony started.", mood = "smirk" },
  { who = "jack_malone", line = "General Marcus Blackwood. He's using you. He killed the dame, framed me, and when this goes south, you're next.", mood = "pained" },
  { who = "blackwood_emerging", line = "That's enough, Mr. Malone.", mood = "smirk", fx = "shake" },
]
[[warehouse_wounded_entry.choices]]
text = "'There he is. The man behind the curtain.'"
goto = "final_confrontation_wounded"

[velvet_room]
mood = "mystery"
text = """
The Velvet Room is all red velvet and dim lights.
Jazz plays. Smoke curls. You flash your PI license at the hostess. 'I need to see the owner. Tell him it's about the dame.'

Five minutes later, you're in a back office.
Castellano pours two drinks."""
dialogue = [
  { who = "castellano", line = "I heard about your problem, Jack. Bad business." },
  { who = "jack_malone", line = "Your business?", mood = "angry" },
  { who = "castellano", line = "Not mine. Bigger fish. I'm just the middleman. You want answers? Help me take down the real monster.", mood = "smirk" },
]
[[velvet_room.choices]]
text = "Hear him out"
goto = "castellano_reveal"
[[velvet_room.choices]]
text = "This is a trap - get out"
goto = "velvet_room_escape"

[shootout_tactical]
mood = "danger"
text = """
You take cover behind steel crates. Eddie flanks right.
The energy weapon tears through the warehouse.

But you and Eddie are professionals. You wait for the reload. Then you move. Two shots. Blackwood goes down.
The weapon skitters across the floor."""
dialogue = [
  { who = "eddie", line = "Clear!", mood = "happy" },
  { who = "jack_malone", line = "Call it in. We're done here." },
]
[[shootout_tactical.choices]]
text = "The End"
goto = "ending_tactical_victory"

[charge_blackwood]
text = """
You charge. The energy beam catches you in the shoulder. Pain like you've never felt. But you keep moving.

Three steps. Two. One.
You crash into Blackwood. Your gun against his chest.
One shot. It's over."""
dialogue = [
  { who = "eddie", line = "Jack! You hit?", mood = "afraid" },
  { who = "jack_malone", line = "I'll live. Probably. Is he dead?", mood = "pained" },
  { who = "eddie", line = "Very.", mood = "smirk" },
]
[[charge_blackwood.choices]]
text = "The End"
goto = "ending_heroic_victory"

[arrest_morrison]
mood = "noir"
text = """
You hold Morrison at gunpoint while Eddie calls Rodriguez. The good cops come. Morrison goes quietly in the end.

With his testimony, the whole operation falls apart.
Project Nightfall ends not with a bang, but with handcuffs."""
dialogue = [
  { who = "rodriguez", line = "Good work, Jack. Both of you.", mood = "happy" },
]
[[arrest_morrison.choices]]
text = "The End"
goto = "ending_justice_served"

[shoot_morrison]
mood = "danger"
text = """
You pull the trigger. Morrison drops.
Eddie stares at you."""
dialogue = [
  { who = "eddie", line = "Jack... he was surrendering...", mood = "shocked" },
  { who = "jack_malone", line = "He killed that dame. He killed dozens. He was never going to see the inside of a prison. You know it. I know it.", mood = "angry" },
  { who = "eddie", line = "Maybe. But that was murder.", mood = "sad" },
]
[[shoot_morrison.choices]]
text = "The End"
goto = "ending_dark_justice"

[dive_cover]
text = """
The energy beam passes over your head. You roll, fire twice. Both shots hit. Blackwood staggers, falls.

Castellano tries to run. You shoot him in the leg.
When the police arrive, you're sitting on a crate,
smoking a cigarette, surrounded by bodies."""
dialogue = [
  { who = "jack_malone", line = "Sometimes you get lucky. Sometimes you get even. Tonight, I got both.", mood = "smirk" },
]
[[dive_cover.choices]]
text = "The End"
goto = "ending_survivor"

[shoot_blackwood]
mood = "danger"
text = """
You take the shot. The bullet catches Blackwood in the throat. He goes down. The energy weapon powers down.

Castellano raises his hands. Morrison is already running. You let him. He'll be dead by morning anyway.
Men like that always are."""
dialogue = [
  { who = "jack_malone", line = "It's over." },
]
[[shoot_blackwood.choices]]
text = "The End"
goto = "ending_quick_draw"

[negotiation_response]
text = """
Blackwood laughs. It's not a pleasant sound.
'Mr. Malone, we both know you don't have any copies.
If you did, you would have used them already.
You're a good detective, but a terrible liar.'

He pulls out a weapon. Not a gun. Something worse.
'Goodbye, Mr. Malone.'"""
dialogue = [
  { who = "jack_malone", line = "Worth a shot...", mood = "afraid", fx = "flash" },
]
[[negotiation_response.choices]]
text = "..."
goto = "ending_bad_bluff"

[warehouse_combat]
mood = "mystery"
text = """
You fight through the warehouse like a one-man army.
Guards fall. You take bullets but keep moving.

By the time you reach the meeting room, you're running on adrenaline and fury. Blackwood, Castellano, and Morrison turn to face you. Too late."""
dialogue = [
  { who = "jack_malone", line = "It ends tonight.", mood = "angry" },
]
[[warehouse_combat.choices]]
text = "Finish it"
goto = "warehouse_final_showdown"

[take_briefcase]
text = """
You take the briefcase. Morrison doesn't resist.
Inside: enough evidence to bury everyone involved.

'Why?' you ask.
'Because I'm tired,' Morrison says. 'Tired of the lies.
Tired of the blood. Use it. End this.'

He walks away into the rain. You never see him again."""
dialogue = [
  { who = "jack_malone", line = "Even bad men get tired of being bad. Sometimes.", mood = "sad" },
]
[[take_briefcase.choices]]
text = "Use the evidence"
goto = "morrison_evidence_ending"

[let_morrison_go]
text = """
You let Morrison go. He's not the real villain here.
Just another piece on the board.

You tail him back to Warehouse 47. Now you know where everyone is. Now you can end it."""
[[let_morrison_go.choices]]
text = "Attack the warehouse"
goto = "solo_warehouse_attack"

[morrison_evidence_ending]
mood = "mystery"
text = """
Morrison's evidence is devastating. You leak it to every news outlet. Within 48 hours, the arrests begin. Blackwood. Castellano. Dozens of dirty cops.

You're cleared of all charges. The dame's death is solved. Morrison is found dead a week later. Suicide, they say.
You don't believe it. But you let it go."""
dialogue = [
  { who = "jack_malone", line = "Justice isn't clean. But it's better than nothing.", mood = "sad" },
]
[[morrison_evidence_ending.choices]]
text = "The End"
goto = "ending_evidence_endgame"

[final_confrontation_wounded]
text = """
Blackwood draws his weapon. You draw yours.
For a moment, everything is still.

Then Castellano draws too. Not at you. At Blackwood.
'Nobody frames me,' Castellano says. 'Nobody.'

The warehouse erupts in gunfire. When it's over,
Blackwood is dead. Castellano is dead. You're barely alive. But you're alive."""
dialogue = [
  { who = "jack_malone", line = "Sometimes the bad guys kill each other. Sometimes you get lucky.", mood = "pained" },
]
[[final_confrontation_wounded.choices]]
text = "The End"
goto = "ending_pyrrhic_victory"

[velvet_room_escape]
mood = "mystery"
text = """
You back toward the door. Castellano doesn't stop you.
'You'll be back,' he says. 'They always come back.'

He's wrong. You go to the FBI. Give them everything.
Three months later, it's over. Castellano, Blackwood, Morrison. All behind bars. You're free."""
dialogue = [
  { who = "jack_malone", line = "Sometimes the smart play is walking away. Then hitting them from behind.", mood = "smirk" },
]
[[velvet_room_escape.choices]]
text = "The End"
goto = "ending_smart_escape"

[warehouse_final_showdown]
mood = "mystery"
text = """
The fight is quick and brutal. You're wounded, exhausted, running on empty. But you're also right. And that counts for something.

When the smoke clears, Blackwood and Morrison are dead.
Castellano lives, barely. He'll talk. He'll deal.
And you'll finally get the truth."""
dialogue = [
