[opening]
mood = "mystery"
text = """
The neon sign outside your office window flickers - 'MALONE INVESTIGATIONS'. It's 2 AM. The dame who walked in an hour ago is now lying face-down on your carpet, a red rose blooming across her white dress. Your gun is still warm in your hand.

You don't remember pulling the trigger. But in this business, memory is just another luxury you can't afford."""
art = """

╔════════════════════════════════════════════════════════════════╗
║                   MALONE INVESTIGATIONS                       ║
║                      47th Floor                               ║
╠════════════════════════════════════════════════════════════════╣
║                                                              ║
║   ╔══════════════════╗                    ╔══════════════╗   ║
║   ║    FILE          ║                    ║   VENETIAN   ║   ║
║   ║   CABINET        ║       ╭────────╮   ║    BLINDS    ║   ║
║   ║      │           ║      ╱          ╲  ║              ║   ║
║   ║  ┌───┴──┐        ║     │            │ ║   ░░░░░░░   ║   ║
║   ║  │ FILES│        ║     │   DESK    │ ║   ░░░░░░░   ║   ║
║   ║  │ CASE │        ║     │           │ ║   ░░░░░░░   ║   ║
║   ║  │  #47 │        ║     │  ┌─────┐ │ ║   ▓▓▓▓▓▓▓   ║   ║
║   ║  └─────┘        ║     │  │ GUN │ │ ║              ║   ║
║   ║                 ║     │  └─────┘ │ ║   CITY VIEW   ║   ║
║   ║                 ║     │  ┌─────┐ │ ║   (DARK)      ║   ║
║   ║                 ║     │  │ LAMP│ │ ║              ║   ║
║   ╚═════════════════╝     ╰──┬─────┬──╯ ╚══════════════╝   ║
║                             │     │                         ║
║                          ≈ ≈ ≈ ≈ ≈ ≈ ≈                      ║
║                         ( CIGARETTE SMOKE )                  ║
║                                                              ║
║   "Three days of rain. Three days of lies.                   ║
║    She's dead. I'm holding the gun. Cops are coming."        ║
║                                                              ║
╚════════════════════════════════════════════════════════════════╝
        """
dialogue = [
  { who = "jack_malone", line = "Think, Jack. Think... What happened?", mood = "pained", fx = "glitch" },
  { who = "jack_malone", line = "The dame said she was being followed. Said she had proof that would bring down the Castellano family. Then... nothing.", mood = "sad" },
  { who = "jack_malone", line = "I need to figure this out fast. Cops will be here any minute.", mood = "afraid" },
]
[[opening.choices]]
text = "Search the woman's body for clues"
goto = "search_body"
[[opening.choices]]
text = "Check your own gun - how many bullets fired?"
goto = "check_gun"
[[opening.choices]]
text = "Run. Get out while you still can."
goto = "run_away"

[search_body]
mood = "alert"
text = """
You kneel beside the body, your hands steady despite everything. Professional habits die hard. In her clutch, you find a photograph: Vincent Castellano shaking hands with Police Chief Morrison.

Behind them, a warehouse with '47' painted on the door.
There's something else - a ticket stub. Tonight's performance at the Ritz Theater. Section 47. Seat 13."""
dialogue = [
  { who = "jack_malone", line = "Warehouse 47... Seat 47... That's not coincidence.", mood = "shocked" },
  { who = "jack_malone", line = "Either she wanted me to find this, or someone wanted me to find her." },
]
[[search_body.choices]]
text = "Go to Warehouse 47 - confront this head-on"
goto = "warehouse"
[[search_body.choices]]
text = "Visit the Ritz Theater - check out the connection"
goto = "theater"
[[search_body.choices]]
text = "Take the evidence to Captain Rodriguez - he's clean"
goto = "rodriguez"

[check_gun]
mood = "alert"
text = """
You pop the cylinder. Six chambers. Six bullets.
Not a single one fired.

Your blood runs cold. Someone else pulled the trigger.
Someone who wants you to take the fall."""
set_flags = ["examined_gun"]
dialogue = [
  { who = "jack_malone", line = "I've been played. Set up like a patsy.", mood = "angry", fx = "flash" },
  { who = "jack_malone", line = "But who? And why?", mood = "afraid" },
]
[[check_gun.choices]]
text = "Search the dame for clues"
goto = "search_body_after_gun"
[[check_gun.choices]]
text = "Check the office - maybe they're still here"
goto = "check_office"
[[check_gun.choices]]
text = "Call your old partner Eddie for help"
goto = "call_eddie"

[run_away]
mood = "danger"
text = """
You grab your coat and hat, heading for the fire escape. The rain hits you like a fist as you descend into the alley.

But as you reach the street, three figures emerge from the shadows. Castellano's men. They've been waiting."""
art = """

