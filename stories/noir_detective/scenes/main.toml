        """
dialogue = [
  { who = "jack_malone", line = "Whatever's happening in there, it's big enough to kill for.", mood = "afraid" },
]
[[warehouse.choices]]
text = "Sneak in through the roof - get close and listen"
goto = "warehouse_sneak"
[[warehouse.choices]]
text = "Walk in the front door - surprise is a weapon too"
goto = "warehouse_front"
[[warehouse.choices]]
text = "Wait and follow whoever leaves first"
goto = "warehouse_wait"

[theater]
mood = "mystery"
text = """
The Ritz Theater is dark except for the exit signs.
You find Section 47, Seat 13. Under the cushion: an envelope. Inside, documents. Bank transfers. Payoffs. Names.

The whole department is dirty. Not just Morrison - dozens of cops, judges, city councilmen. And at the center: Project Nightfall. Military weapons being sold to the highest bidder."""
dialogue = [
  { who = "jack_malone", line = "The dame wasn't running from Castellano. She was running from everyone. This is enough to burn the whole city down.", mood = "shocked" },
  { who = "voice_from_darkness", line = "That's exactly right, Mr. Malone.", fx = "shake" },
]
[[theater.choices]]
text = "Spin and draw your gun"
goto = "theater_fight"
[[theater.choices]]
text = "Stay calm - 'Who's there?'"
goto = "theater_reveal"

[rodriguez]
mood = "calm"
text = """
Captain Rodriguez looks at the photograph, his face unreadable. For a long moment, he says nothing. Then he opens his desk drawer and pulls out a bottle of whiskey. Two glasses.

'I've been waiting for this day, Jack. Hoping it wouldn't come, but knowing it would.'"""
set_flags = ["went_to_rodriguez"]
dialogue = [
  { who = "rodriguez", line = "I've known about Morrison for two years. Couldn't prove it. Couldn't trust anyone. The rot goes deep.", mood = "sad" },
  { who = "jack_malone", line = "And now?" },
  { who = "rodriguez", line = "Now we have proof. And now you're a murder suspect. They played this smart - take you off the board, silence their leak, all in one move.", mood = "angry" },
  { who = "rodriguez", line = "I can protect you, Jack. But we need to move fast. There's a meeting tonight. Warehouse 47. All the players will be there." },
]
[[rodriguez.choices]]
text = "Trust Rodriguez - let him handle this officially"
goto = "rodriguez_plan"
[[rodriguez.choices]]
text = "Take the evidence and do this your way"
goto = "solo_mission"

[castellano_meeting]
mood = "mystery"
text = """
They drive you to the Velvet Room. Vincent Castellano sits in a private booth, flanked by men who look like they eat bullets for breakfast.

'Jack Malone. I'd say it's good to see you, but we both know I'd be lying.' He gestures to the seat across from him."""
art = """

