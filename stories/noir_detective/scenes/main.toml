dialogue = [
  { who = "castellano", line = "You got a dead woman in your office and your prints on the gun. Bad night for you, Jack.", mood = "smirk" },
  { who = "jack_malone", line = "I didn't kill her.", mood = "angry" },
  { who = "castellano", line = "I know. I did.", mood = "smirk", fx = "flash" },
]
[[castellano_meeting.choices]]
text = "'Why tell me?' - keep him talking"
goto = "castellano_reveal"
[[castellano_meeting.choices]]
text = "Go for your gun - end this now"
goto = "castellano_shootout"

[alley_fight]
text = """
You throw the first punch. Tony's nose breaks with a satisfying crunch. The second goon pulls a knife, but you're already moving.

The fight is brutal, quick, messy. When it's over, you're bleeding from three places and Tony's friends aren't getting up.
Tony himself is on one knee, glaring at you."""
dialogue = [
  { who = "tony", line = "You're... dead, Malone. Mr. C will... burn this city... to find you.", mood = "pained" },
  { who = "jack_malone", line = "Tell your boss I'm coming for him. And I'm bringing answers.", mood = "angry" },
]
[[alley_fight.choices]]
text = "Head to Warehouse 47 - finish this tonight"
goto = "warehouse_injured"
[[alley_fight.choices]]
text = "Find a doctor you can trust - you won't survive much more bleeding"
goto = "doctor_visit"

[blame_setup]
text = """
'Your boss wanted me to take the fall for a murder I didn't commit. The dame in my office? Someone else pulled that trigger.'

Tony exchanges a glance with his boys. You see the doubt creep in."""
dialogue = [
  { who = "tony", line = "Mr. C don't play games like that. He wants someone dead, they die. No setups, no frames.", mood = "angry" },
  { who = "jack_malone", line = "Then maybe someone's playing him too. Someone bigger." },
  { who = "tony", line = "Get in the car. We're all gonna have a talk with the boss.", mood = "angry" },
]
[[blame_setup.choices]]
text = "Get in the car - meet Castellano"
goto = "castellano_meeting"
[[blame_setup.choices]]
text = "Make a break for it - run while they're confused"
goto = "escape_run"

[warehouse_with_eddie]
mood = "danger"
text = """
You and Eddie approach Warehouse 47 like the old days.
No words needed - you take the roof, he takes the back door.

From above, you see the meeting: Castellano, Morrison,
and a man in a military uniform. General Marcus Blackwood. You know that name. Army weapons contractor. Officially dead two years ago."""
dialogue = [
  { who = "blackwood", line = "Gentlemen, Project Nightfall is proceeding as planned. The weapons shipment arrives in three days. Half goes to Castellano's buyers. Half goes to Morrison's distribution network.", mood = "smirk" },
  { who = "morrison", line = "What about the Malone situation?", mood = "afraid" },
  { who = "blackwood", line = "By morning, he'll be wanted for murder. By noon, he'll be dead. One way or another.", mood = "smirk" },
]
[[warehouse_with_eddie.choices]]
text = "Drop in guns blazing - citizen's arrest"
goto = "warehouse_shootout_eddie"
[[warehouse_with_eddie.choices]]
text = "Record everything and get out - build a real case"
goto = "warehouse_evidence"

[velvet_room_with_eddie]
mood = "mystery"
text = """
The Velvet Room is packed. Jazz plays soft and low.
Eddie takes a position at the bar while you head to the back rooms.

You find what you're looking for: an office. Inside, filing cabinets full of records. Blackmail material. Insurance policies. And a ledger with every dirty cop in the city."""
dialogue = [
  { who = "eddie_radio", line = "Jack, we got company. Morrison just walked in. He's headed your way.", mood = "afraid", fx = "glitch" },
  { who = "jack_malone", line = "Copy that. I've got what we need. Meet at the back exit." },
]
[[velvet_room_with_eddie.choices]]
text = "Confront Morrison - end this face to face"
goto = "morrison_confrontation"
[[velvet_room_with_eddie.choices]]
text = "Slip out with the evidence - let the law handle it"
goto = "escape_with_evidence"

[warehouse_sneak]
mood = "mystery"
text = """
The skylight gives you a perfect view. You listen as they discuss Project Nightfall - a massive weapons smuggling operation. Military hardware being sold to criminals. The dead dame was an accountant who discovered the truth."""
dialogue = [
  { who = "blackwood", line = "Malone will be eliminated before dawn. The evidence is in place.", mood = "smirk" },
  { who = "castellano", line = "What about the other copies?" },
  { who = "blackwood", line = "There are no other copies. The woman was working alone." },
  { who = "malone_thinking", line = "They're wrong. If she came to me, she had insurance.", mood = "smirk" },
]
[[warehouse_sneak.choices]]
text = "Crash through the skylight - surprise attack"
goto = "warehouse_skylight_attack"
[[warehouse_sneak.choices]]
text = "Back out slowly and regroup - you're outgunned"
goto = "warehouse_retreat"

[warehouse_front]
mood = "alert"
text = """
You walk up to the front door and knock. The guards look at you like you've lost your mind.

'Tell Castellano that Jack Malone is here. Tell him I know about Nightfall. And tell him I have copies.'"""
dialogue = [
  { who = "guard", line = "You got a death wish, Malone?" },
  { who = "jack_malone", line = "Just good business sense. Your boss wants what I have. I want what he knows. Let's deal.", mood = "smirk" },
]
[[warehouse_front.choices]]
text = "Wait to be let in - play this cool"
goto = "warehouse_negotiation"
[[warehouse_front.choices]]
text = "The guards are distracted - rush them"
goto = "warehouse_rush_guards"

[warehouse_wait]
mood = "alert"
text = """
Patience is a virtue in your line of work. You wait in the rain, watching. An hour passes. Then Morrison emerges alone, carrying a briefcase.

He looks nervous. Keeps checking over his shoulder.
You follow him through the rain-slicked streets."""
dialogue = [
  { who = "jack_malone", line = "Where are you going, Chief? What's so important you're cutting out early?", mood = "smirk" },
]
[[warehouse_wait.choices]]
text = "Confront Morrison in the street"
goto = "street_confrontation"
[[warehouse_wait.choices]]
text = "Follow him to his destination"
goto = "follow_morrison"

[theater_fight]
text = """
You spin, gun drawn. The shot echoes through the empty theater. The figure drops. You approach carefully.

It's not a soldier. Not a mobster. It's a woman. Late fifties. She's wearing a federal badge."""
art = """

