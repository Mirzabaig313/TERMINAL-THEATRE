# THE LAST CASE - Chapter 2: The Streets
# Alleys, nightclubs, a station house and an empty theater. Everyone wants a piece of Jack Malone.

# ---------------------------------------------------------------- the alley

[alley_fight]
mood = "danger"
transition = "cut"
fx = "blood"
text = """
You don't wait for the invitation. You throw the first punch, and it's a good one - all shoulder, all three days of rain behind it. Tony's nose goes with a crunch like stepping on a matchbox.

The second goon pulls a knife. You hear it before you see it, that oily little click. You're already moving, already inside his reach, driving his wrist into the brick until the blade rings off the cobbles. The third one gets a garbage-can lid across the jaw and sits down hard in a puddle like he's decided to stay.

It's brutal and quick and ugly, the way real fights are. Nobody dances. When it's over you're bleeding from three places - lip, eyebrow, and somewhere under your ribs that's starting to feel warm and wet - and two of Castellano's boys aren't getting up.

Tony is on one knee in the rain, holding his face together with one hand, blood running between his fingers. His gun is in the gutter, a yard from your shoe. He looks at it. He looks at you. He doesn't reach."""
# a street brawl with Castellano's men: the whole city hears about it
add = { heat = 2 }
dialogue = [
  { who = "tony", line = "You're... dead, Malone. Mr. C will... burn this city... to find you.", mood = "pained" },
  { who = "jack_malone", line = "Tell your boss I'm coming for him. And I'm bringing answers.", mood = "angry" },
  { who = "malone_thinking", line = "I could kick that gun into the drain and walk. Or I could make sure he never gets up.", mood = "pained" },
]
[[alley_fight.choices]]
text = "Spare Tony - hand him his hat and send him home with a message"
goto = "tony_message"
[[alley_fight.choices]]
text = "Leave him in the gutter and head for Warehouse 47 - finish this tonight"
goto = "warehouse_injured"
# bodies left in the street turn up the heat
add = { heat = 1 }
[[alley_fight.choices]]
text = "Find a doctor you can trust - you won't survive much more bleeding"
goto = "doctor_visit"

[tony_message]
mood = "noir"
text = """
You pick his hat out of the puddle, knock the water off it against your knee, and set it on his head. Crooked. He blinks up at you through the blood like you've just spoken to him in Latin.

Then you kick his gun down the storm drain and crouch so you're eye to eye.

'You're going to live, Tony. You know why? Because somebody put a dead girl on my carpet and wants me to think it was your boss. Maybe it was. Maybe it wasn't. Either way, you and me are the two dumbest pieces on this board, and I'd like at least one of us to see Sunday.'

Something moves behind his eyes. In Tony's line of work, nobody hands you your hat back. Nobody lets you keep your teeth for free. Men like him keep a ledger in their heads - who hurt them, who didn't - and you just got written down in the wrong column. The right one.

He doesn't say thank you. He spits red, nods once, and limps off into the steam."""
set_flags = ["tony_owes_you"]
# a debt, but a grudging one - you did break his nose. And no bodies in the gutter.
add = { trust_tony = 1, heat = -1 }
dialogue = [
  { who = "tony", line = "This don't make us friends, Malone.", mood = "pained" },
  { who = "jack_malone", line = "Wouldn't dream of it. Just remember who handed you your hat.", mood = "smirk" },
]
[[tony_message.choices]]
text = "Head straight for Warehouse 47 before Tony gets there first"
goto = "warehouse_injured"
[[tony_message.choices]]
text = "Get patched up at Doc Stevens' - you're no good to anyone dead"
goto = "doctor_visit"

[blame_setup]
mood = "alert"
text = """
You keep your hands where they can see them and your voice low and even, the way you'd talk to a dog that hasn't decided yet.

'Your boss wants me to take the fall for a murder I didn't commit, Tony. The dame upstairs? Someone else pulled that trigger. Somebody came through my wall, put her down, and stuck my own gun in my hand while I was out cold. You think Vincent Castellano needs to crawl through ductwork to kill a girl?'

Rain drums on the garbage cans. One of the goons shifts his weight. Tony doesn't answer right away, and that's the tell: a man who's sure of something answers fast.

He exchanges a glance with his boys. You see the doubt creep in, thin as smoke under a door. Castellano's people are a lot of things, but they're proud of their work. A frame job is somebody else's signature on their wall."""
add = { trust_tony = 1 }
dialogue = [
  { who = "tony", line = "Mr. C don't play games like that. He wants someone dead, they die. No setups, no frames.", mood = "angry" },
  { who = "jack_malone", line = "Then maybe someone's playing him too. Someone bigger." },
  { who = "tony", line = "Get in the car. We're all gonna have a talk with the boss.", mood = "angry" },
]
[[blame_setup.choices]]
text = "Get in the car - meet Castellano"
goto = "castellano_meeting"
[[blame_setup.choices]]
text = "Make a break for it - run while they're confused"
goto = "escape_run"
[[blame_setup.choices]]
text = "Slowly open your revolver and show Tony six live rounds"
goto = "tony_doubts"
any_flags = ["examined_gun"]

[tony_doubts]
mood = "noir"
text = """
You move slowly, two fingers, like you're handling a snake. The cylinder swings out. You tilt it toward the street lamp so the light catches six brass caps, clean and round and untouched.

'Smell it,' you say. 'Go on.'

Tony takes the gun by the barrel, sniffs, frowns. He knows guns the way priests know sin. He hands it back without a word.

For a long moment there's nothing but the rain and the hiss of the grate. Then Tony jerks his head at his boys and they step back, out of the light, like men who have suddenly remembered somewhere else to be.

'I never saw you,' he says. 'Twenty minutes. After that, I gotta tell Mr. C something, and it's gonna be the truth. Whoever did this to you, Malone - they did it to us too. Nobody puts a job on our name without asking.' He lights a cigarette, cups it against the rain. 'Pier 9. Warehouse 47. Two o'clock tonight, there's a sit-down. Everybody who matters. You didn't hear it from me.'"""
set_flags = ["tony_owes_you"]
# shown the truth, not beaten into it: Tony is really on your side now
add = { trust_tony = 2 }
dialogue = [
  { who = "tony", line = "Twenty minutes. Don't make me regret it.", mood = "angry" },
  { who = "jack_malone", line = "Tony, if I live through this, I owe you a drink.", mood = "smirk" },
  { who = "tony", line = "If you live through this, I'll want the whole bottle.", mood = "smirk" },
]
[[tony_doubts.choices]]
text = "Pier 9, Warehouse 47 - use the head start and get there first"
goto = "warehouse"
[[tony_doubts.choices]]
text = "Spend the twenty minutes getting Eddie on your side"
goto = "call_eddie"

[escape_run]
mood = "danger"
ambience = "storm"
sound = "footsteps"
text = """
You bolt. Tony shouts something that the rain swallows whole, and you're already around the corner, coat flapping, shoes slapping through water that runs ankle-deep in the gutters.

The rain works in your favour. Sound goes dead in it. Shapes go grey. A man in a dark coat running down a dark street at 2 AM is just one more shadow in a city that's made of them. You cut through a laundry, out the back, across a rooftop, down a ladder into a different alley that smells of fish and diesel. You know these streets the way you know the lines on your own hands.

Behind you, a car engine starts up and starts hunting.

You stop under an awning to get your breath back and light a cigarette with fingers that shake more than you'd like. You've bought yourself some time. Not much. Castellano knows now that you're onto something, and by sunrise every bartender, cab driver and cop on his payroll will have your description."""
add = { heat = 1 }
dialogue = [
  { who = "jack_malone", line = "Bought myself some time. Now I need to use it.", mood = "smirk" },
]
[[escape_run.choices]]
text = "Go to ground at Eddie's place - need backup"
goto = "call_eddie"
add = { heat = -1 }
[[escape_run.choices]]
text = "Hit Warehouse 47 before they expect it"
goto = "warehouse"

[doctor_visit]
mood = "calm"
ambience = "city"
text = """
Doc Stevens works out of the back of a laundromat on Delancey, behind a curtain that smells of starch and carbolic. He lost his licence in '38 for treating the wrong kind of patient, and he's been treating nothing but the wrong kind ever since.

He doesn't ask questions anymore. He just points at the table. You lie down on butcher paper under a single bare bulb while he cuts your shirt off with tailor's shears and peers at the hole under your ribs through glasses as thick as ashtrays.

'Knife,' he says. 'Lucky. Half an inch to the left and I'd be calling the undertaker.'

The needle goes in and out, in and out. You count the stitches to keep from counting the dead. Eleven. The bourbon he gives you is better than yours, which is a sad thing to learn about yourself.

When he's done he snaps off his gloves, washes his hands for a long time, and looks at you the way a mechanic looks at a car that should have gone to the scrapyard years ago."""
# Doc's military rounds are a real lead
add = { evidence = 1 }
variants = [
  { if = "visited('warehouse_injured')", text = """
You turn your back on Pier 9 and the guards' laughter and make it six blocks on nothing but willpower and the last of your blood. By the time you reach Delancey, the street is tilting like the deck of a ship.

Doc Stevens works out of the back of a laundromat, behind a curtain that smells of starch and carbolic. He lost his licence in '38 for treating the wrong kind of patient, and he's been treating nothing but the wrong kind ever since. He catches you as you come through the curtain, which is just as well, because your knees have stopped taking orders.

He doesn't ask questions anymore. You lie on butcher paper under a single bare bulb while he cuts your shirt off with tailor's shears and peers at the hole under your ribs through glasses as thick as ashtrays.

'Knife,' he says. 'And then a walk to the docks on top of it. Half an inch to the left and I'd be calling the undertaker. Another block and I'd be calling him anyway.'

The needle goes in and out, in and out. You count the stitches to keep from counting the dead. Eleven. The bourbon he gives you is better than yours, which is a sad thing to learn about yourself.

When he's done he snaps off his gloves, washes his hands for a long time, and looks at you the way a mechanic looks at a car that should have gone to the scrapyard years ago.""" },
]
dialogue = [
  { who = "doc_stevens", line = "Whatever you're into, Jack, finish it soon. Next time I might not be able to put you back together.", mood = "sad" },
  { who = "jack_malone", line = "Thanks, Doc. Put it on my tab.", mood = "smirk" },
  { who = "doc_stevens", line = "Your tab could buy a new clinic. Just... be careful.", mood = "smirk" },
  { who = "doc_stevens", line = "And Jack - two of Castellano's boys came through here an hour ago with bullet burns. Military rounds. Not the kind you buy on the street.", mood = "afraid" },
  { who = "doc_stevens", line = "Two uniforms already came by asking after a man with a knife in him. Your face is on every prowl-car radio in the city. If you go out that door now, you won't get three blocks.", mood = "afraid", if = "heat >= 3" },
  { who = "doc_stevens", line = "Nobody's come asking after you yet. Rodriguez at the Ninth still owes me for his brother's appendix, if you need a cop who isn't for sale.", if = "heat <= 2" },
]
[[doctor_visit.choices]]
text = "Head to Warehouse 47 - time to end this"
goto = "warehouse"
[[doctor_visit.choices]]
text = "Investigate the Velvet Room instead"
goto = "velvet_room"
[[doctor_visit.choices]]
text = "Lie low in Doc's back room until the patrols thin out, then make for the docks"
goto = "warehouse"
if = "heat >= 3"
add = { heat = -2 }
[[doctor_visit.choices]]
text = "Have Doc ring Captain Rodriguez - a clean cop, while you're still a suspect and not a fugitive"
goto = "rodriguez"
if = "heat <= 2"

# ---------------------------------------------------------------- castellano

[castellano_meeting]
image = "images/castellano_meeting.svg"
mood = "mystery"
ambience = "neon"
text = """
They put you in the back of a black Packard with a goon on either side, close enough that you can smell their hair oil. Nobody talks. The wipers keep time like a metronome at a funeral.

The Velvet Room is all crimson drapes and cigarette smoke, a jazz trio murmuring something slow in the corner while men in good suits pretend not to see you being walked across the floor. They take you through a beaded curtain into a private booth at the back.

Vincent Castellano sits there like he grew out of the leather. Grey at the temples, a scar through one eyebrow, a chess set at his elbow with the white pieces winning. He's flanked by two men who look like they eat bullets for breakfast and pick their teeth with the casings.

'Jack Malone. I'd say it's good to see you, but we both know I'd be lying.' He gestures to the seat across from him. You take it. Your gun is still on your hip - which means either they forgot to take it, or they want you to try."""
art = """

