[velvet_room]
mood = "mystery"
ambience = "neon"
text = """
The Velvet Room is all red velvet and low light, a jewel box for people who've stolen the jewels. A trumpet bleeds something slow from the bandstand. Smoke hangs under the chandeliers in flat blue sheets, and every table has a candle in a red glass that makes the customers look like they're already in hell and enjoying it.

The hostess has a smile like a closed door. You flash your PI licence and lean in.

'I need to see the owner. Tell him it's about the dame.'

She doesn't ask which dame. That tells you plenty.

Five minutes later you're in a back office that smells of cedar and money. Vincent Castellano pours two fingers of something amber into two cut-crystal glasses and slides one across the desk to you. His hands are steady. His eyes are tired. He looks less like a man about to have you killed and more like a man who's been waiting for you to show up so he could get something off his chest."""
dialogue = [
  { who = "castellano", line = "I heard about your problem, Jack. Bad business." },
  { who = "jack_malone", line = "Your business?", mood = "angry" },
  { who = "castellano", line = "Not mine. Bigger fish. I'm just the middleman. You want answers? Help me take down the real monster.", mood = "smirk" },
]
[[velvet_room.choices]]
text = "Hear him out"
goto = "castellano_reveal"
[[velvet_room.choices]]
text = "This is a trap - get out and take what you know to the Feds"
goto = "ending_smart_escape"

[castellano_reveal]
mood = "noir"
ambience = "neon"
text = """
Castellano leans back and lights a cigar, taking his time about it, turning it in the flame until the tip glows even all the way round. A man who does that is a man who likes you to know he can afford to wait.

'I tell you because you're already dead, Jack. Question is whether you die knowing the truth or die confused. Me? I'm generous that way.'

He tells it plain, the way gangsters do when they've stopped being afraid of the story. The name he says is one you've read in the papers - in the obituaries, two years back. A general. A war hero. A man who supposedly went down in a plane over the Pacific and left a widow and a pension and a lot of unanswered questions at the Department of War.

Smoke curls between you. The band outside starts a new number, something with too many minor chords. When he's finished, Castellano looks older than when he started, and for the first time all night you believe every word coming out of his mouth."""
dialogue = [
  { who = "castellano", line = "That dame worked for a man named Blackwood. General Marcus Blackwood. He's running guns, weapons, military hardware. I'm just the distributor.", mood = "smirk" },
  { who = "castellano", line = "She got cold feet. Wanted out. Wanted to talk. So Blackwood ordered her dead. And you framed. Two problems, one solution.", mood = "sad" },
  { who = "jack_malone", line = "Why tell me this?" },
  { who = "castellano", line = "Because I'm tired of being Blackwood's errand boy. You want revenge? Help me take him down. Then we both walk away clean.", mood = "angry" },
]
[[castellano_reveal.choices]]
text = "Accept the deal - enemy of my enemy"
goto = "castellano_alliance"
[[castellano_reveal.choices]]
text = "Refuse - 'I don't work with killers'"
goto = "refuse_castellano"

[castellano_alliance]
mood = "noir"
ambience = "neon"
text = """
You shake hands with the devil. His palm is dry and warm and the grip is exactly as firm as it needs to be, not an ounce more.

The plan is simple, which is how you know it might work. Castellano gives you Blackwood's real headquarters - not Warehouse 47, which is a stage set for nervous partners, but a decommissioned naval depot out past the breakwater where the actual crates are stacked to the ceiling. You give him the distraction: a well-timed phone call to Rodriguez about a body on the waterfront, so that every honest cop in the city is looking the wrong way while Castellano's men go to work.

It goes off like clockwork. By dawn the depot is burning, the guns are at the bottom of the harbour, and General Marcus Blackwood is lying face-up on a loading ramp with the rain filling his open eyes.

Now Castellano is pouring the celebration drinks. He's smiling. And you've got one last decision to make about the man you shook hands with."""
dialogue = [
  { who = "castellano", line = "Pleasure doing business with you, Malone.", mood = "smirk" },
  { who = "jack_malone", line = "If we ever meet again, the deal's off.", mood = "angry" },
  { who = "castellano", line = "Understood. Let's hope we don't.", mood = "smirk" },
  { who = "malone_thinking", line = "He killed her on Blackwood's orders. He told me so himself. A deal's a deal... isn't it?", mood = "pained" },
]
[[castellano_alliance.choices]]
text = "Keep your word - walk away and let him have his clean slate"
goto = "ending_deal_with_devil"
[[castellano_alliance.choices]]
text = "Break it - tell Rodriguez exactly who pulled the trigger on Valentina"
goto = "ending_double_cross"

[refuse_castellano]
mood = "danger"
fx = "heartbeat"
text = """
'I don't work with killers.'

You say it quietly. It lands loud. The jazz outside doesn't stop, but in here it feels like it does.

'Pity,' Castellano says, and he means it, which is somehow worse. He taps ash into a crystal tray and nods to his men without looking at them.

Three guns come out from under three good jackets. The sound of three hammers going back is the loneliest music you've ever heard. One of the shooters is Tony, and his eyes won't quite meet yours.

Your own gun is a mile away on your hip. The door is behind you and the beaded curtain is nothing but glass and string. You've got maybe two seconds, and a whole life you could spend in them."""
dialogue = [
  { who = "castellano", line = "Shame. We could've done great things together.", mood = "sad" },
  { who = "tony", line = "Boss...", mood = "pained", if = "trust_tony >= 1" },
  { who = "tony", line = "Nothing personal, Malone. Just the job.", if = "trust_tony == 0" },
]
[[refuse_castellano.choices]]
text = "Stand your ground. Look him in the eye. Don't give him the satisfaction."
goto = "ending_died_with_honor"
[[refuse_castellano.choices]]
text = "Kick the table into the nearest gun and dive for the curtain"
goto = "ending_killed_by_castellano"
[[refuse_castellano.choices]]
text = "Look at Tony. Just look at him. He knows what he owes you."
goto = "ending_honor_among_thieves"
any_flags = ["tony_owes_you"]

# ---------------------------------------------------------------- rodriguez

[rodriguez]
image = "images/rodriguez.svg"
mood = "calm"
ambience = "city"
text = """
The 9th Precinct at 3 AM is a cathedral of bad coffee and worse lighting. A drunk sings in the holding cells. Somebody's typewriter goes clack-clack-ding with the patience of a man filling out a form for the thousandth time.

Captain Rodriguez's office is at the end of the hall, the only door with the light still on. He looks at the photograph for a long time. His face doesn't move. His moustache doesn't move. Only his thumb, rubbing slowly over Morrison's grinning face as if he could wipe it off.

Then he opens his desk drawer and pulls out a bottle of rye and two glasses with the precinct crest on them.

'I've been waiting for this day, Jack. Hoping it wouldn't come, but knowing it would.'

Before you leave, he presses a flare pistol into your hand, the kind the harbour patrol carries. 'Whatever you decide,' he says, 'if you get in over your head, light up the sky. My people will come.'"""
set_flags = ["went_to_rodriguez"]
# walking in on your own two feet: cooperating cools things down
add = { heat = -1 }
# arriving from Doc's back room, with stitches instead of a photograph
variants = [
  { if = "!item('Photograph')", text = """
Doc's phone call gets you in through the garage at the back of the 9th Precinct, past a desk sergeant who has been told not to look up. At 3 AM the place is a cathedral of bad coffee and worse lighting. A drunk sings in the holding cells. Somebody's typewriter goes clack-clack-ding with the patience of a man filling out a form for the thousandth time.

Captain Rodriguez's office is at the end of the hall, the only door with the light still on. You've got no photograph to show him. Just eleven fresh stitches and a story: the dame on your carpet, Tony and his boys waiting in the alley like they'd been told where to stand, the military rounds Doc dug out of Castellano's men. He listens to all of it without moving. His face doesn't move. His moustache doesn't move. Only his thumb, rubbing slowly over the edge of his desk as if he could wear a hole in it.

Then he opens his desk drawer and pulls out a bottle of rye and two glasses with the precinct crest on them.

'I've been waiting for this day, Jack. Hoping it wouldn't come, but knowing it would.'

Before you leave, he presses a flare pistol into your hand, the kind the harbour patrol carries. 'Whatever you decide,' he says, 'if you get in over your head, light up the sky. My people will come.'""" },
]
dialogue = [
  { who = "rodriguez", line = "I've known about Morrison for two years. Couldn't prove it. Couldn't trust anyone. The rot goes deep.", mood = "sad" },
  { who = "jack_malone", line = "And now?" },
  { who = "rodriguez", line = "Now we have proof. And now you're a murder suspect. They played this smart - take you off the board, silence their leak, all in one move.", mood = "angry", if = "item('Photograph')" },
  { who = "rodriguez", line = "Military rounds in Castellano's boys and a dead girl on your carpet. It isn't proof, Jack. But it's the first crack I've seen in two years.", mood = "angry", if = "!item('Photograph')" },
  { who = "rodriguez", line = "{evidence} separate leads in one night. You're wasted on divorce work, Jack.", mood = "smirk", if = "evidence >= 3" },
  { who = "rodriguez", line = "I can protect you, Jack. But we need to move fast. There's a meeting tonight. Warehouse 47. All the players will be there." },
]
[[rodriguez.choices]]
text = "Trust Rodriguez - let him handle this officially"
goto = "rodriguez_plan"
[[rodriguez.choices]]
text = "Take the evidence and do this your way"
goto = "solo_mission"
[[rodriguez.choices]]
text = "Put your revolver on his desk - six live rounds - and tell him about the panel in your wall"
goto = "rodriguez_ballistics"
any_items = ["Unfired Revolver"]
any_flags = ["found_service_panel"]

[rodriguez_ballistics]
mood = "calm"
ambience = "city"
text = """
Rodriguez breaks open your revolver with the care of a jeweller and tips the six rounds out onto his blotter. They roll, click together, and lie still. He picks one up, holds it to the lamp, turns it. Then he sniffs the barrel, just like you did.

'Clean,' he says. 'Not fired tonight. Not fired this week.'

You tell him about the service panel, the crawlspace, the bottle that went down two fingers on its own. He writes it all down in a cramped hand, and when you're done he picks up the phone and dials a number from memory.

'Harry? Rodriguez. I need a ballistics man and a print man at the Delmar Building, forty-seventh floor, and I need them to be ours. Nobody from Morrison's shop touches that scene. Yes. Now.'

He hangs up and slides your gun back across the desk, rounds and all.

'Officially, you're a material witness, Jack. Unofficially? You're clean. And Morrison's going to find out by breakfast that his frame just fell apart in my hands.'"""
set_flags = ["name_cleared"]
# ballistics is evidence, and a cleared name takes the city off your back
add = { evidence = 1 }
set = { heat = 0 }
dialogue = [
  { who = "rodriguez", line = "That's the first good news I've had in two years.", mood = "happy" },
  { who = "jack_malone", line = "Don't get used to it. The night's young.", mood = "smirk" },
]
[[rodriguez_ballistics.choices]]
text = "Suit up with Rodriguez's team - do it by the book"
goto = "rodriguez_plan"
[[rodriguez_ballistics.choices]]
text = "Go alone while the frame's still falling apart - Morrison will panic"
goto = "solo_mission"

[rodriguez_plan]
mood = "alert"
ambience = "city"
text = """
Rodriguez works the phones for an hour, chain-smoking, crossing names off a list on a yellow pad. When he's done there are nine names left. Nine cops in a city of four thousand that he'd trust with his life. It isn't many. It's enough.

They gather in the precinct basement, under a bare bulb, around a map of the docks spread on a pool table. Tactical vests. Riot guns. A battering ram somebody liberated from the fire department. You buckle on a vest that's two sizes too big and smells of somebody else's sweat, and for the first time in years you feel like you're on the right side of a door.

'This is it, Jack. We go in hard, we go in clean. Everyone comes out in cuffs or body bags. And when it's done, you're clear.'

Somebody switches off the bulb. In the dark, someone else racks a shotgun."""
dialogue = [
  { who = "jack_malone", line = "Let's finish this.", mood = "angry" },
  { who = "malone_thinking", line = "Nine honest cops and one tired private eye. If Morrison has a man in this basement, we're all dead by dawn.", mood = "afraid" },
]
[[rodriguez_plan.choices]]
text = "Raid Warehouse 47 - the right way"
goto = "rodriguez_raid"
[[rodriguez_plan.choices]]
text = "Slip out before the raid - if there's a leak, you'll go in first and alone"
goto = "solo_mission"

[solo_mission]
mood = "danger"
ambience = "wind"
text = """
You take the evidence and walk out of Rodriguez's office. He doesn't stop you. He doesn't even look up. You both know this is personal now, and personal doesn't fit in a police report.

The cab drops you six blocks from the docks because the driver won't go closer. You walk the rest. The rain has thinned to a fine cold mist that hangs in the air like the city's own breath, and the foghorns out on the water moan back and forth like two old men arguing.

Warehouse 47 looms at the end of Pier 9, a black hulk against the slightly less black sky. A sliver of yellow light under the loading door.

You check your gun one more time. Six bullets. Hopefully enough. The flare pistol is a heavy lump in your coat pocket, an argument you haven't finished having with yourself."""
# off the books again
add = { heat = 1 }
dialogue = [
  { who = "jack_malone", line = "One man against the world. Just how I like it.", mood = "smirk" },
]
[[solo_mission.choices]]
text = "Scout the warehouse first - see who's home"
goto = "warehouse"
[[solo_mission.choices]]
text = "Attack the warehouse - no backup, no plan, just justice"
goto = "solo_warehouse_attack"
[[solo_mission.choices]]
text = "Ring Morrison from the pier call box - tell him his frame just died in Rodriguez's hands, and watch who runs"
goto = "warehouse_wait"
any_flags = ["name_cleared"]

# ---------------------------------------------------------------- the ritz

[theater]
image = "images/theater.svg"
mood = "mystery"
ambience = "silence"
transition = "sweep"
text = """
The Ritz Theater is dark except for the green exit signs, glowing like cat's eyes in a cellar. Rain finds its way through the roof somewhere high above the balcony and falls in a single thin thread into the orchestra pit, ticking on the timpani like a clock.

You walk the aisle by lighter-flame. Velvet seats, threadbare at the arms. The smell of dust, old perfume, and the ghosts of ten thousand cigarettes. Section 47 is up in the balcony, where the cheap seats live. Seat 13 creaks when you lift the cushion.

Underneath: a manila envelope, sealed with a strip of tape and a lipstick kiss.

Inside, documents. Bank transfers. Shipping manifests. Payoffs to the dollar, with dates and signatures. You page through them by the flame and your stomach drops a floor with every page. It isn't just Morrison. It's dozens of cops, three judges, half a city council. And at the centre of the web, in a typed heading on War Department letterhead: PROJECT NIGHTFALL. Military weapons, signed out as destroyed, sold to the highest bidder."""
add_items = ["Nightfall Papers"]
add = { evidence = 1 }
dialogue = [
  { who = "jack_malone", line = "The dame wasn't running from Castellano. She was running from everyone. This is enough to burn the whole city down.", mood = "shocked" },
  { who = "voice_from_darkness", line = "That's exactly right, Mr. Malone.", fx = "heartbeat" },
]
[[theater.choices]]
text = "Spin and draw your gun"
goto = "theater_fight"
[[theater.choices]]
text = "Stay calm - 'Who's there?'"
goto = "theater_reveal"

[theater_fight]
mood = "danger"
sound = "gunshot"
transition = "cut"
fx = "lightning"
text = """
You spin and fire in one motion, the way they taught you, the way you've done in your nightmares a hundred times. The shot is enormous in the empty theater - it slaps off the gilded ceiling and comes back at you from every side.

The figure in the aisle folds up and goes down.

You approach with your gun up, heart going like a riveter. It's not a soldier. Not a mobster. It's a woman in a red evening dress, dark hair spilled across the carpet like ink. One earring has come loose and lies glittering on the step. Her clutch has fallen open, and in the green exit light you see what's inside it: a leather wallet, and pinned to it, a federal badge.

She's still breathing. Not for long. You know that sound. Everyone in your line of work learns that sound eventually."""
# a dead federal agent: the hottest the city gets
add = { heat = 3 }
art = """

                    .38 SNUBNOSE REVOLVER
                    
          ╔═════════════════════════════╗
        ╭─║░░░░░░░░░░░░░░░░░░░░░░░░░░░║─╮
        │ ║ ◌ ◌ ◌ ◌ ◌                  ║ │ (cold steel)
        │ ║░░░░░░░░░░░░░░░░░░░░░░░░░░░║ │
        │ ╰─────────────────────────────╯ │
        │       ╎                         │
        ╰───────╊─────────────────────────╯
                ◇ (safety)
        """
dialogue = [
  { who = "dying_woman", line = "Idiot... I was here... to help you... FBI... investigating... Project Nightfall...", mood = "pained" },
  { who = "jack_malone", line = "Jesus... I didn't know...", mood = "shocked", fx = "chill" },
  { who = "dying_woman", line = "The papers... get them... to Chen...", mood = "afraid" },
  { who = "dying_woman", line = "They'll come... for you... run...", mood = "sad" },
]
[[theater_fight.choices]]
text = "Turn yourself in - it was self defense"
goto = "ending_guilty_conscience"
[[theater_fight.choices]]
text = "Run - you're in too deep now"
goto = "ending_exile"
[[theater_fight.choices]]
text = "Close her eyes. Take the papers to Warehouse 47 and finish what she started."
goto = "warehouse"

[theater_reveal]
mood = "mystery"
ambience = "silence"
text = """
You keep your hands still and your voice steady. 'Who's there?'

A figure steps out of the shadow of a pillar and into the green spill of the exit sign. A woman in a dark grey suit, hair cut in a sharp black bob, a snub-nosed .38 held low and easy like she's been born holding it. Little pearl earrings. Eyes that have read your file and weren't impressed by it.

'Special Agent Sarah Chen. Federal Bureau of Investigation.' She lowers the weapon, but not all the way. 'Mr. Malone. I've been tracking Project Nightfall for two years. The woman in your office was one of my informants. Her name was Valentina Cruz, and she was the bravest bookkeeper I ever met.'

She walks up the aisle and takes the envelope out of your hands, glances at the first page, and gives it back. 'Keep it. Right now you're the only man in this city nobody would believe, which makes you the only man in this city nobody's watching.'

She tucks a plain white card into your breast pocket. A name, a number, nothing else."""
add_items = ["Chen's Card"]
# a federal agent in your corner cools things down
add = { heat = -1 }
dialogue = [
  { who = "chen", line = "They killed her to frame you. Two birds, one stone. You've been making people nervous, asking the wrong questions.", mood = "angry" },
  { who = "chen", line = "You've been busy, Malone. {evidence} solid leads in one night. Most of my agents don't manage that in a month.", mood = "smirk", if = "evidence >= 3" },
  { who = "jack_malone", line = "So what happens now?" },
  { who = "chen", line = "Now we have a choice. You can come in, become a witness, and hope my protection holds. Or we can end this tonight. Warehouse 47. All the players. One final move." },
  { who = "chen", line = "Or you walk out that door with my number and do it your own way. I won't stop you. I might even pick up when you call.", mood = "smirk" },
]
[[theater_reveal.choices]]
text = "Trust the FBI - let them handle it"
goto = "fbi_cooperation"
[[theater_reveal.choices]]
text = "Partner with Chen - end it tonight at the warehouse"
goto = "chen_partnership"
[[theater_reveal.choices]]
text = "Pocket her card and work it your own way - Warehouse 47, alone"
goto = "warehouse"

[fbi_cooperation]
mood = "calm"
ambience = "wind"
text = """
You trust Agent Chen. It feels strange, like wearing someone else's coat. But she has a team, and you have a cracked rib and a dead woman's envelope, and arithmetic is arithmetic.

By four in the morning you're sitting in the back of a bread van parked two piers down from Warehouse 47, wrapped in a grey FBI blanket that smells of mothballs, drinking coffee out of a paper cup while men in windbreakers check their rifles in silence. Radios crackle with clipped call signs. Chen kneels in the open door, studying the warehouse through field glasses, rain beading on her hair.

'You stay in the van,' she says without lowering the glasses. 'You're my witness. Witnesses who get shot don't testify.'

Down on the pier, a door opens and a sliver of yellow light falls across the wet planks. Somebody's coming out for a smoke. Chen raises one hand, and twenty men stop breathing at once."""
dialogue = [
  { who = "chen", line = "When I drop my hand, it starts. Whatever you hear, you stay put.", mood = "angry" },
  { who = "jack_malone", line = "And if it goes wrong?" },
  { who = "chen", line = "Then you'll have the best seat in the house to watch me be wrong.", mood = "smirk" },
]
[[fbi_cooperation.choices]]
text = "Stay in the van like she asked - let the Bureau do its job"
goto = "ending_fbi_victory"
[[fbi_cooperation.choices]]
text = "Talk her into letting you go in with the first team - you know the faces"
goto = "chen_partnership"
