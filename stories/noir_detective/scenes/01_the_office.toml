# THE LAST CASE - Chapter 1: The Office
# 2 AM, forty-seventh floor. A dead woman, a warm gun, and three ways out.

[opening]
image = "images/opening.svg"
mood = "mystery"
text = """
The neon sign outside your window stutters on and off like a bad heart - MALONE INVESTIGATIONS, then nothing, then MALONE INVESTIGATIONS again, painting the office the colour of a fresh wound. It's 2 AM. The rain has been coming down for three days, and it slides down the glass in long grey ropes, as if the whole city is trying to wash its hands.

The dame who walked in an hour ago is lying face-down on your carpet. White dress. A red rose blooming across the back of it, still spreading, slow as gossip. Her shoe has come off. Somehow that's the part you can't stop looking at.

Your gun is in your hand. It's warm.

There's a taste in your mouth like pennies and cheap bourbon, and a hole in your memory you could drive a hearse through. You remember her name - Valentina - and the way she kept glancing at the door. You remember pouring two drinks. After that, the reel snaps.

Somewhere far below, a siren starts its long climb up the scale. In this business, memory is just another luxury you can't afford."""
art = """

