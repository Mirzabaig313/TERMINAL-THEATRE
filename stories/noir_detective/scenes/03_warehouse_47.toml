# THE LAST CASE - Chapter 3: Warehouse 47
# Pier 9. Every thread in the city ties off here. Who you bring - and what you carry - decides how you leave.

[warehouse]
mood = "mystery"
text = """
Warehouse 47 sits at the end of Pier 9 like a rotting tooth in a black gum. Corrugated iron streaked with rust, windows soaped over, a loading door big enough to swallow a truck. The harbour slaps at the pilings underneath with a sound like somebody being patiently, rhythmically slapped awake.

Two guards out front, cigarettes glowing in the rain like the eyes of something that lives under bridges. Tommy guns under their raincoats - you can tell by the way the coats hang.

You work your way along the pier in the shadow of the stacked crates until you're close enough to wipe a clean spot on a grimy window with your sleeve. Inside, under a single swinging lamp: Vincent Castellano. Chief Morrison, bald head shining with sweat. And a third man you don't recognise - straight-backed, grey-haired, standing like the floor owes him money. Military bearing. Cold eyes. The kind of man who's ordered other men to die and slept fine afterwards.

There's a call box at the head of the pier, its little red light winking through the rain. You think about who you could call. You think about who'd come."""
art = """

