text = "Sneak in through the roof - get close and listen"
goto = "warehouse_sneak"
[[warehouse.choices]]
text = "Walk in the front door - surprise is a weapon too"
goto = "warehouse_front"
[[warehouse.choices]]
text = "Wait and follow whoever leaves first"
goto = "warehouse_wait"
[[warehouse.choices]]
text = "Ring Eddie from the call box - 'Pier 9. Bring the old .45.'"
goto = "warehouse_with_eddie"
