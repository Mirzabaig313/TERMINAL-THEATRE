[prologue]
image = "images/prologue.svg"
text = """
Rain hammers the windows of your apartment like bullets seeking flesh. Three AM. The phone screams. You already know what it means.

Another body. Another message. Another step deeper into the labyrinth.

Detective Marcus Kane. Fifteen years on the force. Divorced twice. Once by a woman, once by the department when they put you in Homicide. They said you had a gift for seeing patterns. A gift that feels more like a curse when the patterns lead somewhere you don't want to go.

The voice on the phone is Captain Reeves. Gravel and exhaustion. 'Kane. Pier 19. Get here now. It's... it's like the others.'

You reach for your coat, your gun, and the bottle of scotch that knows your touch better than any lover. Three bodies in three nights. All posed. All positioned. All pointing to something that shouldn't exist in a rational world.

But this city gave up on rationality years ago. Now it just bleeds."""
art = """

    ╔════════════════════════════════════════════════════════════╗
    ║                  3 AM - KANE'S APARTMENT                   ║
    ╚════════════════════════════════════════════════════════════╝
    
