[cross_office]
mood = "calm"
text = """
Dr. Evelyn Cross's office is a shrine to forensic science. Textbooks. Case files. Photographs of crime scenes arranged like a gallery of human darkness.

Her computer is still logged in. She left in a hurry.
Or was taken.

You scan through her recent work. All three victims - she performed the autopsies. She saw the pattern first. And she kept working.

A folder marked 'WESTMORE - SEALED' sits on her desktop. Inside: everything. The original trial. The evidence that disappeared. The witness statements that were recanted. The chemical analysis of Nightshade that was classified.

And a video file. Timestamped three hours ago. Before she died. You click play."""
dialogue = [
  { who = "dr_cross_video", line = "If you're watching this, I'm dead. They got to me. Like they got to Foster and Hartley. We all knew. We all helped bury it. The Nightshade compound. It wasn't a drug. It was a weapon.", mood = "afraid", fx = "glitch" },
  { who = "dr_cross_video", line = "Westmore developed it for the military. Psychological warfare. A compound that rewrites memory, amplifies fear, makes people suggestible. When the trial happened, someone made us all destroy the evidence. Said it was national security.", mood = "sad" },
  { who = "dr_cross_video", line = "But Westmore didn't die. The explosion was staged. He's been operating in the shadows, continuing his research. And now he's killing everyone who helped cover it up. Everyone who knows the truth. Marcus, if you're seeing this - you're next. The seventh sacrifice. Find him. Stop him. Before—", mood = "afraid", fx = "glitch" },
]
[[cross_office.choices]]
text = "The video cut off - someone's here"
goto = "office_ambush"
[[cross_office.choices]]
text = "Grab the files and run - you're exposed"
goto = "escape_office"

[sarah_arrives]
text = """
Sarah Vega arrives in twenty minutes. She's brought coffee and ammunition. Both essential. Together, you review what you know.

'Seven victims. Seven tarot cards. Seven sacrifices,' Sarah says. 'This is ritualistic. But it's also revenge. Westmore is killing everyone who helped destroy his life's work.'

'But he's already dead,' you counter. 'The yacht explosion was confirmed. DNA, dental records, everything.'

'Everything except a body. The explosion was hot enough to destroy identification. Maybe the DNA was planted. Maybe we saw what someone wanted us to see.'

She pulls out a photograph. Alexander Westmore, five years ago. Brilliant. Wealthy. Dangerous. And beside him in the photo: a woman. Raven-haired. Green eyes. Beautiful and terrible.

'His partner,' Sarah says. 'Dr. Cassandra Westmore. She disappeared the same night as the explosion. No body. No trace.'"""
set_flags = ["sarah_partnered"]
dialogue = [
  { who = "kane", line = "Cassandra Westmore. The wife?", mood = "shocked" },
  { who = "sarah", line = "More than that. The brilliant one. Alexander had the money, the vision. She had the genius. If anyone could continue the research, weaponize Nightshade, and orchestrate this—" },
  { who = "kane", line = "Then we're not looking for a dead man. We're looking for a woman with nothing to lose and everything to avenge.", mood = "angry" },
  { who = "sarah", line = "You told me all of it. Over the phone, before I even asked. Six years and you never once did that. Don't stop now.", mood = "happy", if = "flag('told_sarah_everything') && sarah_trust >= 3" },
  { who = "sarah", line = "One more thing. You called that number on the card, didn't you? I can smell it on you. Next time you call me first.", mood = "angry", if = "flag('contacted_killer')" },
]
[[sarah_arrives.choices]]
text = "Head to Pier 19 together - safety in numbers"
goto = "pier_nineteen_with_sarah"
add = { sarah_trust = 1 }
[[sarah_arrives.choices]]
text = "Split up - you take the pier, Sarah investigates Ouroboros"
goto = "split_investigation"
add = { sarah_trust = -1 }

[prometheus_research]
mood = "alert"
text = """
Prometheus Industries. The paper trail leads through shell companies, offshore accounts, and classified government contracts.

The deep dive takes hours. Coffee goes cold. Your eyes burn. But patterns emerge like stars through fog.

Prometheus developed Nightshade under military contract. Psychological operations. A way to make enemy combatants compliant, suggestible. But the side effects were catastrophic. Psychosis. Violence. Suicide.

When the trial went public, someone buried everything. The military. The DOD. Three-letter agencies whose names you can only guess at.

But Alexander Westmore refused to stop. He believed the research was too important. Too revolutionary. He continued in secret.

And when they came for him, he faked his death.

The yacht explosion was the perfect cover. DNA evidence from a purchased corpse. Dental records altered by a complicit medical examiner. The examiner's name: Dr. Evelyn Cross.

Who's now body number three."""
dialogue = [
  { who = "kane_thinking", line = "Cross helped him fake his death. Now he's killing her. Why? Revenge? Tying up loose ends? Or something else?" },
  { who = "kane_thinking", line = "Seven victims. Seven cards. The Major Arcana tells a story. The Fool's Journey. Death and rebirth. Transformation. Westmore isn't just killing. He's performing a ritual. But to what end?", mood = "afraid" },
]
[[prometheus_research.choices]]
text = "Enough research - get to the pier"
goto = "pier_nineteen"
[[prometheus_research.choices]]
text = "Dig deeper into the yacht explosion"
goto = "yacht_explosion"

[yacht_explosion]
mood = "danger"
text = """
The Coast Guard report is clinical. Explosion at 2:47 AM. Fire hot enough to melt steel. Body recovered - charred beyond recognition.

But there's a supplemental report. An addendum filed months later by an investigator named James Tolliver. He noted inconsistencies.

The explosion pattern suggested military-grade accelerants. The dental records were verified by a single examiner - Dr. Cross. And the DNA sample was processed at a private lab.
A lab owned by Ouroboros Pharmaceuticals.

Tolliver recommended further investigation.
His recommendation was denied. He was reassigned. 
Two months later, he died of an apparent heart attack.

He was thirty-four years old and in perfect health.

You look up James Tolliver's death certificate. Cause of death: acute myocardial infarction. Signed by: Dr. Evelyn Cross."""
dialogue = [
  { who = "kane_thinking", line = "Tolliver got too close. They killed him and made it look natural. Cross covered it up. Another name on the list. Another sin to atone for.", mood = "angry" },
  { who = "kane_thinking", line = "But seven victims. Tolliver would be eight. Unless... unless he's already been counted. The pattern includes past kills. This isn't the beginning. It's the finale.", mood = "shocked" },
]
[[yacht_explosion.choices]]
text = "Find out if Tolliver's body can be exhumed"
goto = "exhume_tolliver"
[[yacht_explosion.choices]]
text = "This is getting too deep - call Sarah"
goto = "call_sarah"
add = { sarah_trust = 1 }
[[yacht_explosion.choices]]
text = "Get to the pier before victim four appears"
goto = "pier_nineteen"

[call_killer]
mood = "danger"
text = """
You dial the number. It rings once. Twice.

A voice answers. Female. Cultured. Amused.

'Detective Kane. Right on schedule. You've always been predictable. That's why you're still alive. You follow the breadcrumbs exactly where I want you to go.'

You recognize the voice from somewhere. A memory like smoke."""
set_flags = ["contacted_killer"]
dialogue = [
  { who = "kane", line = "Who is this?", mood = "angry" },
  { who = "voice", line = "Someone who died five years ago. Someone you helped bury. Not literally, of course. You weren't part of the coverup. You were just... collateral damage. Like everyone else.", fx = "glitch" },
  { who = "kane", line = "Cassandra Westmore.", mood = "shocked" },
  { who = "cassandra", line = "Very good, Detective. Yes. Cassandra. The dead woman walking. The ghost in your city's machine. Do you like my work? The tableau? The symbolism?", mood = "smirk" },
  { who = "kane", line = "You're killing innocent people.", mood = "angry" },
  { who = "cassandra", line = "Innocent? Foster hid evidence. Hartley threw the trial. Cross faked my husband's death and then helped cover up the murder of James Tolliver. Innocent is a word that lost meaning years ago. But you... you're different. You weren't part of it. That's why you get to be the finale.", mood = "smirk" },
]
[[call_killer.choices]]
text = "'I'm coming for you' - make it personal"
goto = "threat_cassandra"
add = { lines_crossed = 1 }
[[call_killer.choices]]
text = "'Why the theatrics? Why not just vanish?' - keep her talking"
goto = "question_cassandra"
[[call_killer.choices]]
text = "Trace the call - have tech lock her location"
goto = "trace_cassandra"

[tech_trace]
text = """
The tech team swarms the number. Within minutes they have a location. A cell tower in the warehouse district. Near the old Prometheus facility.

But it's a burner phone. And by the time the trace completes, the signal is dead. She knew. She expected this.

Captain Reeves orders a SWAT team to the location. You gear up. This ends tonight. One way or another."""
dialogue = [
  { who = "reeves", line = "Kane. You're not going in first. We do this by the book. SWAT clears the building, then we investigate.", mood = "angry" },
  { who = "kane", line = "Captain, she's playing a game. If we follow procedure, she wins. She's always three moves ahead.", mood = "angry" },
  { who = "reeves", line = "And if you go in alone, you're dead. Your choice, Detective. Follow orders or turn in your badge.", mood = "angry" },
  { who = "reeves", line = "And don't think I don't know you dialed that number against a direct order. One more stunt tonight and I'll take the badge myself.", mood = "angry", if = "lines_crossed >= 1" },
]
[[tech_trace.choices]]
text = "Follow orders - wait for SWAT"
goto = "swat_raid"
[[tech_trace.choices]]
text = "Turn in your badge - do this your way"
goto = "go_rogue"
add = { lines_crossed = 1 }

[card_research]
mood = "alert"
text = """
The tarot deck is custom. Hand-painted. You trace it to a specialist in the art district. An old woman named Madame Zora who deals in occult supplies and doesn't ask questions.

'Oh yes,' she says when you show her a photograph of the card. 'Beautiful work. I sold that deck six months ago. Custom commission. Full Major Arcana. Twenty-two cards. Beautiful woman. Paid in cash.'

'Can you describe her?'

'Black hair. Green eyes. Moved like a dancer. Or a killer. Hard to tell the difference sometimes. She had... presence. Like she was more real than the rest of us. Gave me the shivers, truth be told.'"""
dialogue = [
  { who = "kane", line = "Did she say what she needed them for?" },
  { who = "madame_zora", line = "Said she was telling a story. A tragedy in seven acts. About sacrifice and transformation. About paying debts written in blood. I thought she was being poetic. Artists usually are.", mood = "smirk" },
  { who = "kane", line = "Did she leave a name?" },
  { who = "madame_zora", line = "Called herself Cassandra. Like the prophet. The one who saw the future but no one believed. Fitting, no?", mood = "smirk" },
]
[[card_research.choices]]
text = "Ask if she's been back - maybe she'll return"
goto = "stake_out_shop"
[[card_research.choices]]
text = "That's all you need - head to the warehouse district"
goto = "warehouse_district_early"

[meet_elias]
text = """
The private room at the top of the Crimson Hour is decorated in themes of mortality. Baroque paintings of death. Sculptures of endings.

A man sits at a desk carved from black wood. Mid-fifties. Silver hair. Eyes like a shark's - flat, cold, measuring. He's reading a book. You catch the title: 'The Alchemical Wedding.'

'Detective Kane. Please, sit. Would you like a drink? I recommend the absinthe. Traditional preparation. It helps with... clarity.'

Elias closes his book with deliberate care."""
art = """

    ╔════════════════════════════════════════════════════════════╗
    ║                    LIQUID COURAGE                          ║
    ╚════════════════════════════════════════════════════════════╝
    
                          ╱▔▔▔▔▔╲
                         │       │
                         │       │
                        │  ░▒▒░  │
                        │  ▒▒▒▒  │
                         │ ▒▒▒▒ │
                          ╲▁▁▁▁╱
                          ▕████▏
                           ▔▔▔▔
    
                    [Some nights require help]
    """
dialogue = [
  { who = "elias", line = "You're investigating murders you don't understand. Three so far. Four more to come. Seven in total. A complete cycle.", mood = "smirk" },
  { who = "kane", line = "You seem to know a lot about it.", mood = "smirk" },
  { who = "elias", line = "I know everything that happens in this city after dark. It's my business to know. The Crimson Hour isn't just a club, Detective. It's a sanctuary. For those who understand that transformation requires sacrifice.", mood = "smirk" },
  { who = "kane", line = "You're talking about Cassandra Westmore." },
  { who = "elias", line = "I'm talking about someone who understands the old truths. That death is change. That justice requires blood. That some debts can only be paid in the currency of life itself." },
  { who = "kane", line = "You're protecting her.", mood = "angry" },
  { who = "elias", line = "I'm providing context. Cassandra comes here sometimes. For solace. For community. We share certain... philosophies. But her work is her own. I merely appreciate its artistry.", mood = "smirk" },
]
[[meet_elias.choices]]
text = "Arrest Elias as an accessory - bring him in"
goto = "arrest_elias"
[[meet_elias.choices]]
text = "Play along - pretend to be interested in his philosophy"
goto = "philosophy_game"
[[meet_elias.choices]]
text = "Threaten him - make him give up Cassandra's location"
goto = "threaten_elias"
add = { lines_crossed = 1 }

[question_selene]
text = """
You keep Selene in public view. Smart. But she doesn't seem concerned.

'Questions, Detective? Ask. I have nothing to hide. Unlike most who pass through these doors.'

Around you, the beautiful people circulate. None of them seem to notice a police interrogation happening. Or maybe they just don't care."""
dialogue = [
  { who = "kane", line = "How do you know Cassandra Westmore?" },
  { who = "selene", line = "We all know Cassandra. She's a legend here. A woman who died and came back changed. Refined by fire. Clarified by loss.", mood = "happy" },
  { who = "kane", line = "She's a murderer.", mood = "angry" },
  { who = "selene", line = "She's an artist. She's a philosopher. She's someone who understands that conventional morality is a cage we build to feel safe. But safety is an illusion, Detective. Everyone dies. Cassandra just decides who, when, and how.", mood = "smirk" },
  { who = "kane", line = "When did you last see her?" },
  { who = "selene", line = "Tonight. She was here two hours ago. Right before you arrived. She said you'd come. She says you're important. The final piece.", mood = "smirk" },
]
[[question_selene.choices]]
text = "She's still here - search the building"
goto = "search_crimson_hour"
[[question_selene.choices]]
text = "Where did she go? - follow the trail"
goto = "follow_cassandra_from_club"

[arrest_selene]
text = """
You pull your weapon and badge. 'Selene, you're under arrest as a material witness. You have the right—'

The room erupts. Not in panic. In laughter.

Selene smiles. 'Oh, Detective. How wonderfully theatrical. But you're not in a police station. You're in our world now. And here, your badge means nothing.'

The beautiful people close in. Not threatening. Just... present. Between you and the exit. You're outnumbered. Outflanked."""
set_flags = ["arrested_selene"]
dialogue = [
  { who = "selene", line = "You can leave anytime you want, Detective. Just walk away. But if you insist on this arrest... well. Things might get complicated. And you strike me as someone who prefers simple solutions to messy problems.", mood = "smirk" },
]
[[arrest_selene.choices]]
text = "Stand your ground - call for backup"
goto = "call_backup_club"
[[arrest_selene.choices]]
text = "Tactical retreat - you're outgunned"
goto = "retreat_from_club"
[[arrest_selene.choices]]
text = "Draw your weapon - make them take you seriously"
goto = "shootout_club"
add = { lines_crossed = 2 }
