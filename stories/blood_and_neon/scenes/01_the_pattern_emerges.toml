dialogue = [
  { who = "kane", line = "Latin. 'Tertius ex septem.' Third of seven.", mood = "sad" },
  { who = "reeves", line = "Jesus. You're saying there are four more coming?", mood = "shocked" },
  { who = "kane", line = "I'm saying someone's working through a sequence. Tarot. Latin. Ritual positioning. This is structured. Practiced. And we're only seeing Act One.", mood = "angry" },
