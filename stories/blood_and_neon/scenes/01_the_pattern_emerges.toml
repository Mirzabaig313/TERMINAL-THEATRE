dialogue = [
  { who = "kane", line = "You know my name.", mood = "shocked" },
  { who = "woman", line = "We know many things. Names. Secrets. Desires. It's our business to know. I'm Selene. And you're investigating deaths you don't understand. Not yet.", mood = "smirk" },
  { who = "kane", line = "Three murders. Same MO. Same ritual. Business card led me here." },
  { who = "selene", line = "Murders. Such a crude word. Let's call them... transformations. Come. Elias is waiting. And Elias hates to be kept waiting.", mood = "smirk" },
]
[[crimson_hour_club.choices]]
text = "Follow Selene upstairs - walk into the trap with eyes open"
goto = "meet_elias"
