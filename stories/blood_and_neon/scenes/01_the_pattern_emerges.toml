    ╚════════════════════════════════════════════════════════════╝
    
             [Rain hammers the glass like accusations]
    """
dialogue = [
  { who = "marcus_kane", line = "Three nights. Three bodies. This isn't random anymore. If it ever was.", mood = "sad" },
  { who = "kane_thinking", line = "The first was a lawyer. Found in an alley, arranged like he was praying. The second, a judge. Positioned as if offering something. Now a third. The pattern tightens like a noose.", mood = "afraid" },
]
[[prologue.choices]]
text = "Drive to Pier 19 - face whatever's waiting"
goto = "pier_nineteen"
[[prologue.choices]]
text = "Call your old partner first - you need someone you trust"
goto = "call_sarah"
add = { sarah_trust = 1 }
[[prologue.choices]]
text = "Review the case files one more time - you're missing something"
goto = "review_files"

[pier_nineteen]
image = "images/pier_nineteen.svg"
text = """
The pier stretches into darkness like a dead man's finger pointing at eternity. Police lights strobe the scene in arterial reds and blues. The rain mixes with seawater, washing away evidence, washing away truth.

The body lies at the end of the pier. Dr. Evelyn Cross. Forensic pathologist. You know her. Knew her. Past tense comes too easily in this business.

She's arranged in the same ritualistic pose as the others - on her knees, arms outstretched, head tilted back as if receiving benediction from a god who forgot mercy. Her throat has been cut with surgical precision. Between her hands: a playing card. The Queen of Swords.

The first body held the King of Cups. The second, the Knight of Wands. Tarot. Someone's telling a story in blood and symbolism.

Captain Reeves stands nearby, smoking despite the rain.
'Kane. Thank Christ. Look at her hands. There's something written there.'"""
art = """

    ╔════════════════════════════════════════════════════════════╗
    ║                    PIER 19 - 3:00 AM                       ║
    ╚════════════════════════════════════════════════════════════╝
    
