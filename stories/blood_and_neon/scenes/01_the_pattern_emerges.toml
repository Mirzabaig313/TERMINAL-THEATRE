[call_sarah]
text = """
Sarah Vega. Your partner for six years before she made Lieutenant and you made a career of burning bridges. She answers on the second ring.

'Marcus. I heard about the pier. You okay?'

Her voice carries concern and caution in equal measure. You have history - the kind that saves lives and complicates everything else."""
dialogue = [
  { who = "kane", line = "Define okay. Three bodies, Sarah. All connected. All performing some kind of ritual sequence.", mood = "pained" },
  { who = "sarah", line = "Tarot. I've been reading the case files. Someone's recreating the Major Arcana. But why these specific people?" },
  { who = "kane", line = "Lawyer. Judge. Pathologist. They're all connected to the Foster trial five years ago. The one where—" },
  { who = "sarah", line = "Where the evidence disappeared and the suspect walked. Marcus, that case was sealed. Classified. Someone high up buried it deep.", mood = "afraid" },
  { who = "kane", line = "And now someone's digging it back up. In blood.", mood = "angry" },
  { who = "sarah", line = "And Marcus? Reeves called me before you did. Said you've been working this case like a man with no badge to lose.", mood = "angry", if = "lines_crossed >= 2" },
  { who = "sarah", line = "I'm coming in. Don't go to the pier alone.", mood = "afraid" },
]
[[call_sarah.choices]]
text = "Tell her everything you've found so far - then wait for her"
goto = "sarah_arrives"
if = "item('Queen of Swords') || item('Tolliver Sample') || item('Yacht Photograph')"
add = { sarah_trust = 2 }
set_flags = ["told_sarah_everything"]
[[call_sarah.choices]]
text = "Wait for Sarah - you work better together"
goto = "sarah_arrives"
add = { sarah_trust = 1 }
[[call_sarah.choices]]
text = "Can't wait - head to Pier 19 now"
goto = "pier_nineteen"
add = { sarah_trust = -1 }

[review_files]
text = """
Your apartment walls are a conspiracy theorist's fever dream. Photographs. Police reports. Newspaper clippings. Red string connecting the dots in patterns only you can see. Or maybe only you want to see.

Body One: Marcus Foster, defense attorney. Found in Mercy Alley. King of Cups. 'Primus ex septem' - First of seven.

Body Two: Judge Ellen Hartley. Found in Courthouse Square. Knight of Wands. 'Secundus ex septem' - Second of seven.

Both connected to the Westmore case. Five years ago. A pharmaceutical exec accused of manufacturing a designer drug called 'Nightshade.' Foster defended him. Hartley presided. The evidence vanished. Westmore walked. Three months later, Westmore died in a yacht explosion.

Or did he?

You pull out a photograph you've kept hidden even from yourself. Alexander Westmore. Standing in front of his company, Prometheus Industries. Behind him, barely visible in the glass reflection: a symbol. An ouroboros. A snake eating its tail.

The same symbol carved into the palm of every victim."""
dialogue = [
  { who = "kane_thinking", line = "Westmore. The case everyone wanted buried. But dead men don't kill. Unless... unless Westmore never died. Unless the explosion was staged.", mood = "shocked" },
  { who = "kane_thinking", line = "Prometheus Industries. Greek mythology. The titan who stole fire from the gods. Who gave knowledge to humanity. Who was punished eternally. Seven victims. Seven sins? Seven sacrifices?" },
]
[[review_files.choices]]
text = "Deep dive into Prometheus Industries - follow the money"
goto = "prometheus_research"
[[review_files.choices]]
text = "The yacht explosion - get the original reports"
goto = "yacht_explosion"
[[review_files.choices]]
text = "Enough theory - get to Pier 19"
goto = "pier_nineteen"

[examine_card]
image = "images/examine_card.svg"
text = """
The Queen of Swords. In tarot, she represents clarity through pain, truth through loss. Someone who has suffered and emerged with wisdom.

The card is expensive. Hand-painted. Not a mass-market deck. On the back, in silver ink almost invisible: a phone number.

You copy it down. The card itself is clean - no prints except Dr. Cross's. Which means it was placed there after death, pressed into her already cooling hands. The killer wants you to find it. Wants you to call.

This is a game. And you're a player whether you want to be or not."""
set_flags = ["examined_tarot_card"]
add_items = ["Queen of Swords"]
dialogue = [
  { who = "kane", line = "Captain. The card has a number on it." },
  { who = "reeves", line = "Don't even think about calling it, Kane. We'll trace it, bring in the tech team—", mood = "angry" },
  { who = "kane", line = "By which time four more people are dead. This killer is on a schedule. We're already three steps behind.", mood = "angry" },
]
[[examine_card.choices]]
text = "Call the number now - take the bait"
goto = "call_killer"
add = { lines_crossed = 1 }
[[examine_card.choices]]
text = "Wait for the tech trace - do this right"
goto = "tech_trace"
[[examine_card.choices]]
text = "Research the card deck instead - find the source"
goto = "card_research"

[question_forensics]
text = """
The forensic tech is young. Too young for this much death. Her name is Riley Chen. She's seen the pattern too.

'Detective, the cuts are identical on all three victims. Same blade, same angle, same depth. Whoever this is, they're trained. Medical background, maybe military. The precision is... artistic.'

She pulls out her tablet, shows you overlays of the wounds. 'But that's not the weird part. Look at the trace elements in the wounds. Residue. Chemical compound I've never seen. Dr. Cross was analyzing it before she... before tonight.'

She hands you a file. Dr. Cross's last report. Her handwriting shaky: 'Compound matches samples from Westmore trial. Nightshade derivative. But enhanced. Weaponized. Someone continued the research. Someone—'

The report ends there. Unfinished, like her life."""
dialogue = [
  { who = "kane", line = "Riley. This compound. Where would someone synthesize it?" },
  { who = "riley", line = "High-end lab. Pharmaceutical grade equipment. Or... or someone with access to a place like Prometheus Industries.", mood = "afraid" },
  { who = "kane", line = "Prometheus. The company Westmore owned.", mood = "shocked" },
  { who = "riley", line = "Owned. Past tense. After he died, the company was bought out. Restructured. New name. But same facility, same research division." },
  { who = "kane", line = "New name?" },
  { who = "riley", line = "Ouroboros Pharmaceuticals.", mood = "afraid" },
]
[[question_forensics.choices]]
text = "Investigate Ouroboros Pharmaceuticals immediately"
goto = "ouroboros_pharma"
[[question_forensics.choices]]
text = "First, visit 'The Crimson Hour' club - the card lead"
goto = "crimson_hour_club"
[[question_forensics.choices]]
text = "Search Dr. Cross's office for more research"
goto = "cross_office"

[crimson_hour_club]
image = "images/crimson_hour_club.svg"
mood = "mystery"
text = """
The Crimson Hour sits in the meat-packing district like a jewel in a wound. No sign outside. Just a red door and a doorman built like mythology.

Inside: velvet darkness punctuated by candles that burn red. The air tastes of jasmine and secrets. Beautiful people move through the space like sharks through deep water - elegant, dangerous, always circling.

The music is low, hypnotic. Quarter tones and dissonance that shouldn't work but somehow does. Like everything else in this place.

A woman approaches. She moves like smoke given form. Hair black as sin, eyes green as envy. She's wearing a dress that costs more than your car.

'Detective Kane. We've been expecting you. Please. The proprietor would like a word. Upstairs.'"""
