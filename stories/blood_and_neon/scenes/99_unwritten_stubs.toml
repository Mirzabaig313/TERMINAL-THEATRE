[final_location]
mood = "mystery"
text = """
Bellweather Marina. Slip Seven. The boathouse sits on pilings over black water, its windows painted over from the inside. The door gives to the brass key, or to your shoulder, whichever you brought.

Inside, it's a shrine. Alexander Westmore's lab coat hangs on a hook by the door as if he just stepped out. Photographs of a laughing man on a sunlit deck. And on every other surface, five years of a widow's work: stolen memos, bank transfers, surveillance photos, transcripts, all of it indexed and boxed and labeled in a neat, patient hand. FOR THE TRIAL THAT NEVER HAPPENED.

On a reel projector, a strip of marina security footage, five years old. You crank it by hand. Men in dark windbreakers on the yacht's stern at 1 AM, swapping a canister. On the dock, supervising, a silver-haired man in a long coat. Someone has labeled the frame in silver ink: COL. ELIAS VANE. The man who signs nothing, caught signing with his own two hands.

On top of the last box, an envelope with your name on it. Inside: 'Now you've seen it. Bring it, or don't. Come to where the fire was stolen. C.'"""
set_flags = ["elias_exposed", "archive_found"]
add_items = ["Lethe Archive"]
dialogue = [
  { who = "kane_thinking", line = "Everything. Every lie they told, every dollar they paid, every man who carried a canister. She had enough to hang them all five years ago.", mood = "shocked" },
  { who = "kane_thinking", line = "And no one would take it. No court, no paper, no cop. So she stopped asking for a trial and started holding one.", mood = "sad" },
  { who = "kane", line = "You didn't want them dead, Cassandra. You wanted them seen.", mood = "sad" },
]
[[final_location.choices]]
text = "Take the archive to Prometheus - make her see that you've seen it"
goto = "prometheus_facility"
[[final_location.choices]]
text = "Leave it - go with nothing but your gun"
goto = "final_confrontation"

[cassandra_associates]
mood = "noir"
text = """
No badge means no warrants, no backup, no rules. It also means nobody's watching what you do. You work it backward the way you were taught before they taught you procedure.

Madame Zora gives you a name for the woman who picked up the last card: Selene. The Crimson Hour's hostess. A bartender who owes you from a long time ago gives you where Selene eats when the club closes. A twenty-four-hour diner under the expressway, chrome and cracked vinyl and coffee like motor oil.

She's in the back booth at 5 AM, eating pie with a fork held in perfect fingers. She doesn't look surprised to see you. Nobody connected to Cassandra ever looks surprised."""
set_flags = ["elias_exposed", "selene_turned"]
add_items = ["Boathouse Key"]
dialogue = [
  { who = "selene", line = "No badge, Detective? It suits you. You look like a man again instead of a department.", mood = "smirk" },
  { who = "kane", line = "Tell me about Cassandra's people. Who protects her. Who she's protecting." },
  { who = "selene", line = "I was Alexander's chemist. I tested Nightshade on myself when the volunteers ran out. And the man I work for, Elias, is Colonel Elias Vane. He ordered the charge on that yacht switched.", mood = "sad" },
  { who = "kane", line = "And you serve him drinks.", mood = "smirk" },
  { who = "selene", line = "I serve her. Here. The key to the old Westmore boathouse. Slip Seven. Everything she's gathered is there. See it before you decide what she is.", mood = "sad" },
]
[[cassandra_associates.choices]]
text = "Use the key - go to Slip Seven"
goto = "final_location"
[[cassandra_associates.choices]]
text = "Go for Vane himself at the Crimson Hour"
goto = "crimson_hour_club"

# ─────────────────────────────────────────────────────────────
#  DR. MARSH
# ─────────────────────────────────────────────────────────────

[marsh_evidence]
mood = "alert"
text = """
Dr. Marsh crosses to a painting behind her desk, a Rothko that's probably real, and swings it out on a hinge. Behind it, a safe. Behind the safe's door, a leather ledger and a hard drive the size of a cigarette pack.

'Five years of insurance,' she says. 'Every payment. Every order. Every meeting I was told to forget.'

You flip the ledger open. Project LETHE. Payments to Foster, Hartley, both Crosses. A line item, five years old: 'Marine charge, modified. Bellweather. Authorized.' And on every page, the same authorizing officer. Col. Elias Vane, DOD Office of Special Programs.

Then she opens her desk drawer and sets a tarot card on the blotter. The Hierophant. Written across it, in her own dried blood: Quintus ex septem."""
set_flags = ["elias_exposed"]
add_items = ["Marsh Ledger"]
add = { cards = 1 }
dialogue = [
  { who = "dr_marsh", line = "Vane told us the yacht would be staged. Smoke and an empty cabin. I learned it wasn't from the evening news, like everyone else.", mood = "sad" },
  { who = "kane", line = "Where's Vane now?" },
  { who = "dr_marsh", line = "Retired, officially. He runs a nightclub and calls himself Elias. He keeps Cassandra close. He thinks she's his weapon. He thinks she doesn't know." },
  { who = "dr_marsh", line = "She cut my hand while I slept and left this. Three days, she said. Help me, Detective. I'll testify to all of it. Just don't let her make me a card on a wall.", mood = "afraid" },
  { who = "kane_thinking", line = "Fifth of seven. And the man who started all of it is still pouring absinthe across town." },
]
[[marsh_evidence.choices]]
text = "Put Marsh in protective custody - use the system"
goto = "protective_custody"
[[marsh_evidence.choices]]
text = "Hide Marsh yourself - you trust no one"
goto = "hide_marsh"
[[marsh_evidence.choices]]
text = "Use Marsh as bait - trap Cassandra"
goto = "marsh_bait"
add = { lines_crossed = 1 }

[protective_custody]
mood = "alert"
text = """
Reeves arranges it fast. The Harbor View Hotel, fourteenth floor. Two uniformed officers on the door, you in the adjoining room with the connecting door cracked an inch. Marsh sits on the bed in her expensive suit, fully dressed, not even pretending she'll sleep.

At 3:10 AM, a knock. Two men in dark suits with federal identification and paperwork so perfect it gleams. 'Department of Justice. Dr. Marsh is being transferred to a federal facility. For her own safety.'

The officers on the door look at you. Marsh looks at the taller man, and every drop of color leaves her face."""
dialogue = [
  { who = "reeves", line = "Kane, I checked. The order's signed by a federal judge. It's legal. I can't stop it, and neither can you.", mood = "pained" },
  { who = "reeves", line = "And don't you dare. I know that look. You've been breaking things all week, and this is the one thing that would actually put you in a cell.", mood = "afraid", if = "lines_crossed >= 3" },
  { who = "dr_marsh", line = "Detective. The tall one. He was on the marina that night. He carried the charge onto Alexander's boat.", mood = "afraid" },
  { who = "kane_thinking", line = "Legal. Perfect paperwork. The same perfect paperwork that buried Tolliver and burned a man alive.", mood = "angry" },
]
[[protective_custody.choices]]
text = "Let the transfer go through - it's legal"
goto = "custody_ending"
[[protective_custody.choices]]
text = "Draw on the feds and take Marsh down the service stairs"
goto = "hide_marsh"
add = { lines_crossed = 2 }

[custody_ending]
mood = "noir"
text = """
You step aside. The law is the law, and you're a cop. That has to mean something. Marsh doesn't scream. She just looks at you as they lead her out, and that's worse.

The transport van never reaches the federal facility. A single-vehicle accident on the river road. The driver walks away. Dr. Helena Marsh is pronounced dead at the scene. Cardiac arrest. She was in perfect health.

The ledger and the hard drive disappear into federal evidence. A tarot card is found on the body, the Hierophant, and the papers blame the tarot killer. Cassandra Westmore becomes the most wanted woman in America for a murder she didn't commit.

She calls you once, a week later. You don't trace it.

'You handed her to them, Marcus. Now you know what I learned five years ago. The system doesn't fail. It works exactly as designed.'

ENDING: THE SYSTEM PROVIDES"""
ending = true

[hide_marsh]
mood = "noir"
text = """
You get Marsh out the hard way and drive until the city is just a glow in the rearview. The Starlite Motel on Route 9. Cash. A room facing the empty pool. The sign outside buzzes VACANCY in a pink that flickers like a dying pulse.

Marsh talks because she can't stop. She synthesized the dose that killed Tolliver. She signed off on the DNA swap after the yacht. She kept every receipt because she always knew this day would come.

At 4 AM you step out for ice. When you come back, Cassandra is sitting in the chair in the corner, legs crossed, hands empty in her lap. Marsh is pressed against the headboard, shaking. Nobody is dead. Yet.

Cassandra doesn't look at you. She looks at Marsh. And she asks one question, very gently."""
set_flags = ["marsh_confessed", "cassandra_humanized", "elias_exposed"]
add_items = ["Marsh Confession"]
dialogue = [
  { who = "cassandra", line = "Did he scream, Helena? When Vane's charge went off. You were on the radio. Did Alexander scream?", mood = "sad" },
  { who = "dr_marsh", line = "Yes. For a long time. Vane made us listen. He said it was so we'd understand what silence was worth.", mood = "pained" },
  { who = "kane", line = "I'm recording this, Cassandra. Every word. That's a confession. That's a witness." },
  { who = "cassandra", line = "Then that's all I needed from her. Someone who'd say it out loud, to someone who'd keep it.", mood = "pained" },
  { who = "cassandra", line = "Prometheus. Midnight. Bring her words, Marcus. Let's see if they're enough." },
]
[[hide_marsh.choices]]
text = "Take Marsh's confession to Prometheus"
goto = "prometheus_facility"
[[hide_marsh.choices]]
text = "Follow her into the rain - don't let her set the stage"
goto = "final_confrontation"

[marsh_bait]
mood = "danger"
text = """
The Ouroboros penthouse is lit like an aquarium. Marsh sits at her desk where anyone with a rifle scope could see her. You crouch in the dark conference room next door with your gun in your lap and the city glittering beneath you like spilled jewelry.

At 2:14 AM the elevator chimes. Not Cassandra. Three men in black tactical gear, suppressed rifles, moving in a tight professional stack. The lead man carries a tarot card in his gloved hand. A Hierophant. They're not here to stop the tarot killer. They're here to be her.

Then the lights die. In the green glow of the exit signs, something moves behind the third man. He drops without a sound, a syringe standing out of his neck.

Cassandra was already in the building. She was always already in the building."""
dialogue = [
  { who = "kane", line = "Police! Drop the weapons!", mood = "angry", fx = "flash" },
  { who = "cassandra", line = "You baited a trap for me, Marcus. Look what crawled in instead.", mood = "smirk", fx = "shake" },
  { who = "dr_marsh", line = "Those are Vane's men! He's cleaning house! He's cleaning all of us!", mood = "afraid" },
  { who = "kane_thinking", line = "Two shooters left. One killer beside me with a needle. For the next sixty seconds, she's the only one in this room not trying to kill me." },
]
[[marsh_bait.choices]]
text = "Fight beside Cassandra - then follow her out"
goto = "prometheus_facility"
add = { lines_crossed = 1 }
[[marsh_bait.choices]]
text = "Grab Marsh and run while the monsters fight"
goto = "hide_marsh"

# ─────────────────────────────────────────────────────────────
#  WHERE THE FIRE WAS STOLEN
# ─────────────────────────────────────────────────────────────

[prometheus_facility]
image = "images/prometheus_facility.svg"
mood = "danger"
text = """
The old Prometheus Industries plant rises out of the rain like a tombstone for an idea. Twelve stories of black glass and rust. Over the gate, the company logo still hangs: a titan holding a torch, half its neon tubes dead, so he seems to be burning. At the curb, a black town car idles with its driver's door open and nobody inside.

The emergency lights are on. Someone has been paying the power bill. A trail of red candles leads down the main corridor, past laboratories where cages still hold the small white bones of test animals.

In the decontamination chamber off the main hall, behind thick glass, a man kneels with a black hood over his head. His wrists are zip-tied to a drain grate. Pinned to his silk shirt: the Devil. Sextus ex septem. He's breathing. Murmuring. Praying, maybe. Or giving orders to soldiers who aren't there.

At the end of the corridor, the doors of the central laboratory stand open, and amber light spills out across the floor. Over the old PA, crackling with five years of dust, comes a voice you know."""
dialogue = [
  { who = "cassandra", line = "Welcome home, Marcus. Well. My home. The place where my husband stole fire from the gods, and the gods sent soldiers.", fx = "glitch" },
  { who = "kane", line = "Who's in the glass, Cassandra?" },
  { who = "cassandra", line = "The sixth card. You'll understand him once you understand me. Come in. Bring whatever you've found. I'd love to see it.", mood = "smirk" },
  { who = "kane_thinking", line = "Every path in this city has been leading here. Whatever I carry through those doors is all I'll have to fight with." },
]
[[prometheus_facility.choices]]
text = "Walk into the central lab with your gun drawn"
goto = "final_confrontation"
[[prometheus_facility.choices]]
text = "Lay out everything you've uncovered - make her see the whole pattern"
goto = "the_pattern_revealed"
any_items = ["Tolliver Sample", "Cross's Files", "Damien's Tape", "Marsh Ledger", "Marsh Confession", "Yacht Photograph", "Lethe Archive"]

[the_pattern_revealed]
mood = "mystery"
text = """
She's waiting at the center of the laboratory, surrounded by a hundred amber vials glowing like votive candles. The Fool is in her hand. She opens her mouth to begin.

You don't let her. You walk to the steel table and lay it down, piece by piece. What you dug up. What you were handed. What you stole. Tolliver's crystallized veins. Cross's signatures. The payments. The charge that was switched. You tell it the way she's been telling it in blood for five years, except you tell it in daylight words, the kind a jury could hear.

Cassandra listens. Halfway through, her hand with the Fool card begins to tremble. By the end she has set it down on the table beside the evidence, face up, and she is looking at you like a woman who's been shouting into a well for five years and finally heard an answer.

Behind the glass across the hall, the hooded man has gone quiet. Listening too."""
variants = [
  { if = "cards >= 3", text = """
She's waiting at the center of the laboratory, surrounded by a hundred amber vials glowing like votive candles. The Fool is in her hand. She opens her mouth to begin.

You don't let her. You empty your coat onto the steel table first: {cards} of her own tarot cards, creased and rain-stained, laid out in the order she dealt them. Then the rest, piece by piece. What you dug up. What you were handed. What you stole. Tolliver's crystallized veins. Cross's signatures. The payments. The charge that was switched. You tell it the way she's been telling it in blood for five years, except you tell it in daylight words, the kind a jury could hear.

Cassandra listens. Halfway through, her hand with the Fool card begins to tremble. By the end she has set it down beside the others, completing the row, and she is looking at you like a woman who's been shouting into a well for five years and finally heard an answer.

Behind the glass across the hall, the hooded man has gone quiet. Listening too.""" },
]
dialogue = [
  { who = "kane", line = "Tolliver was murdered with your husband's drug. Cross covered it. The others were paid to forget. And someone ordered the charge on that yacht changed." },
  { who = "cassandra", line = "You actually did it. You walked the whole path.", mood = "shocked" },
  { who = "kane", line = "Killing them doesn't put any of this in front of a jury. It puts it in the ground. Again. That's what they wanted all along." },
  { who = "cassandra", line = "And if I stop? If I hand you the last card? Who makes them answer?", mood = "sad" },
  { who = "kane", line = "I do. With all of it. In daylight." },
  { who = "cassandra", line = "Daylight. Alexander used to say that. Before they burned him.", mood = "pained" },
  { who = "cassandra", line = "You kept every card I left you. Most people throw them away. You read them.", mood = "sad", if = "cards >= 3" },
  { who = "cassandra", line = "But who would believe you in daylight, Marcus? Threats. Guns. Orders you tore up. They'll bury your evidence under your own record. Look what you've let yourself become.", mood = "smirk", if = "lines_crossed >= 4" },
  { who = "kane_thinking", line = "I could call Sarah. After the way I've treated her this week, I don't know if she'd pick up.", mood = "sad", if = "flag('sarah_partnered') && sarah_trust < 2" },
]
[[the_pattern_revealed.choices]]
text = "Name the man in the glass - Colonel Elias Vane - and take them both in alive"
goto = "true_ending"
any_flags = ["elias_exposed"]
if = "lines_crossed < 4"
[[the_pattern_revealed.choices]]
