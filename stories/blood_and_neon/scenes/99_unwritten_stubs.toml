text = """
Cassandra always shows you the stage and never the dressing room. So you stop looking where she points and start looking at what she touches.

Every card you've handled smelled faintly of diesel and salt. The silver ink never runs in the rain. You lay them out on the hood of your car under a streetlight: the Queen of Swords, the Tower, the photographs from the warehouse wall, all of them carrying the same faint grit in the creases. Sand. Harbor sand.

You call Riley. She calls you back in eleven minutes."""
dialogue = [
  { who = "riley", line = "The silver ink is marine enamel. Boatyards use it to letter names on hulls. It's made to survive salt water for twenty years." },
  { who = "kane", line = "Westmore's yacht was moored at Bellweather Marina. Who owns his slip now?" },
  { who = "riley", line = "Slip Seven. Sold two years ago to a shell company. Same registered agent as Ouroboros. And the power bill's been paid every month since.", mood = "shocked" },
