Every card you've handled smelled faintly of diesel and salt. The silver ink never runs in the rain. You lay them out on the hood of your car under a streetlight, all {cards} of the cards you've kept, plus the photographs from the warehouse wall. Every one carries the same faint grit in the creases. Sand. Harbor sand.

