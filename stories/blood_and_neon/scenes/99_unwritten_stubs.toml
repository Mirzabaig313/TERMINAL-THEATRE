goto = "shoot_cassandra"

# ─────────────────────────────────────────────────────────────
#  ENDINGS THE COUNTERS EARN
# ─────────────────────────────────────────────────────────────

[back_to_back_ending]
mood = "alert"
text = """
Two taps on the radio clipped to your collar. The old signal from the old nights: I've got the light, you've got the shot.

You kill the flashlight. In the half-second of black, Cassandra's eyes are still full of white glare and blind. Sarah is already moving. You hear the syringe hit the floorboards, the pistol skitter down the stairs, and then Sarah's voice, very calm, very close to Cassandra's ear: 'Lieutenant Vega. You're under arrest.'

When you hit the light again, Damien is curled at the top of the stairs, alive and weeping. Cassandra is on her knees with Sarah's cuffs on her wrists. She is laughing softly, not at you. At herself.

'Two of you,' she says. 'I planned for one Fool. I never planned for two people who trust each other. That isn't in any deck.'

The trial runs a year. Damien testifies from a hospital bed. Cassandra gives up every name she holds, one by one, on the condition that you and Sarah are the officers who hear them. The case files go out under both your signatures.

Sarah doesn't take the bullet. Nobody takes a bullet. On the last night of the trial, you split a bottle of bad scotch on the hood of her car in the rain, and neither of you says anything for a long time, because neither of you needs to.

ENDING: BACK TO BACK"""
ending = true

[seventh_card_ending]
mood = "danger"
text = """
You leave her standing over the evidence and walk across the hall. The decontamination door hisses open. Inside, the hooded man lifts his head at the sound of your footsteps.

You pull off the hood. Colonel Elias Vane blinks up at you, silver hair plastered to his skull, and he smiles, because he still thinks a policeman with a gun is an instrument he can play.

'Detective. Thank God. Get me out of here and I'll make you a very rich—'

You've crossed every other line this week. This one is just the next step. The shot is very loud in the tiled room.

When you come back, Cassandra is standing exactly where you left her. She doesn't look afraid. She looks sad, the way a teacher looks at a student who learned the lesson too well. She takes the Fool from the table and presses it into your hand.

'Septimus ex septem,' she says. 'I always knew the seventh card wasn't a death, Marcus. It was a successor.'

She walks out into the rain and you don't stop her. The evidence on the table burns with the rest of the lab before dawn. Somebody saw to that. You never ask yourself who.

A year later, a judge who took money to bury a case is found kneeling in a parking garage with a card between his hands. The newspapers say the tarot killer is back. Only one person in the city knows the handwriting is different.

ENDING: THE SEVENTH CARD"""
ending = true
