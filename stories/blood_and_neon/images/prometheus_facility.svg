<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- The dead Prometheus plant: black-glass tower behind a rusted gate, the half-lit neon titan with his torch, an empty town car idling, amber light at the door. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030209"/>
      <stop offset="0.75" stop-color="#140a26"/>
      <stop offset="1" stop-color="#2a0f36"/>
    </linearGradient>
    <linearGradient id="plant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150f22"/>
      <stop offset="1" stop-color="#22172e"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120a1c"/>
      <stop offset="1" stop-color="#030206"/>
    </linearGradient>
    <radialGradient id="amber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="titanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fire" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ff6a1a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff2a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headlight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e8fbff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rain" width="30" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(11)">
      <line x1="3" y1="0" x2="3" y2="16" stroke="#c4d8ff" stroke-width="1" stroke-opacity="0.4"/>
      <line x1="17" y1="20" x2="17" y2="32" stroke="#c4d8ff" stroke-width="1" stroke-opacity="0.28"/>
      <line x1="25" y1="6" x2="25" y2="14" stroke="#ffb6c8" stroke-width="1" stroke-opacity="0.22"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>

  <!-- the plant: a tombstone of black glass -->
  <rect x="150" y="30" width="340" height="250" fill="url(#plant)"/>
  <g stroke="#2c2040" stroke-width="1">
    <line x1="150" y1="50" x2="490" y2="50"/><line x1="150" y1="70" x2="490" y2="70"/><line x1="150" y1="90" x2="490" y2="90"/>
    <line x1="150" y1="110" x2="490" y2="110"/><line x1="150" y1="130" x2="490" y2="130"/><line x1="150" y1="150" x2="490" y2="150"/>
    <line x1="150" y1="170" x2="490" y2="170"/><line x1="150" y1="190" x2="490" y2="190"/><line x1="150" y1="210" x2="490" y2="210"/>
    <line x1="150" y1="230" x2="490" y2="230"/><line x1="150" y1="250" x2="490" y2="250"/>
    <line x1="200" y1="30" x2="200" y2="280"/><line x1="260" y1="30" x2="260" y2="280"/><line x1="380" y1="30" x2="380" y2="280"/>
    <line x1="440" y1="30" x2="440" y2="280"/>
  </g>
  <!-- rust streaks -->
  <g stroke="#5a2a1a" stroke-width="3" opacity="0.5">
    <line x1="176" y1="50" x2="174" y2="130"/><line x1="232" y1="90" x2="234" y2="200"/>
    <line x1="410" y1="70" x2="412" y2="160"/><line x1="466" y1="110" x2="464" y2="240"/>
  </g>
  <!-- broken panes, emergency lights -->
  <g fill="#020105">
    <rect x="210" y="72" width="40" height="16"/><rect x="390" y="152" width="40" height="16"/><rect x="160" y="212" width="30" height="16"/>
  </g>
  <g fill="#ff2a3d">
    <circle cx="186" cy="100" r="2"/><circle cx="420" cy="120" r="2"/><circle cx="300" cy="60" r="2"/><circle cx="460" cy="200" r="2"/>
  </g>
  <g fill="#ff2a3d" opacity="0.25">
    <circle cx="186" cy="100" r="7"/><circle cx="420" cy="120" r="7"/><circle cx="300" cy="60" r="7"/><circle cx="460" cy="200" r="7"/>
  </g>
  <!-- the doors, open, amber light spilling down the corridor -->
  <ellipse cx="320" cy="262" rx="70" ry="40" fill="url(#amber)"/>
  <rect x="300" y="226" width="40" height="54" fill="#ffb347" opacity="0.85"/>
  <polygon points="300,226 312,236 312,280 300,280" fill="#7a3a0a"/>
  <polygon points="340,226 328,236 328,280 340,280" fill="#7a3a0a"/>
  <rect x="314" y="236" width="12" height="44" fill="#ffe2a8"/>
  <!-- ground -->
  <rect x="0" y="280" width="640" height="80" fill="url(#ground)"/>
  <polygon points="300,280 340,280 380,360 260,360" fill="#ffb347" opacity="0.1"/>

  <!-- candle trail leading out of the doors -->
  <g fill="#ffd27a">
    <circle cx="316" cy="290" r="1.6"/><circle cx="326" cy="290" r="1.6"/><circle cx="312" cy="302" r="1.8"/>
    <circle cx="330" cy="302" r="1.8"/><circle cx="306" cy="318" r="2"/><circle cx="336" cy="318" r="2"/>
  </g>
  <g fill="#ff3b3b" opacity="0.3">
    <circle cx="312" cy="302" r="5"/><circle cx="330" cy="302" r="5"/><circle cx="306" cy="318" r="6"/><circle cx="336" cy="318" r="6"/>
  </g>

  <!-- the gate arch with the neon titan, half its tubes dead -->
  <rect x="96" y="150" width="14" height="150" fill="#040208"/>
  <rect x="530" y="150" width="14" height="150" fill="#040208"/>
  <path d="M96 160 Q320 96 544 160" stroke="#040208" stroke-width="10" fill="none"/>
  <ellipse cx="320" cy="100" rx="70" ry="60" fill="url(#titanGlow)"/>
  <ellipse cx="350" cy="60" rx="34" ry="34" fill="url(#fire)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- live tubes: magenta glow -->
    <g stroke="#ff2a6d" stroke-width="5" filter="url(#glow)">
      <circle cx="312" cy="80" r="8"/>
      <path d="M296 92 L328 92 L322 128 L302 128 Z"/>
      <path d="M328 94 L346 74"/>
      <path d="M304 128 L298 160"/>
    </g>
    <g stroke="#ffd0de" stroke-width="1.6">
      <circle cx="312" cy="80" r="8"/>
      <path d="M296 92 L328 92 L322 128 L302 128 Z"/>
      <path d="M328 94 L346 74"/>
      <path d="M304 128 L298 160"/>
    </g>
    <!-- dead tubes: dark glass -->
    <g stroke="#4a3450" stroke-width="2.5">
      <path d="M296 94 L284 120"/>
      <path d="M320 128 L330 160"/>
      <path d="M302 108 L322 108"/>
    </g>
    <!-- the torch: flaring, as if he burns -->
    <path d="M346 76 L350 66" stroke="#ffb347" stroke-width="3"/>
  </g>
  <path d="M350 64 q-10 -12 -2 -26 q2 10 8 8 q2 -10 -2 -16 q14 10 6 30 z" fill="#ff7a1a"/>
  <path d="M350 62 q-4 -8 0 -16 q4 8 4 12 z" fill="#ffe2a8"/>

  <!-- gate bars -->
  <g stroke="#040208" stroke-width="4">
    <line x1="120" y1="170" x2="120" y2="300"/><line x1="140" y1="166" x2="140" y2="300"/><line x1="160" y1="162" x2="160" y2="300"/>
    <line x1="180" y1="158" x2="180" y2="300"/><line x1="200" y1="155" x2="200" y2="300"/>
    <line x1="440" y1="155" x2="440" y2="300"/><line x1="460" y1="158" x2="460" y2="300"/><line x1="480" y1="162" x2="480" y2="300"/>
    <line x1="500" y1="166" x2="500" y2="300"/><line x1="520" y1="170" x2="520" y2="300"/>
  </g>
  <line x1="110" y1="290" x2="210" y2="290" stroke="#040208" stroke-width="4"/>
  <line x1="430" y1="290" x2="530" y2="290" stroke="#040208" stroke-width="4"/>
  <!-- gate leaves swung open -->
  <polygon points="210,154 262,170 262,312 210,300" fill="none" stroke="#040208" stroke-width="4"/>
  <polygon points="430,154 378,170 378,312 430,300" fill="none" stroke="#040208" stroke-width="4"/>

  <!-- the black town car idling, driver's door open, nobody inside -->
  <polygon points="540,281 540,289 380,340 380,252" fill="url(#headlight)" opacity="0.8"/>
  <path d="M640 280 L600 258 Q590 252 576 252 L548 254 Q536 258 534 274 L532 300 L640 300 Z" fill="#06050a"/>
  <path d="M560 258 L596 258 L612 276 L560 276 Z" fill="#1a1428"/>
  <rect x="536" y="282" width="8" height="5" rx="1" fill="#e8fbff"/>
  <!-- the open door, interior light glowing -->
  <polygon points="578,276 556,268 556,304 578,300" fill="#0e0a16" stroke="#2a2040" stroke-width="1"/>
  <rect x="582" y="262" width="20" height="14" fill="#ffd27a" opacity="0.35"/>
  <circle cx="560" cy="304" r="12" fill="#020104"/><circle cx="626" cy="304" r="12" fill="#020104"/>
  <!-- exhaust -->
  <path d="M640 296 q-8 -6 -2 -14" stroke="#7a6a90" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- puddle reflections -->
  <g opacity="0.45">
    <rect x="300" y="300" width="40" height="3" fill="#ffb347"/>
    <rect x="290" y="330" width="60" height="2" fill="#ffb347"/>
    <rect x="300" y="344" width="30" height="2" fill="#ff2a6d"/>
    <rect x="420" y="320" width="90" height="2" fill="#e8fbff"/>
  </g>

  <!-- Kane walking toward the open doors -->
  <g transform="translate(-60 0)">
  <g fill="#020105">
    <ellipse cx="290" cy="276" rx="17" ry="3.5"/>
    <path d="M281 276 L283 266 Q290 262 297 266 L299 276 Z"/>
    <ellipse cx="290" cy="282" rx="7" ry="8.5"/>
    <path d="M276 294 Q290 288 304 294 L314 352 L266 352 Z"/>
    <path d="M304 296 L316 336 L308 338 L298 306 Z"/>
  </g>
  <path d="M298 268 Q302 284 304 294 L314 352" stroke="#ffb347" stroke-width="1.6" fill="none" opacity="0.9"/>
  <path d="M281 270 Q278 284 276 294 L266 352" stroke="#ff2a6d" stroke-width="1.4" fill="none" opacity="0.7"/>
  </g>

  <rect width="640" height="360" fill="url(#rain)"/>
</svg>
