<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- 3 AM: Kane's dark apartment, rain-streaked window on a neon city, phone glowing, scotch on the table, coat on the hook. -->
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07060e"/>
      <stop offset="1" stop-color="#0d0a18"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0820"/>
      <stop offset="0.6" stop-color="#2a0f3e"/>
      <stop offset="1" stop-color="#561a4f"/>
    </linearGradient>
    <radialGradient id="magGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="phoneGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ff3ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6a2cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scotch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#8a3b0a"/>
    </linearGradient>
    <pattern id="rain" width="34" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <line x1="4" y1="0" x2="4" y2="16" stroke="#b9d8ff" stroke-width="1" stroke-opacity="0.45"/>
      <line x1="19" y1="22" x2="19" y2="34" stroke="#b9d8ff" stroke-width="1" stroke-opacity="0.3"/>
      <line x1="28" y1="8" x2="28" y2="18" stroke="#ffb3cc" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="win"><rect x="200" y="40" width="380" height="230"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#room)"/>

  <!-- the city through the window -->
  <g clip-path="url(#win)">
    <rect x="200" y="40" width="380" height="230" fill="url(#sky)"/>
    <!-- distant towers -->
    <rect x="200" y="200" width="380" height="70" fill="#ff2a6d" opacity="0.12"/>
    <g fill="#150c2a" stroke="#2b1a4a" stroke-width="1">
      <rect x="205" y="120" width="40" height="150"/>
      <rect x="250" y="90" width="30" height="180"/>
      <rect x="285" y="140" width="50" height="130"/>
      <rect x="340" y="70" width="36" height="200"/>
      <rect x="382" y="130" width="44" height="140"/>
      <rect x="430" y="100" width="28" height="170"/>
      <rect x="462" y="150" width="60" height="120"/>
      <rect x="526" y="84" width="50" height="186"/>
    </g>
    <!-- lit windows -->
    <g fill="#ffd27a" opacity="0.55">
      <rect x="256" y="104" width="4" height="5"/><rect x="268" y="124" width="4" height="5"/>
      <rect x="348" y="90" width="4" height="5"/><rect x="362" y="118" width="4" height="5"/>
      <rect x="348" y="160" width="4" height="5"/><rect x="438" y="118" width="4" height="5"/>
      <rect x="534" y="104" width="4" height="5"/><rect x="556" y="140" width="4" height="5"/>
      <rect x="296" y="160" width="4" height="5"/><rect x="214" y="140" width="4" height="5"/>
    </g>
    <!-- neon signs, glowing -->
    <ellipse cx="300" cy="150" rx="60" ry="40" fill="url(#magGlow)"/>
    <ellipse cx="490" cy="180" rx="70" ry="44" fill="url(#cyanGlow)"/>
    <rect x="288" y="128" width="22" height="46" rx="3" fill="none" stroke="#ff2a6d" stroke-width="3" filter="url(#blur)"/>
    <rect x="288" y="128" width="22" height="46" rx="3" fill="none" stroke="#ffc2d6" stroke-width="1.2"/>
    <path d="M470 172 h40 M470 184 h28" stroke="#00e5ff" stroke-width="4" filter="url(#blur)"/>
    <path d="M470 172 h40 M470 184 h28" stroke="#c8fbff" stroke-width="1.4"/>
    <circle cx="398" cy="100" r="9" fill="none" stroke="#ff2a6d" stroke-width="2" opacity="0.8"/>
    <!-- rain on the glass -->
    <rect x="200" y="40" width="380" height="230" fill="url(#rain)"/>
    <!-- droplets -->
    <g fill="#d6e8ff" opacity="0.5">
      <circle cx="230" cy="70" r="1.6"/><circle cx="318" cy="210" r="1.4"/><circle cx="410" cy="84" r="1.8"/>
      <circle cx="455" cy="230" r="1.4"/><circle cx="540" cy="60" r="1.5"/><circle cx="262" cy="240" r="1.3"/>
    </g>
  </g>
  <!-- window frame -->
  <rect x="200" y="40" width="380" height="230" fill="none" stroke="#1b1428" stroke-width="10"/>
  <line x1="390" y1="40" x2="390" y2="270" stroke="#1b1428" stroke-width="8"/>
  <line x1="200" y1="155" x2="580" y2="155" stroke="#1b1428" stroke-width="6"/>
  <rect x="190" y="268" width="400" height="10" fill="#140f20"/>

  <!-- neon light spilling into the room -->
  <polygon points="200,278 580,278 640,360 100,360" fill="url(#spill)"/>
  <!-- window shadow bars on the floor -->
  <g fill="#07060e" opacity="0.7">
    <polygon points="380,278 398,278 430,360 404,360"/>
  </g>

  <!-- coat hook on the left wall: the empty coat waits -->
  <rect x="58" y="70" width="18" height="6" fill="#2a2238"/>
  <path d="M60 76 L48 210 L92 214 L80 76 Z" fill="#0a0812" stroke="#2c1f40" stroke-width="1.5"/>
  <path d="M54 92 L66 96 L64 200" stroke="#1d1630" stroke-width="2" fill="none"/>
  <ellipse cx="68" cy="66" rx="24" ry="5" fill="#0a0812"/>
  <rect x="56" y="48" width="24" height="19" rx="5" fill="#0a0812" stroke="#2c1f40" stroke-width="1.5"/>

  <!-- Kane: silhouette at the window, shirt sleeves, shoulders heavy -->
  <g fill="#040309">
    <ellipse cx="420" cy="132" rx="15" ry="18"/>
    <path d="M412 148 h16 v10 h-16 z"/>
    <path d="M394 158 Q420 150 446 158 L452 280 L388 280 Z"/>
    <path d="M394 158 Q382 162 378 178 L370 246 L382 250 L392 186 Z"/>
    <path d="M446 158 Q458 162 462 178 L470 246 L458 250 L448 186 Z"/>
  </g>
  <!-- rim light on his shoulder from the neon -->
  <path d="M394 159 Q420 151 446 159" stroke="#ff2a6d" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M434 128 Q436 140 430 148" stroke="#00e5ff" stroke-width="1.2" fill="none" opacity="0.7"/>

  <!-- table in the foreground -->
  <path d="M0 300 L300 290 L330 360 L0 360 Z" fill="#0f0b19"/>
  <path d="M0 300 L300 290" stroke="#3a1f45" stroke-width="2"/>
  <!-- the phone, screaming -->
  <ellipse cx="150" cy="300" rx="60" ry="22" fill="url(#phoneGlow)"/>
  <rect x="128" y="296" width="44" height="12" rx="3" fill="#0b2a33" stroke="#00e5ff" stroke-width="1.5" transform="rotate(-3 150 302)"/>
  <rect x="134" y="299" width="32" height="6" rx="1" fill="#9ff7ff" transform="rotate(-3 150 302)"/>
  <!-- vibration marks -->
  <g stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M118 290 q-6 6 0 12"/><path d="M110 286 q-9 10 0 20"/>
    <path d="M182 288 q6 6 0 12"/><path d="M190 284 q9 10 0 20"/>
  </g>
  <!-- the scotch: bottle and glass -->
  <path d="M236 230 h12 v20 q12 6 12 18 v42 h-36 v-42 q0 -12 12 -18 z" fill="#1a0f12"/>
  <path d="M226 278 h32 v30 h-32 z" fill="url(#scotch)" opacity="0.55"/>
  <path d="M250 252 q8 6 8 16" stroke="#ff2a6d" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M268 292 h22 l-3 22 h-16 z" fill="#2a1a22" stroke="#7a5a6a" stroke-width="1"/>
  <path d="M270 302 h18 l-2 11 h-14 z" fill="url(#scotch)"/>
  <!-- service revolver -->
  <path d="M40 318 h56 v8 h-30 l-8 14 h-12 l4 -14 h-10 z" fill="#06050a" stroke="#2c2338" stroke-width="1"/>
</svg>
