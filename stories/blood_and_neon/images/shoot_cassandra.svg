<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- The Executioner: smoke curls from Kane's lowered gun; shattered Nightshade vials spill amber across the lab floor around the fallen Fool card and an open hand. -->
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05030a"/>
      <stop offset="1" stop-color="#120a1a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1020"/>
      <stop offset="1" stop-color="#050208"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#9fd8ff" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ff8a2a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#b8400a" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="spillGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shelfGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="rain" width="26" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(6)">
      <line x1="3" y1="0" x2="3" y2="14" stroke="#c4e4ff" stroke-width="1" stroke-opacity="0.45"/>
      <line x1="15" y1="18" x2="15" y2="30" stroke="#c4e4ff" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#room)"/>
  <!-- shelves of vials in the dark, right side -->
  <rect x="360" y="40" width="280" height="170" fill="url(#shelfGlow)"/>
  <g fill="#ffb347" opacity="0.55">
    <rect x="420" y="70" width="4" height="12" rx="1"/><rect x="440" y="70" width="4" height="12" rx="1"/><rect x="460" y="70" width="4" height="12" rx="1"/>
    <rect x="480" y="70" width="4" height="12" rx="1"/><rect x="500" y="70" width="4" height="12" rx="1"/><rect x="540" y="70" width="4" height="12" rx="1"/>
    <rect x="560" y="70" width="4" height="12" rx="1"/><rect x="600" y="70" width="4" height="12" rx="1"/><rect x="620" y="70" width="4" height="12" rx="1"/>
    <rect x="430" y="110" width="4" height="12" rx="1"/><rect x="470" y="110" width="4" height="12" rx="1"/><rect x="490" y="110" width="4" height="12" rx="1"/>
    <rect x="530" y="110" width="4" height="12" rx="1"/><rect x="570" y="110" width="4" height="12" rx="1"/><rect x="610" y="110" width="4" height="12" rx="1"/>
    <rect x="440" y="150" width="4" height="12" rx="1"/><rect x="520" y="150" width="4" height="12" rx="1"/><rect x="590" y="150" width="4" height="12" rx="1"/>
  </g>
  <g stroke="#2a1a2e" stroke-width="2">
    <line x1="400" y1="84" x2="640" y2="84"/><line x1="400" y1="124" x2="640" y2="124"/><line x1="400" y1="164" x2="640" y2="164"/>
  </g>
  <!-- empty slots where the vials fell -->
  <g fill="#000" opacity="0.6"><rect x="520" y="70" width="4" height="12"/><rect x="580" y="70" width="4" height="12"/><rect x="450" y="110" width="4" height="12"/></g>

  <!-- the floor -->
  <polygon points="0,210 640,210 640,360 0,360" fill="url(#floor)"/>

  <!-- column of cold light and rain from the skylight -->
  <polygon points="330,0 430,0 520,300 300,300" fill="url(#cone)"/>
  <polygon points="330,0 430,0 520,300 300,300" fill="url(#rain)"/>

  <!-- the spill: amber Nightshade spreading in patterns -->
  <ellipse cx="430" cy="290" rx="190" ry="54" fill="url(#spillGlow)"/>
  <path d="M320 292 Q330 262 400 262 Q460 250 520 264 Q566 274 560 296 Q552 318 480 320 Q420 330 370 318 Q316 310 320 292 Z" fill="url(#spill)"/>
  <!-- tendrils, like abstract art -->
  <g fill="none" stroke="#ffb347" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M548 280 Q580 276 600 290 Q612 300 630 296"/>
    <path d="M340 306 Q310 318 290 312 Q270 306 252 316"/>
    <path d="M480 316 Q490 334 520 340"/>
  </g>
  <!-- a darker thread through the amber; implication only -->
  <path d="M400 300 Q430 282 470 292 Q500 300 520 286" stroke="#a8123a" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M370 290 Q384 284 396 292" stroke="#a8123a" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- shards of shattered vials catching the light -->
  <g fill="#fff0d0" opacity="0.85">
    <polygon points="360,276 368,270 366,280"/><polygon points="420,262 430,258 426,266"/><polygon points="500,272 510,268 506,278"/>
    <polygon points="452,306 462,300 458,310"/><polygon points="534,296 544,292 540,302"/><polygon points="386,312 392,306 394,314"/>
    <polygon points="580,286 586,282 586,290"/><polygon points="310,296 316,292 316,300"/>
  </g>
  <!-- a broken vial on its side -->
  <rect x="470" y="276" width="18" height="6" rx="2" fill="#ffd27a" stroke="#fff0d0" stroke-width="0.8" transform="rotate(-18 479 279)"/>

  <!-- her hand, open, at the edge of the light; hair fanned on the floor -->
  <path d="M640 250 Q600 244 584 258 Q574 268 590 276 Q620 282 640 278 Z" fill="#06030a"/>
  <path d="M584 262 Q560 266 546 274 L540 272 L548 266 L536 266 L538 262 L552 260 L544 256 L548 252 L562 258 Q574 254 586 256 Z" fill="#0c0612"/>
  <path d="M584 258 Q574 268 590 276" stroke="#ffb347" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- the Fool card, face up in the spill -->
  <ellipse cx="440" cy="286" rx="34" ry="14" fill="url(#cardGlow)"/>
  <g transform="rotate(-14 440 286)">
    <rect x="428" y="272" width="24" height="30" rx="2" fill="#fff6f0" stroke="#ff2a6d" stroke-width="1.2"/>
    <rect x="431" y="275" width="18" height="20" fill="#2a3a6a"/>
    <circle cx="444" cy="279" r="2.2" fill="#ffd27a"/>
    <path d="M431 295 L440 288 L449 295 Z" fill="#1a1028"/>
    <circle cx="437" cy="284" r="1.2" fill="#fff6f0"/>
    <path d="M437 285 l0 5 m-2 -3 l4 0" stroke="#fff6f0" stroke-width="0.8"/>
    <circle cx="440" cy="298.5" r="1.3" fill="#ff2a6d"/>
  </g>

  <!-- Kane standing, gun lowered, left side -->
  <g fill="#020104">
    <ellipse cx="150" cy="96" rx="34" ry="7"/>
    <path d="M132 96 L136 78 Q150 72 164 78 L168 96 Z"/>
    <ellipse cx="150" cy="110" rx="15" ry="18"/>
    <path d="M122 136 Q150 126 178 136 L196 330 L104 330 Z"/>
    <!-- right arm hanging with the gun -->
    <path d="M176 136 Q198 172 206 214 L196 218 Q188 184 172 152 Z"/>
    <path d="M194 214 L210 211 L214 246 L206 248 L204 228 L197 228 Z"/>
    <!-- left arm -->
    <path d="M124 136 Q102 176 98 216 L108 218 Q114 184 128 152 Z"/>
    <rect x="128" y="328" width="14" height="10"/><rect x="160" y="328" width="14" height="10"/>
  </g>
  <!-- rim light from the amber spill -->
  <path d="M178 138 L196 330" stroke="#ffb347" stroke-width="1.4" fill="none" opacity="0.7"/>
  <path d="M178 134 Q200 172 207 214 L211 212 L215 246" stroke="#ffb347" stroke-width="1.6" fill="none" opacity="0.9"/>
  <path d="M164 80 Q168 96 166 112" stroke="#9fd8ff" stroke-width="1" fill="none" opacity="0.6"/>
    <!-- smoke curling from the barrel -->
  <path d="M210 248 Q222 238 216 226 Q208 214 218 202 Q228 190 220 176 Q214 164 224 152" stroke="#b8a8d0" stroke-width="2.5" fill="none" opacity="0.5" filter="url(#soft)"/>
  <path d="M210 248 Q222 238 216 226 Q208 214 218 202 Q228 190 220 176" stroke="#e8e0ff" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- his shadow stretching toward her -->
  <polygon points="96,338 204,338 330,300 300,296" fill="#000" opacity="0.35"/>
</svg>
