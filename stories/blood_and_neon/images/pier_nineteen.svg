<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- Pier 19 at 3 AM: a kneeling figure posed at the pier's end with a glowing tarot card, police lights strobing red and blue, Kane watching in the rain. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05040d"/>
      <stop offset="0.7" stop-color="#1a0d30"/>
      <stop offset="1" stop-color="#3a1446"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a26"/>
      <stop offset="1" stop-color="#04030a"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1430"/>
      <stop offset="1" stop-color="#0b0814"/>
    </linearGradient>
    <radialGradient id="red" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2a3d" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff2a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a6bff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#2a6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="card" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#ff2a6d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cityglow" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a3d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff2a3d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a6bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2a6bff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rain" width="30" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(10)">
      <line x1="3" y1="0" x2="3" y2="15" stroke="#c4d8ff" stroke-width="1" stroke-opacity="0.4"/>
      <line x1="17" y1="20" x2="17" y2="31" stroke="#c4d8ff" stroke-width="1" stroke-opacity="0.28"/>
      <line x1="25" y1="6" x2="25" y2="14" stroke="#ffb6c8" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- distant skyline across the water -->
  <ellipse cx="500" cy="196" rx="200" ry="50" fill="url(#cityglow)"/>
  <!-- low clouds lit from below by the city -->
  <ellipse cx="480" cy="70" rx="220" ry="26" fill="#2a1240" opacity="0.6"/>
  <ellipse cx="160" cy="44" rx="200" ry="20" fill="#1c0d30" opacity="0.7"/>
  <ellipse cx="520" cy="110" rx="160" ry="16" fill="#3a1650" opacity="0.5"/>
  <g fill="#1d1236" stroke="#2f1f50" stroke-width="1">
    <rect x="392" y="140" width="20" height="56"/><rect x="414" y="104" width="16" height="92"/>
    <rect x="434" y="150" width="26" height="46"/><rect x="462" y="80" width="14" height="116"/>
    <rect x="480" y="126" width="28" height="70"/><rect x="510" y="66" width="20" height="130"/>
    <rect x="534" y="140" width="30" height="56"/><rect x="566" y="100" width="20" height="96"/>
    <rect x="590" y="136" width="50" height="60"/>
    <rect x="0" y="150" width="50" height="46"/><rect x="52" y="128" width="22" height="68"/><rect x="76" y="160" width="40" height="36"/>
  </g>
  <line x1="469" y1="80" x2="469" y2="62" stroke="#1d1236" stroke-width="2"/>
  <circle cx="469" cy="62" r="2" fill="#ff2a6d"/>
  <!-- holographic billboard on the tallest tower -->
  <rect x="506" y="78" width="28" height="40" fill="#ff2a6d" opacity="0.18"/>
  <rect x="512" y="84" width="16" height="28" rx="2" fill="none" stroke="#ff2a6d" stroke-width="2.5" filter="url(#blur)"/>
  <rect x="512" y="84" width="16" height="28" rx="2" fill="none" stroke="#ffc2d6" stroke-width="1"/>
  <path d="M520 88 v20 M516 104 h8" stroke="#ffc2d6" stroke-width="1"/>
  <g fill="#00e5ff" opacity="0.85">
    <rect x="417" y="116" width="10" height="2"/><rect x="466" y="96" width="6" height="2"/><rect x="569" y="112" width="12" height="2"/>
    <rect x="56" y="140" width="12" height="2"/>
  </g>
  <g fill="#ffd27a" opacity="0.5">
    <rect x="396" y="156" width="3" height="4"/><rect x="440" y="164" width="3" height="4"/><rect x="486" y="140" width="3" height="4"/>
    <rect x="496" y="170" width="3" height="4"/><rect x="540" y="160" width="3" height="4"/><rect x="600" y="150" width="3" height="4"/>
    <rect x="20" y="166" width="3" height="4"/><rect x="84" y="174" width="3" height="4"/>
  </g>
  <g fill="#ff2a6d" opacity="0.85">
    <rect x="396" y="148" width="8" height="2"/><rect x="540" y="150" width="10" height="2"/>
  </g>

  <!-- the sea -->
  <rect x="0" y="196" width="640" height="164" fill="url(#sea)"/>
  <g stroke-linecap="round" opacity="0.7">
    <line x1="460" y1="206" x2="500" y2="206" stroke="#00e5ff" stroke-width="1.5"/>
    <line x1="510" y1="214" x2="530" y2="214" stroke="#00e5ff" stroke-width="1"/>
    <line x1="420" y1="210" x2="440" y2="210" stroke="#ff2a6d" stroke-width="1.5"/>
    <line x1="560" y1="222" x2="600" y2="222" stroke="#ff2a6d" stroke-width="1"/>
    <line x1="40" y1="230" x2="110" y2="230" stroke="#ff2a3d" stroke-width="2"/>
    <line x1="20" y1="252" x2="90" y2="252" stroke="#2a6bff" stroke-width="2"/>
    <line x1="560" y1="250" x2="620" y2="250" stroke="#2a6bff" stroke-width="1.5"/>
  </g>

  <!-- pilings -->
  <g fill="#07050e">
    <rect x="296" y="232" width="6" height="40"/><rect x="458" y="232" width="6" height="40"/>
    <rect x="250" y="260" width="9" height="60"/><rect x="503" y="260" width="9" height="60"/>
    <rect x="190" y="300" width="12" height="60"/><rect x="562" y="300" width="12" height="60"/>
  </g>
  <!-- the pier deck, receding -->
  <polygon points="300,230 460,230 600,360 140,360" fill="url(#deck)"/>
  <g stroke="#2a1f40" stroke-width="1">
    <line x1="288" y1="242" x2="472" y2="242"/><line x1="272" y1="258" x2="488" y2="258"/>
    <line x1="250" y1="280" x2="510" y2="280"/><line x1="222" y1="306" x2="538" y2="306"/>
    <line x1="186" y1="338" x2="574" y2="338"/>
  </g>
  <line x1="300" y1="230" x2="460" y2="230" stroke="#3c2a58" stroke-width="2"/>
  <!-- wet deck reflecting the police lights -->
  <polygon points="140,360 300,230 330,230 240,360" fill="#ff2a3d" opacity="0.12"/>
  <polygon points="240,360 330,230 360,230 330,360" fill="#2a6bff" opacity="0.12"/>
  <ellipse cx="380" cy="244" rx="40" ry="6" fill="#ff2a6d" opacity="0.25"/>

  <!-- police tape across the pier -->
  <path d="M206 296 L380 288 L556 296" stroke="#ffd23f" stroke-width="3" fill="none" opacity="0.85"/>
  <g stroke="#1a1408" stroke-width="3" opacity="0.6">
    <line x1="240" y1="294" x2="250" y2="293"/><line x1="290" y1="291" x2="300" y2="291"/>
    <line x1="340" y1="289" x2="350" y2="289"/><line x1="410" y1="289" x2="420" y2="289"/>
    <line x1="460" y1="291" x2="470" y2="291"/><line x1="510" y1="293" x2="520" y2="294"/>
  </g>
  <rect x="204" y="290" width="4" height="40" fill="#0a0814"/>
  <rect x="554" y="290" width="4" height="40" fill="#0a0814"/>

  <!-- the body at the end of the pier, kneeling, arms out, head tilted back -->
  <ellipse cx="380" cy="214" rx="34" ry="24" fill="url(#card)"/>
  <g fill="#050309">
    <path d="M366 232 Q368 222 376 220 L388 220 Q396 222 396 232 Z"/>
    <path d="M374 222 L372 196 Q380 190 388 196 L388 222 Z"/>
    <ellipse cx="379" cy="187" rx="5.5" ry="6.5" transform="rotate(-25 379 187)"/>
    <path d="M374 198 L352 192 L350 196 L374 204 Z"/>
    <path d="M386 198 L408 192 L410 196 L386 204 Z"/>
  </g>
  <!-- the card: Queen of Swords, glowing -->
  <rect x="375" y="205" width="9" height="13" rx="1" fill="#fff5f8" stroke="#ff2a6d" stroke-width="1"/>
  <line x1="379.5" y1="207" x2="379.5" y2="216" stroke="#ff2a6d" stroke-width="1"/>

  <!-- police car at the foot of the pier, lightbar blazing -->
  <polygon points="0,180 220,216 220,360 0,360" fill="url(#beamR)" opacity="0.6"/>
  <ellipse cx="66" cy="244" rx="70" ry="50" fill="url(#red)"/>
  <ellipse cx="118" cy="244" rx="70" ry="50" fill="url(#blue)"/>
  <path d="M0 290 L20 266 Q40 254 70 254 L130 254 Q156 256 170 272 L196 284 Q206 290 206 304 L206 318 L0 318 Z" fill="#06050b"/>
  <rect x="70" y="246" width="22" height="7" rx="2" fill="#ff2a3d"/>
  <rect x="92" y="246" width="22" height="7" rx="2" fill="#2a6bff"/>
  <rect x="66" y="244" width="52" height="11" rx="3" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <circle cx="44" cy="318" r="16" fill="#030206"/><circle cx="168" cy="318" r="16" fill="#030206"/>
  <path d="M30 266 L60 260 L60 284 L24 284 Z" fill="#160f28"/>

  <!-- Captain Reeves, smoking in the rain -->
  <g fill="#050309">
    <ellipse cx="232" cy="234" rx="7" ry="8"/>
    <path d="M222 244 Q232 240 242 244 L246 300 L218 300 Z"/>
  </g>
  <circle cx="240" cy="236" r="2" fill="#ff8a3d"/>
  <circle cx="240" cy="236" r="6" fill="#ff8a3d" opacity="0.25"/>
  <path d="M241 232 q4 -8 0 -14 q-4 -6 2 -12" stroke="#8a7aa0" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Kane in the foreground, long coat, back to us -->
  <g fill="#020105">
    <ellipse cx="470" cy="226" rx="34" ry="6"/>
    <path d="M454 224 Q470 206 486 224 Z"/>
    <ellipse cx="470" cy="236" rx="12" ry="14"/>
    <path d="M444 254 Q470 244 496 254 L516 360 L424 360 Z"/>
    <path d="M446 258 L432 334 L446 336 L458 278 Z"/>
    <path d="M494 258 L508 334 L494 336 L482 278 Z"/>
  </g>
  <path d="M446 254 Q470 245 494 254" stroke="#2a6bff" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M496 256 L514 352" stroke="#ff2a6d" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- rain over everything -->
  <rect width="640" height="360" fill="url(#rain)"/>
  <!-- strobe flare -->
  <circle cx="81" cy="249" r="10" fill="#ff6a7a" filter="url(#blur)"/>
  <circle cx="103" cy="249" r="10" fill="#6a9bff" filter="url(#blur)"/>
</svg>
