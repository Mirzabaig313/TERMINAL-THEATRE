title = "BLOOD AND NEON"
description = "The city never sleeps, but it dreams. Dark dreams.\nYou're Marcus Kane, a detective who's seen too much and forgotten too little.\nThree bodies in three nights. All connected. All pointing to something\nthat shouldn't exist. In the shadows between neon lights,\nthe truth waits. Along with something far worse."
start = "prologue"
summary = "An Epic Noir Detective Saga"
blurb = """
The city never sleeps, but it dreams. Dark dreams.
You're Marcus Kane, a detective investigating three ritualistic murders
connected by tarot cards and a pharmaceutical conspiracy.

Seven victims. Seven sacrifices. One chance to stop a brilliant killer
before the pattern completes and the city drowns in blood.
⏱ Playtime: 60-90 minutes | 🎭 Full Story | 🔀 Deep Branching | 8+ Endings"""
