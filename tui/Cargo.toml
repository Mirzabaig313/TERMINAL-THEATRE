[package]
name = "terminal-theatre"
description = "Terminal front-end for Terminal Theatre stories."
edition.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "theatre"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
ratatui.workspace = true
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "vorbis", "wav", "mp3", "flac"], optional = true }
tachyonfx = { version = "0.25.2", default-features = false, features = ["std"] }
theatre-engine.workspace = true


[features]
# sound needs an audio library at build time on Linux (ALSA: libasound2-dev);
# build with --no-default-features for a silent game
default = ["sound"]
sound = ["dep:rodio"]
