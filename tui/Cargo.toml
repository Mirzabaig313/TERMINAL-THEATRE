[package]
name = "terminal-theatre"
description = "Terminal front-end for Terminal Theatre stories."
edition.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "theatre"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
ratatui.workspace = true
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
tachyonfx = { version = "0.25.2", default-features = false, features = ["std"] }
theatre-engine.workspace = true
