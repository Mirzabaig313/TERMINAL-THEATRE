[workspace]
members = ["engine", "tui"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
theatre-engine = { path = "engine" }

# Dependencies (SVG and image decoding especially) are slow unoptimized; build them
# optimized even in dev so `cargo run` and tests stay quick. Our own code stays debug.
[profile.dev.package."*"]
opt-level = 2
